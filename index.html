  <style>
    /* Заглушка головної: тривимірне гірське озеро, яке малює відеокарта (WebGL) за справжнім часом доби.
       Рельєф гір будується променем (raymarching): ерозійні схили, ліс, сніг, тіні від гір і хмар.
       Озеро з фізичним віддзеркаленням, хвилями й колами на воді; хмари в перспективі; туман над водою вранці;
       зорі, Чумацький Шлях, місяць, падаючі зірки. Другий прохід — промені світла від сонця чи місяця.
       Локацією можна трохи мандрувати: тягнути — роззирнутися, колесо / W S / стрілки / два пальці — летіти,
       подвійний клік — назад на старт. Камера не заходить у гори й воду.
       Для перевірки: /?t=19.5 (година), /?q=.5 (роздільна здатність), /?cam=x,y,z,поворот,нахил. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; color: #fff; -webkit-tap-highlight-color: transparent;
      background: linear-gradient(#0b1230, #3a2f5c 55%, #e08a6a); }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.6s ease; }
    #gl.on { opacity: 1; }
    .fx { position: fixed; inset: 0; pointer-events: none; will-change: transform; }

    /* птахи */
    .bird { position: absolute; width: 20px; height: 9px; opacity: var(--birds, 0); }
    .bird svg { width: 100%; height: 100%; overflow: visible; }
    .bird path { fill: none; stroke: #141a26; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform-origin: 50% 80%; animation: flap .5s ease-in-out infinite alternate; }
    @keyframes flap { to { transform: scaleY(-.6); } }

    /* світлячки */
    .ff { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff7b0; box-shadow: 0 0 8px 3px rgba(255,232,120,.8), 0 0 22px 6px rgba(255,220,90,.25); opacity: 0;
      animation: ffly var(--d) ease-in-out infinite, ffblink var(--b) ease-in-out infinite; }
    #ffs { opacity: var(--ff, 0); }
    @keyframes ffly { 25% { translate: 22px -14px; } 50% { translate: 6px -32px; } 75% { translate: -18px -16px; } }
    @keyframes ffblink { 0%, 100% { opacity: 0; } 45%, 60% { opacity: 1; } }

    /* текст */
    .hero { position: fixed; left: 0; right: 0; top: 15vh; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; pointer-events: none; z-index: 5; will-change: transform; }
    .name { font-size: clamp(56px, 10.5vw, 136px); font-weight: 800; letter-spacing: -.045em; line-height: 1;
      text-shadow: 0 1px 1px rgba(0,0,0,.15), 0 8px 36px rgba(0,0,20,.35), 0 0 90px rgba(0,0,30,.25); }
    .name span { display: inline-block; opacity: 0; transform: translateY(.3em) scale(.96); filter: blur(10px); animation: rise 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
    .greet { font-size: clamp(15px, 1.9vw, 21px); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: 0; animation: fade 1.4s ease-out 1.3s forwards; text-shadow: 0 2px 16px rgba(0,0,20,.5); }
    @keyframes fade { to { opacity: .9; } }
    .hint { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; z-index: 6; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; text-align: center; width: max-content; max-width: calc(100vw - 32px);
      background: rgba(8,12,30,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.22);
      opacity: 0; transition: opacity .6s; pointer-events: none; }
    .hint.on { opacity: .92; }
    #gl { cursor: grab; touch-action: none; }
    #gl.drag { cursor: grabbing; }
    @media (max-width: 480px) { .hint { font-size: 12.5px; padding: 7px 12px; } }
    @media (max-aspect-ratio: 3/4) { .hero { top: 22vh; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      .name span { opacity: 1; transform: none; filter: none; } .greet { opacity: .9; }
    }
  </style>

<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="fx" id="birds" aria-hidden="true"></div>
  <div class="fx" id="ffs" aria-hidden="true"></div>
  <main class="hero" id="hero">

  <script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;      // розмір полотна
uniform float T;     // час, с
uniform vec3 SD;     // напрям на сонце
uniform vec3 MD;     // напрям на місяць
uniform vec3 CO;     // камера
uniform vec3 CT;     // куди дивиться камера
uniform float FL;    // фокусна відстань
uniform float MIST;  // ранковий туман 0..1

#define PI 3.14159265
const float CLOUD = 14.;   // висота шару хмар
const float TOP = 11.;     // вище цього гір немає

float h11(float p) { return fract(sin(p * 127.1) * 43758.5453); }
float h21(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + 1.), u.x), u.y); }
// шум з похідними (для ерозії та хвиль)
vec3 noised(vec2 x) {
  vec2 p = floor(x), f = fract(x);
  vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.), du = 30. * f * f * (f * (f - 2.) + 1.);
  float a = h21(p), b = h21(p + vec2(1, 0)), c = h21(p + vec2(0, 1)), d = h21(p + 1.);
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du * vec2(k1 + k4 * u.y, k2 + k4 * u.x));
}
const mat2 m2 = mat2(.8, -.6, .6, .8);
float fbm(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = m2 * p * 2.02; a *= .5; } return v; }
float fbm3(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 3; i++) { v += a * noise(p); p = m2 * p * 2.02; a *= .5; } return v; }

// ── рельєф: «ерозійний» fbm (схили з жолобами й гострими гребенями) ──
float tfbm(vec2 p, int oct) {
  float a = 0., b = .5; vec2 d = vec2(0.);
  for (int i = 0; i < 10; i++) { if (i >= oct) break; vec3 n = noised(p); d += n.yz; a += b * n.x / (1. + dot(d, d)); b *= .5; p = m2 * p * 2.; }
  return a;
}
float terrain(vec2 p, int oct) {
  float m = tfbm(p * .11 + vec2(1.7, 4.3), oct);
  // долина з озером: ширшає вдалині, за нею — високий хребет
  float w = 3.4 + .34 * max(p.y, 0.);
  float side = smoothstep(w * .5, w * 1.45, abs(p.x - 1.4 * sin(p.y * .09 + .6)));
  float back = smoothstep(17., 29., p.y);
  float front = smoothstep(7., 16., -p.y);    // позаду камери долину теж замикають гори
  float mask = max(max(side, back), front);
  float amp = mix(3.6, 13., smoothstep(8., 40., p.y));
  float h = mix(-.4 + .3 * m, amp * m * m * 1.7 + .04, mask);
  // ліс: дрібні верхівки ялин на нижніх схилах
  if (oct > 6) { float f = smoothstep(.0, .12, h) * smoothstep(1.9, 1.3, h); if (f > 0.) h += f * (.035 * pow(noise(p * 34.), 1.6) + .012 * noise(p * 110.)); }
  return h;
}

float castRay(vec3 ro, vec3 rd, float tmax, int steps, int oct) {
  float t = .02;
  for (int i = 0; i < 160; i++) {
    if (i >= steps) break;
    vec3 p = ro + rd * t;
    if (p.y > TOP && rd.y > 0.) return 1e4;
    float h = p.y - terrain(p.xz, oct);
    if (h < .0015 * t) return t;
    t += max(.45 * h, .003 * t);
    if (t > tmax) return 1e4;
  }
  return t;
}
vec3 calcN(vec3 p, float t, int oct) {
  vec2 e = vec2(.0012 * t + .001, 0.);
  return normalize(vec3(terrain(p.xz - e.xy, oct) - terrain(p.xz + e.xy, oct), 2. * e.x, terrain(p.xz - e.yx, oct) - terrain(p.xz + e.yx, oct)));
}
float softShadow(vec3 p, vec3 l) {
  float res = 1., t = .04;
  for (int i = 0; i < 22; i++) {
    vec3 q = p + l * t; float h = q.y - terrain(q.xz, 4);
    res = min(res, 10. * h / t);
    if (res < .01 || q.y > TOP) break;
    t += clamp(h, .04, .9);
  }
  return clamp(res, 0., 1.);
}

// ── світло доби ──
struct Light { float e, day, dusk, night, sunVis; vec3 sunCol, zen, hor, hor0, amb; };
Light light() {
  Light L; L.e = SD.y;
  L.day = smoothstep(-.04, .28, L.e);
  L.dusk = exp(-pow((L.e + .01) / .13, 2.));
  L.night = 1. - smoothstep(-.22, -.02, L.e);
  L.sunVis = smoothstep(-.03, .02, L.e);
  L.sunCol = mix(vec3(1., .36, .1), vec3(1., .92, .8), smoothstep(.0, .35, L.e));
  vec3 zD = vec3(.06, .22, .6), hD = vec3(.58, .76, .95);
  vec3 zS = vec3(.15, .13, .38), hS = vec3(1., .45, .2);
  vec3 zN = vec3(.006, .012, .04), hN = vec3(.04, .06, .13);
  L.zen = mix(mix(zN, zD, L.day), zS, L.dusk * .55);
  L.hor0 = mix(mix(hN, hD, L.day), vec3(.55, .4, .55), L.dusk * .5);
  L.hor = mix(mix(hN, hD, L.day), hS, L.dusk * .85);
  L.amb = mix(vec3(.05, .07, .15), vec3(.62, .72, .9), L.day) + L.dusk * vec3(.3, .14, .1);
  return L;
}

// ── небо: розсіювання, сонце, зорі, місяць ──
vec3 sky(vec3 rd, Light L, bool discs) {
  float y = max(rd.y, 0.);
  float az = max(dot(normalize(rd.xz + 1e-5), normalize(SD.xz + 1e-5)), 0.);
  vec3 hor = mix(L.hor0, L.hor, .25 + .75 * pow(az, 2.));
  vec3 col = mix(hor, L.zen, pow(smoothstep(0., .65, y), .55));
  float sd = max(dot(rd, SD), 0.);
  col += L.sunCol * L.sunVis * (.3 * pow(sd, 5.) + .5 * pow(sd, 40.) + 2. * pow(sd, 500.)) * (.55 + .6 * L.dusk);
  col += L.sunCol * L.dusk * .45 * exp(-y * 8.) * pow(az, 3.);
  if (discs) col = mix(col, L.sunCol * vec3(9., 8., 6.5), smoothstep(.99984, .9999, dot(rd, SD)) * L.sunVis);

  if (L.night > .01) {
    vec2 a = vec2(atan(rd.x, rd.z), asin(clamp(rd.y, -1., 1.)));
    vec2 sg = a * 190.; vec2 cell = floor(sg); float r = h21(cell);
    float star = step(.985, r) * smoothstep(.45, .0, length(fract(sg) - .5 - (vec2(h21(cell + 7.), h21(cell + 3.)) - .5) * .5));
    star *= (.5 + .5 * sin(T * (1.5 + r * 4.) + r * 60.)) * (.4 + .6 * h21(cell + 11.));
    vec2 sg2 = a * 70.; vec2 c2 = floor(sg2);
    float big = step(.993, h21(c2)) * smoothstep(.3, .0, length(fract(sg2) - .5));
    vec3 tint = mix(vec3(.75, .85, 1.), vec3(1., .85, .7), h21(c2 + 5.));
    float band = exp(-pow(dot(rd, normalize(vec3(.75, .2, -.6))) * 3.2, 2.));
    float mw = band * fbm(a * 5. + 2.) * smoothstep(.0, .25, y);
    float horz = smoothstep(.0, .12, y);
    col += L.night * horz * (vec3(star) * 1.3 + tint * big * 1.4 + vec3(.5, .55, .8) * mw * .35 + vec3(.25, .2, .3) * band * mw * mw * .6);
    // падаюча зірка
    float seg = floor(T / 8.), ft = fract(T / 8.) * 8.;
    if (ft < .9) {
      vec2 st = vec2((h11(seg) - .5) * 1.4, .35 + h11(seg + 3.) * .35), dir = normalize(vec2(-1. + 2. * step(.5, h11(seg + 9.)), -.45));
      vec2 hp = st + dir * ft * .5, rel = a - hp;
      float along = dot(rel, -dir), perp = abs(dot(rel, vec2(-dir.y, dir.x)));
      col += L.night * horz * vec3(1.) * smoothstep(.0025, 0., perp) * smoothstep(.2, 0., along) * step(0., along) * sin(ft / .9 * PI) * 1.6;
    }
  }
  // місяць
  float moonVis = smoothstep(-.02, .03, MD.y) * (1. - L.day * .85);
  if (moonVis > .01) {
    float md = max(dot(rd, MD), 0.);
    col += vec3(.5, .58, .85) * moonVis * (.15 * pow(md, 8.) + .4 * pow(md, 150.)) * (L.night + .2);
    if (discs) {
      vec3 mu = normalize(cross(vec3(0., 1., 0.), MD)), mv = cross(MD, mu);
      vec2 lp = vec2(dot(rd - MD, mu), dot(rd - MD, mv)) / .028;
      float d = length(lp);
      if (d < 1.1) {
        float tex = .78 + .3 * fbm(lp * 2.2 + 4.) - .18 * smoothstep(.3, .6, noise(lp * 1.6 + 9.));
        float phase = smoothstep(-.35, .25, lp.x * .6 + sqrt(max(0., 1. - d * d)) * .8 - .2);
        vec3 mc = vec3(1., .97, .9) * tex * (.15 + 1.4 * phase);
        col = mix(col, mc * 1.4, smoothstep(1., .94, d) * moonVis);
      }
    }
  }
  return col;
}

// ── хмари: шар на висоті, у перспективі ──
float cloudDen(vec2 xz, float lod) {
  vec2 cp = xz * .035 + vec2(T * .005, T * .002);
  vec2 w = vec2(fbm3(cp * 1.1 + T * .003), fbm3(cp * 1.1 + 4.1));
  return fbm(cp + w * .8);
}
vec4 clouds(vec3 ro, vec3 rd, Light L) {
  if (rd.y < .015) return vec4(0.);
  float t = (CLOUD - ro.y) / rd.y;
  vec2 xz = ro.xz + rd.xz * t;
  float dn = cloudDen(xz, 0.);
  float cov = .48 - .04 * L.dusk;
  float den = smoothstep(cov, cov + .26, dn) * exp(-t * .0035);
  if (den < .002) return vec4(0.);
  float dn2 = cloudDen(xz + normalize(SD.xz + 1e-4) * 3.5, 0.);
  float lit = clamp(.55 + (dn - dn2) * 3.5, 0., 1.);
  vec3 cLit = mix(vec3(.12, .14, .22), vec3(1.1, 1.06, 1.02), L.day);
  cLit = mix(cLit, L.sunCol * vec3(1.35, .95, .8), L.dusk * .8);
  vec3 cShade = mix(L.zen * .8 + .03, L.hor * .5 + vec3(.06, .06, .1), .5) * mix(.55, .95, L.day);
  float sd = max(dot(rd, SD), 0.);
  vec3 cc = mix(cShade, cLit, lit) * (1. + (1.2 * pow(sd, 6.) * (1. - den)) * L.sunVis);
  cc += vec3(.03, .04, .08) * L.night;
  cc = mix(cc, L.hor, 1. - exp(-t * .006));
  return vec4(cc, den * .93);
}
float cloudShadow(vec3 p) {
  if (SD.y < .03) return 1.;
  vec2 xz = p.xz + SD.xz / SD.y * (CLOUD - p.y);
  vec2 cp = xz * .035 + vec2(T * .005, T * .002);
  return 1. - .65 * smoothstep(.48, .74, fbm(cp + vec2(fbm3(cp * 1.1 + T * .003), fbm3(cp * 1.1 + 4.1)) * .8));
}

// ── серпанок і туман над водою ──
vec3 fogCol(vec3 rd, Light L) {
  float az = max(dot(normalize(rd.xz + 1e-5), normalize(SD.xz + 1e-5)), 0.);
  return mix(L.hor0, L.hor, .3 + .7 * az * az) * .92 + L.sunCol * L.sunVis * .45 * pow(max(dot(rd, SD), 0.), 6.);
}
vec3 atmos(vec3 col, vec3 ro, vec3 rd, float t, Light L) {
  vec3 p = ro + rd * t;
  col = mix(col, fogCol(rd, L), 1. - exp(-t * .017));
  float mist = (1. - exp(-t * .07)) * exp(-max(p.y, 0.) * 1.6) * (.45 + .55 * fbm3(p.xz * .22 + vec2(T * .025, T * .008)));
  vec3 mc = mix(fogCol(rd, L), vec3(1.), .2 * L.day) * mix(.9, 1.1, L.day);
  return mix(col, mc, clamp(mist * (.12 + .88 * MIST), 0., .9));
}

// ── матеріали гір ──
vec3 shadeT(vec3 p, vec3 n, vec3 rd, float t, Light L, bool full) {
  float h = p.y;
  vec3 rock = mix(vec3(.2, .19, .18), vec3(.4, .36, .32), fbm3(p.xz * 5. + p.y * 3.));
  rock *= .93 + .07 * sin(p.y * 34. + noise(p.xz * 3.) * 7.);
  float tl = 1.55 + .6 * noise(p.xz * .45);
  float forest = smoothstep(tl, tl - .35, h) * smoothstep(.18, .4, n.y) * smoothstep(.0, .05, h);
  vec3 fcol = vec3(.04, .07, .04) * (.7 + .5 * noise(p.xz * 26.)) * (.55 + .9 * noise(p.xz * 140.) * smoothstep(6., 1., t));
  vec3 alb = mix(rock, fcol, forest);
  float shore = smoothstep(.06, .0, h) * smoothstep(.5, .8, n.y);
  alb = mix(alb, vec3(.34, .3, .25) * (.8 + .4 * noise(p.xz * 40.)), shore);
  float sl = 3.5 + .9 * noise(p.xz * .5);
  float snow = smoothstep(sl - .3, sl + .3, h + 1.6 * n.y - 1.1 + .5 * noise(p.xz * 7.)) * smoothstep(.3, .55, n.y);
  alb = mix(alb, vec3(.9, .93, 1.), snow);

  float dif = max(dot(n, SD), 0.) * L.sunVis;
  if (full && dif > .005) dif *= softShadow(p + n * .01, SD);
  dif *= cloudShadow(p);
  vec3 lin = L.sunCol * dif * (L.day * 2.4 + L.dusk * 1.8);
  lin += L.amb * (.45 + .45 * n.y) * .5;
  lin += L.sunCol * L.dusk * .12 * max(dot(n, -vec3(SD.x, 0., SD.z)), 0.);     // відсвіт неба на тіньових схилах
  lin += vec3(.3, .4, .75) * L.night * (.1 + 1.1 * max(dot(n, MD), 0.) * smoothstep(-.02, .05, MD.y));
  vec3 col = alb * lin;
  col += snow * L.sunCol * pow(max(dot(reflect(rd, n), SD), 0.), 24.) * dif * .35;
  return col;
}

// ── вода ──
vec3 waterN(vec2 p, float t) {
  vec3 a = noised(p * vec2(2., 1.2) + vec2(0., T * .3));
  vec3 b = noised(p * 5.3 + vec2(T * .35, T * .15));
  vec3 c = noised(p * 13. - vec2(T * .6, T * .7));
  vec2 g = a.yz * 2. * .5 + b.yz * 5.3 * .2 + c.yz * 13. * .05;
  // кола від риб і крапель
  for (int k = 0; k < 3; k++) {
    float fk = float(k), per = 5. + fk * 1.9, tt = T + fk * 2.3;
    float id = floor(tt / per), ph = fract(tt / per) * per;
    vec2 c0 = vec2((h11(id + fk * 13.) - .5) * 5., 2.5 + h11(id * 1.7 + fk) * 9.);
    vec2 d = p - c0; float r = length(d), fr = ph * .32;
    float wv = cos((r - fr) * 70.) * exp(-pow((r - fr) * 14., 2.)) * exp(-ph * .45);

        const low = Math.exp(-Math.pow(sd[1] / .22, 2));
        const ray = useMoon ? .35 * night : smooth(sd[1], -.03, .02) * (.35 + .65 * low);
        gl.uniform2f(U2.SUN, scr ? scr[0] : .5, scr ? scr[1] : 1.6); gl.uniform1f(U2.RAY, scr ? ray : ray * .4);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!canvas.classList.contains('on')) canvas.classList.add('on');
        window.__frames = (window.__frames || 0) + 1;
      }
      frames++;
      if (now - fpsT > 4000) { frames = 0; fpsT = now; }   // вкладка була прихована
      else if (!forced && now - fpsT > 1500) { const fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; if (fps < 24 && scale > .25) { scale *= .85; resize(); } }

      // відлетіли чи відвернулися — напис тане, щоб не заважав роздивлятися
      const away = Math.hypot(view.pos[0] - home.pos[0], (view.pos[1] - home.pos[1]) * 2, view.pos[2] - home.pos[2]) / 1.5 + Math.abs(Math.atan2(Math.sin(view.yaw - home.yaw), Math.cos(view.yaw - home.yaw))) / .9 + Math.abs(view.pitch - home.pitch) / .6;
      const heroOp = 1 - smooth(away, .25, .9); hero.style.opacity = heroOp.toFixed(3); ffEl.style.opacity = heroOp.toFixed(3);
      const st = root.style;
      st.setProperty('--ff', (Math.min(1, smooth(hr, 19.8, 21) * (1 - smooth(hr, 23.4, 24)) + (1 - smooth(hr, 0, 1.2)) * .5)).toFixed(3));
      const birdsV = smooth(hr, 6.8, 8.2) * (1 - smooth(hr, 18.6, 19.6)) * heroOp; st.setProperty('--birds', birdsV.toFixed(3));
      for (let i = flock.length - 1; i >= 0; i--) {
        const b = flock[i]; b.x += b.v * dt * .06; b.ph += dt * .002;
        b.el.style.left = b.x + '%'; b.el.style.top = b.y + Math.sin(b.ph) * .5 + '%'; b.el.style.transform = `scaleX(${b.v > 0 ? 1 : -1})`;
        if (b.x < -12 || b.x > 112) { b.el.remove(); flock.splice(i, 1); }
      }
      if ((nextFlock -= dt) < 0) { nextFlock = 8000 + Math.random() * 9000; if (birdsV > .5 && flock.length < 10) spawnFlock(); }
      const g = greeting(hr); if (g !== lastGreet) { greetEl.textContent = g; lastGreet = g; }
    }
    requestAnimationFrame(frame);
    if (still) setInterval(() => { if (!running) requestAnimationFrame(frame); }, 30000);
  })();
  </script>
