<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edvault</title>
  <meta name="theme-color" content="#1b2056">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet" />

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    /* Заглушка головної: гірський пейзаж, що живе за справжнім часом доби.
       Кольори неба, гір і туману плавно перетікають між «опорними» годинами (PAL у скрипті),
       сонце й місяць ходять по дузі й ховаються за горами, вночі — зорі й падаючі зірки,
       удень — птахи, увечері — світлячки. Шари зсуваються за мишкою чи нахилом телефона (паралакс).
       Клік по сонцю чи місяцю — «перемотка» доби. Для перевірки: /?t=19.5 (година). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; background: var(--sky2, #1b2056); color: #fff; -webkit-tap-highlight-color: transparent; }

    .scene { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(to bottom, var(--sky0) 0%, var(--sky1) 48%, var(--sky2) 74%, var(--sky2) 100%); }
    .layer { position: absolute; left: -6%; width: 112%; top: -4%; height: 108%; pointer-events: none; will-change: transform; }
    .layer svg { position: absolute; left: 0; bottom: 0; width: 100%; height: min(100%, 150vw); display: block; }

    /* зорі */
    .stars { opacity: var(--stars); }
    .stars i { position: absolute; border-radius: 50%; background: #fff; animation: tw var(--tw) ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .25; } }
    .shoot { position: absolute; height: 2px; width: 140px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,.95), transparent);
      transform-origin: 0 50%; animation: shoot 1.1s cubic-bezier(.3,.1,.4,1) forwards; filter: drop-shadow(0 0 6px rgba(255,255,255,.8)); }
    @keyframes shoot { from { opacity: 0; translate: 0 0; } 15% { opacity: 1; } to { opacity: 0; translate: -420px 220px; } }

    /* сонце, місяць і сяйво біля обрію */
    .glow { position: absolute; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 55%); opacity: var(--glowA); mix-blend-mode: screen; }
    .orb { position: absolute; width: 11vmin; height: 11vmin; min-width: 70px; min-height: 70px; translate: -50% -50%; border-radius: 50%; pointer-events: auto; cursor: pointer; border: 0; }
    .sun { background: radial-gradient(circle at 50% 50%, #fffbe8 0%, var(--sunC) 58%, var(--sunE) 100%); box-shadow: 0 0 60px 18px var(--sunH), 0 0 160px 60px var(--sunH2); }
    .moon { background: radial-gradient(circle at 38% 36%, #fbfbf4, #dfe3ea 60%, #b9c0cc); box-shadow: 0 0 40px 10px rgba(220,228,255,.35), 0 0 120px 40px rgba(160,180,255,.18); }
    .moon::before, .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(150,158,175,.35); }
    .moon::before { width: 22%; height: 22%; left: 52%; top: 26%; } .moon::after { width: 14%; height: 14%; left: 30%; top: 58%; }
    .orb:focus-visible { outline: 3px solid rgba(255,255,255,.8); outline-offset: 8px; }

    /* хмари: м'які градієнтні «клубки», колір залежить від освітлення */
    .cloud { position: absolute; width: 20vw; height: 4.6vw; min-width: 170px; min-height: 40px; opacity: var(--cloudA); }
    .cloud i { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--cloud) 0%, var(--cloud) 45%, transparent 100%); }

    /* туман між горами */
    .fog { position: absolute; left: 0; right: 0; height: 26%; background: linear-gradient(to bottom, transparent, var(--fog) 55%, transparent); opacity: var(--fogA); }

    /* птахи */
    .bird { position: absolute; width: 22px; height: 10px; opacity: var(--birds); }
    .bird svg { width: 100%; height: 100%; overflow: visible; }
    .bird path { fill: none; stroke: var(--birdC); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transform-origin: 50% 80%; animation: flap .55s ease-in-out infinite alternate; }
    @keyframes flap { to { transform: scaleY(-.55); } }

    /* світлячки */
    .ff { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff6a8; box-shadow: 0 0 10px 3px rgba(255,236,120,.75); opacity: 0;
      animation: ffly var(--d) ease-in-out infinite, ffblink var(--b) ease-in-out infinite; }
    .fireflies { opacity: var(--ff); }
    @keyframes ffly { 33% { translate: 26px -18px; } 66% { translate: -14px -34px; } }
    @keyframes ffblink { 0%, 100% { opacity: 0; } 40%, 60% { opacity: 1; } }

    /* текст */
    .hero { position: fixed; left: 0; right: 0; top: 17vh; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; pointer-events: none; z-index: 5; will-change: transform; }
    .name { font-size: clamp(54px, 10vw, 128px); font-weight: 800; letter-spacing: -.04em; line-height: 1;
      text-shadow: 0 2px 0 rgba(0,0,0,.06), 0 10px 40px var(--shadow), 0 0 80px var(--shadow); }
    .name span { display: inline-block; opacity: 0; transform: translateY(.35em); filter: blur(8px); animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
    .greet { font-size: clamp(16px, 2vw, 22px); font-weight: 600; letter-spacing: .02em; opacity: 0; animation: fade 1.2s ease-out 1s forwards; text-shadow: 0 2px 18px var(--shadow); }
    @keyframes fade { to { opacity: .92; } }
    .lapse { position: fixed; left: 50%; bottom: 26px; translate: -50% 0; z-index: 6; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
      background: rgba(10,14,40,.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.25);
      opacity: 0; transition: opacity .4s; pointer-events: none; font-variant-numeric: tabular-nums; }
    .lapse.on { opacity: 1; }

    @media (max-aspect-ratio: 3/4) { .hero { top: 31vh; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      .name span { opacity: 1; transform: none; filter: none; } .greet { opacity: .92; }
    }
  </style>

<body>
  <div class="scene" id="scene" aria-hidden="true"></div>
  <main class="hero" id="hero">
    <h1 class="name" aria-label="Edvault"></h1>
    <p class="greet" id="greet"></p>
  </main>
  <div class="lapse" id="lapse" role="status"></div>

  <script>
  (() => {
    const scene = document.getElementById('scene'), root = document.documentElement, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const W = 1600, H = 900, NS = 'http://www.w3.org/2000/svg';

    /* ── палітра за годинами: небо (3), сяйво, гори від дальніх до ближніх (4), туман, хмари, ліс ── */
    const PAL = [
      [0,    ['#04071a', '#0a1235', '#18214d'], '#3a3f8f', ['#262f57', '#1b2347', '#121a38', '#0b1129'], '#1c2550', '#2a3360', '#070b1d'],
      [4.8,  ['#070c2a', '#1d2257', '#3f3a73'], '#5b4a8a', ['#38386a', '#2a2b57', '#1d1f44', '#121530'], '#3a3870', '#3c3a6c', '#0b0d22'],
      [6,    ['#283a86', '#a3628f', '#ff9a72'], '#ff8e66', ['#9a6f99', '#6c4d82', '#463764', '#2a2246'], '#c58aa0', '#ffc1a6', '#1b1631'],
      [7.5,  ['#4a86d6', '#a6c8ef', '#ffe0bd'], '#ffd8a0', ['#9cb1d1', '#7690b9', '#55719a', '#36506f'], '#d9e6f5', '#ffffff', '#1f3247'],
      [12,   ['#2774da', '#73b2f1', '#cbe7ff'], '#ffffff', ['#a2bbdb', '#7c9cc4', '#5a7ba2', '#3b5a7b'], '#e6f1fc', '#ffffff', '#21384d'],
      [16.5, ['#3175cf', '#8bbbea', '#ffe6c2'], '#fff1d0', ['#a7b3d0', '#8093ba', '#5e6f97', '#3e4b6c'], '#f1e6e0', '#fff7ee', '#232d45'],
      [18.8, ['#384192', '#d26a86', '#ffa35e'], '#ff8a4a', ['#a8668e', '#7a4a7e', '#503264', '#2f1e46'], '#e29a98', '#ffc59a', '#1c1330'],
      [20.2, ['#151a4f', '#4e3577', '#b65a74'], '#d0627a', ['#5c4373', '#43325f', '#2d2349', '#1b1633'], '#5b467c', '#6a5486', '#0e0c20'],
      [21.6, ['#060a24', '#121a44', '#262c5e'], '#46407a', ['#2c3460', '#20284f', '#151c3e', '#0d132c'], '#262d58', '#2e3664', '#080c1f'],
      [24,   ['#04071a', '#0a1235', '#18214d'], '#3a3f8f', ['#262f57', '#1b2347', '#121a38', '#0b1129'], '#1c2550', '#2a3360', '#070b1d'],
    ];
    const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
    const ease = k => k * k * (3 - 2 * k);
    const rgb = c => c.startsWith('#') ? hex(c) : c.match(/\d+/g).map(Number);
    const mixRgb = (a, b, k) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
    function palette(t) {
      let i = 0; while (PAL[i + 1][0] <= t) i++;
      const a = PAL[i], b = PAL[i + 1], k = ease((t - a[0]) / (b[0] - a[0]));
      const m = (x, y) => mix(x, y, k);
      return { sky: a[1].map((c, j) => m(c, b[1][j])), glow: m(a[2], b[2]), mtn: a[3].map((c, j) => m(c, b[3][j])), fog: m(a[4], b[4]), cloud: m(a[5], b[5]), front: m(a[6], b[6]) };
    }
    const S1 = 6.1, S2 = 20; // схід і захід
    const smooth = (x, a, b) => ease(Math.max(0, Math.min(1, (x - a) / (b - a))));

    /* ── шари ── */
    const layers = [];
    const layer = (depth, cls = '') => { const el = document.createElement('div'); el.className = 'layer ' + cls; scene.appendChild(el); layers.push({ el, depth }); return el; };

    // зорі
    const stars = layer(4, 'stars');
    for (let i = 0; i < (innerWidth < 600 ? 110 : 220); i++) {
      const s = document.createElement('i'), z = Math.random() ** 2;
      Object.assign(s.style, { left: Math.random() * 100 + '%', top: Math.random() * 62 + '%', width: .8 + z * 2.4 + 'px', height: .8 + z * 2.4 + 'px', opacity: .35 + z * .65 });
      s.style.setProperty('--tw', 2 + Math.random() * 5 + 's'); s.style.animationDelay = -Math.random() * 6 + 's';
      stars.appendChild(s);
    }

    // сонце, місяць, сяйво (за горами)
    const sky = layer(8);
    const glow = document.createElement('div'); glow.className = 'glow'; sky.appendChild(glow);
    const sun = document.createElement('button'); sun.className = 'orb sun'; sun.setAttribute('aria-label', 'Сонце: перемотати добу'); sky.appendChild(sun);
    const moon = document.createElement('button'); moon.className = 'orb moon'; moon.setAttribute('aria-label', 'Місяць: перемотати добу'); sky.appendChild(moon);

    // хмари: дальні й ближні
    const clouds = [];
    const cloudLayer = (depth, n, top, scale) => {
      const L = layer(depth);
      for (let i = 0; i < n; i++) {
        const c = document.createElement('div'); c.className = 'cloud';
        // широка пласка основа + кілька «бань» зверху
        const base = document.createElement('i'); Object.assign(base.style, { width: '100%', height: '55%', left: '0', top: '45%' }); c.appendChild(base);
        for (let j = 0; j < 3; j++) { const b = document.createElement('i'), w = 26 + Math.random() * 22; Object.assign(b.style, { width: w + '%', height: w * 2.6 + '%', left: 8 + j * 26 + Math.random() * 8 + '%', top: 52 - w * 2.2 + Math.random() * 10 + '%' }); c.appendChild(b); }
        c.style.top = top[0] + Math.random() * (top[1] - top[0]) + '%'; c.style.scale = scale * (.7 + Math.random() * .6);
        L.appendChild(c); clouds.push({ el: c, x: Math.random() * 120 - 10, v: (.4 + Math.random() * .5) * scale });
      }
    };
    cloudLayer(12, 4, [4, 16], .75);

    // гори: плавні хребти з шумом
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    function ridge(base, amp, waves, jag, sharp = true) {
      const ph = waves.map(() => rnd() * Math.PI * 2), pts = [];
      for (let x = -40; x <= W + 40; x += 12) {
        let y = base; waves.forEach((f, i) => { const r = 1 - Math.abs(Math.sin(x / W * Math.PI * f + ph[i])); y -= (r ** (sharp ? 1.6 : 1) - .35) * amp / (i * .9 + 1); });
        y += (rnd() - .5) * jag; pts.push([x, y]);
      }
      let d = `M${pts[0][0]} ${H} L${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; d += ` Q${x0} ${y0} ${(x0 + x1) / 2} ${(y0 + y1) / 2}`; }
      return { d: d + ` L${W + 40} ${H} Z`, pts };
    }
    const mtnEls = [];
    const MTN = [[440, 190, [2.2, 4.6, 9.5], 6, 18], [540, 160, [3.1, 6.2, 12], 8, 28], [640, 120, [2.6, 5.8, 13], 8, 42], [735, 80, [1.8, 4.4, 10], 6, 58]];
    MTN.forEach(([base, amp, waves, jag, depth], i) => {
      const L = layer(depth), svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
      const g = document.createElementNS(NS, 'linearGradient'); g.id = 'mg' + i; g.setAttribute('x1', 0); g.setAttribute('y1', 0); g.setAttribute('x2', 0); g.setAttribute('y2', 1);
      g.innerHTML = '<stop offset="0"/><stop offset=".55"/><stop offset="1"/>'; const defs = document.createElementNS(NS, 'defs'); defs.appendChild(g); svg.appendChild(defs);
      const p = document.createElementNS(NS, 'path'); p.setAttribute('d', ridge(base, amp, waves, jag).d); p.setAttribute('fill', `url(#mg${i})`); svg.appendChild(p); L.appendChild(svg); mtnEls.push(g.querySelectorAll('stop'));
      if (i < 3) { const f = document.createElement('div'); f.className = 'fog'; f.style.top = (base / H * 100 + 4 + i * 2) + '%'; L.appendChild(f); }
      if (i === 1) cloudLayer(depth + 4, 2, [30, 38], 1);
    });

    // передній план: пагорб із ялинковим лісом
    const front = layer(76), fsvg = document.createElementNS(NS, 'svg');
    fsvg.setAttribute('viewBox', `0 0 ${W} ${H}`); fsvg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
    const hill = ridge(815, 34, [.9, 2.3], 3, false), hp = document.createElementNS(NS, 'path'); hp.setAttribute('d', hill.d);
    let trees = '';
    const yAt = x => { const i = Math.max(0, Math.min(hill.pts.length - 1, Math.round((x + 40) / 20))); return hill.pts[i][1]; };
    for (let x = -30; x < W + 30; x += 9 + rnd() * 22) {
      if (Math.abs(x - W / 2) < 260 && rnd() < .7) continue; // поляна посередині
      const h = 40 + rnd() * 80, w = h * (.32 + rnd() * .1), y = yAt(x) + 6;
      trees += `M${x} ${y - h}L${x + w * .55} ${y - h * .55}L${x + w * .3} ${y - h * .55}L${x + w * .8} ${y - h * .2}L${x + w * .45} ${y - h * .2}L${x + w} ${y}L${x - w} ${y}L${x - w * .45} ${y - h * .2}L${x - w * .8} ${y - h * .2}L${x - w * .3} ${y - h * .55}L${x - w * .55} ${y - h * .55}Z`;
    }
    const tp = document.createElementNS(NS, 'path'); tp.setAttribute('d', trees);
    fsvg.append(hp, tp); front.appendChild(fsvg);

    // світлячки над лісом
    const ffL = layer(84, 'fireflies');
    for (let i = 0; i < (innerWidth < 600 ? 14 : 30); i++) {
      const f = document.createElement('i'); f.className = 'ff';
      Object.assign(f.style, { left: Math.random() * 100 + '%', top: 72 + Math.random() * 24 + '%' });
      f.style.setProperty('--d', 6 + Math.random() * 8 + 's'); f.style.setProperty('--b', 2 + Math.random() * 3 + 's'); f.style.animationDelay = `${-Math.random() * 10}s, ${-Math.random() * 5}s`;
      ffL.appendChild(f);
    }

    // птахи
    const birdL = layer(30), flock = [];
    const spawnFlock = () => {
      const n = 3 + Math.floor(Math.random() * 4), y = 18 + Math.random() * 20, dir = Math.random() < .5 ? 1 : -1;
      for (let i = 0; i < n; i++) {
        const b = document.createElement('div'); b.className = 'bird';
        b.innerHTML = '<svg viewBox="0 0 22 10"><path d="M1 2 Q6 8 11 6 Q16 8 21 2"/></svg>';
        b.querySelector('path').style.animationDelay = -Math.random() * .5 + 's';
        b.style.scale = .7 + Math.random() * .5;
        birdL.appendChild(b); flock.push({ el: b, x: dir > 0 ? -8 - i * 2.5 : 108 + i * 2.5, y: y + (i % 2 ? 2.5 : -1) * (i / 2), v: dir * (.035 + Math.random() * .01), ph: Math.random() * 6 });
      }
    };

    /* ── текст ── */
    const nameEl = document.querySelector('.name');
    [...'Edvault'].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.setAttribute('aria-hidden', 'true'); s.style.animationDelay = .3 + i * .08 + 's'; nameEl.appendChild(s); });
    const greetEl = document.getElementById('greet'), hero = document.getElementById('hero'), lapseEl = document.getElementById('lapse'), themeMeta = document.querySelector('meta[name="theme-color"]');
    const greeting = t => t < 4.5 || t >= 22.5 ? 'Доброї ночі' : t < 11 ? 'Добрий ранок' : t < 17.5 ? 'Добрий день' : 'Добрий вечір';

    /* ── час ── */
    const q = parseFloat(new URLSearchParams(location.search).get('t'));
    const realT = () => { if (!isNaN(q)) return ((q % 24) + 24) % 24; const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; };
    let lapse = null;
    const LAPSE = 14000;
    const nowT = () => { if (!lapse) return realT(); const k = (performance.now() - lapse.start) / LAPSE; if (k >= 1) { lapse = null; lapseEl.classList.remove('on'); return realT(); } return (lapse.from + 24 * ease(k)) % 24; };
    const startLapse = () => { if (lapse || still) return; lapse = { from: realT(), start: performance.now() }; lapseEl.classList.add('on'); };
    sun.addEventListener('click', startLapse); moon.addEventListener('click', startLapse);

    /* ── оновлення сцени ── */
    let lastT = -1, starsV = 0, birdsV = 0;
    function paint(t) {
      if (Math.abs(t - lastT) < .002) return;
      lastT = t; const P = palette(t), st = root.style;
      st.setProperty('--sky0', P.sky[0]); st.setProperty('--sky1', P.sky[1]); st.setProperty('--sky2', P.sky[2]);
      mtnEls.forEach((st3, i) => { const c = P.mtn[i]; st3[0].setAttribute('stop-color', mixRgb(c, P.sky[1], .18 - i * .04)); st3[1].setAttribute('stop-color', c); st3[2].setAttribute('stop-color', mixRgb(c, P.fog, .45 - i * .08)); }); tp.setAttribute('fill', P.front); hp.setAttribute('fill', P.front);
      st.setProperty('--fog', P.fog); st.setProperty('--cloud', P.cloud); st.setProperty('--glow', P.glow);
      const day = smooth(t, S1 - .6, S1 + .9) * (1 - smooth(t, S2 - .9, S2 + .6));
      starsV = Math.max(0, Math.min(1, 1 - smooth(t, 4.6, 6.4) + smooth(t, 20, 21.8)));
      birdsV = smooth(t, 7, 8.5) * (1 - smooth(t, 18, 19.2));
      st.setProperty('--stars', starsV.toFixed(3));
      st.setProperty('--fogA', (.35 + .4 * (1 - day)).toFixed(3));
      st.setProperty('--cloudA', (.45 + .35 * day).toFixed(3));
      st.setProperty('--birds', birdsV.toFixed(3));
      st.setProperty('--ff', Math.min(1, smooth(t, 19.8, 21) * (1 - smooth(t, 23.5, 24)) + (1 - smooth(t, 0, 1.5)) * .6).toFixed(3));
      st.setProperty('--birdC', mix('#1b2238', '#2a2440', smooth(t, 16, 19)));
      st.setProperty('--shadow', day > .5 ? 'rgba(20,40,90,.35)' : 'rgba(0,0,20,.55)');
      // сонце: дуга від сходу до заходу; низько над обрієм — тепліше й більше сяйво
      const p = (t - S1) / (S2 - S1), pc = Math.max(0, Math.min(1, p)), sunUp = p > -.05 && p < 1.05;
      const sx = 8 + 84 * p, sy = 56 - Math.sin(pc * Math.PI) ** .7 * 47;
      sun.style.left = sx + '%'; sun.style.top = sy + '%'; sun.style.display = sunUp ? '' : 'none';
      const low = 1 - Math.min(1, Math.sin(pc * Math.PI) * 1.8);
      st.setProperty('--sunC', mix('#fff2b0', '#ffb15c', low)); st.setProperty('--sunE', mix('#ffe08a', '#ff7b3d', low));
      st.setProperty('--sunH', `rgba(255,${Math.round(220 - 80 * low)},${Math.round(150 - 90 * low)},.55)`);
      st.setProperty('--sunH2', `rgba(255,${Math.round(200 - 70 * low)},120,${(.18 + .22 * low).toFixed(2)})`);
      // місяць: від заходу до сходу
      const mp = ((t - S2 + 24) % 24) / (24 - S2 + S1), mpc = Math.max(0, Math.min(1, mp)), moonUp = mp > -.05 && mp < 1.05;
      moon.style.left = 8 + 84 * mp + '%'; moon.style.top = 56 - Math.sin(mpc * Math.PI) ** .7 * 46 + '%'; moon.style.display = moonUp ? '' : 'none';
      // сяйво: біля сонця, а в сутінках — над обрієм
      glow.style.left = (sunUp ? sx : 50) + '%'; glow.style.top = (sunUp ? Math.max(sy, 40) : 58) + '%';
      const twilight = Math.max(smooth(t, 4.4, 5.8) * (1 - smooth(t, 6, 7)), smooth(t, 19.4, 20) * (1 - smooth(t, 20.6, 21.8)));
      st.setProperty('--glowA', (sunUp ? .35 + .55 * low : .55 * twilight).toFixed(3));
      greetEl.textContent = greeting(t);
      if (lapse) lapseEl.textContent = 'Перемотка доби · ' + String(Math.floor(t)).padStart(2, '0') + ':' + String(Math.floor(t % 1 * 60)).padStart(2, '0');
      themeMeta.content = P.sky[0];
    }

    /* ── паралакс і рух ── */
    let tx = 0, ty = 0, mx = 0, my = 0;
    addEventListener('pointermove', e => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, { passive: true });
    document.addEventListener('pointerleave', () => { tx = ty = 0; });
    addEventListener('deviceorientation', e => { if (e.gamma == null) return; tx = Math.max(-1, Math.min(1, e.gamma / 25)); ty = Math.max(-1, Math.min(1, (e.beta - 50) / 30)); }, { passive: true });

    let last = performance.now(), nextShoot = 2000, nextFlock = 1500;
    function frame(now) {
      const dt = Math.min(64, now - last); last = now;
      paint(nowT());
      mx += (tx - mx) * .06; my += (ty - my) * .06;
      for (const L of layers) L.el.style.transform = `translate3d(${(-mx * L.depth * .5).toFixed(2)}px, ${(-my * L.depth * .25).toFixed(2)}px, 0)`;
      hero.style.transform = `translate3d(${(-mx * 10).toFixed(2)}px, ${(-my * 6).toFixed(2)}px, 0)`;
      const speed = lapse ? 8 : 1;
      for (const c of clouds) { c.x += c.v * dt * .0012 * speed; if (c.x > 112) c.x = -28; c.el.style.left = c.x + '%'; }
      for (let i = flock.length - 1; i >= 0; i--) {
        const b = flock[i]; b.x += b.v * dt * .06; b.ph += dt * .002;
        b.el.style.left = b.x + '%'; b.el.style.top = b.y + Math.sin(b.ph) * .6 + '%'; b.el.style.transform = `scaleX(${b.v > 0 ? 1 : -1})`;
        if (b.x < -15 || b.x > 115) { b.el.remove(); flock.splice(i, 1); }
      }
      if ((nextShoot -= dt) < 0) {
        nextShoot = 3500 + Math.random() * 6000;
        if (starsV > .6) { const e = document.createElement('i'); e.className = 'shoot'; Object.assign(e.style, { left: 30 + Math.random() * 65 + '%', top: 4 + Math.random() * 26 + '%', rotate: (152 + Math.random() * 10) + 'deg' }); stars.appendChild(e); e.addEventListener('animationend', () => e.remove()); }
      }
      if ((nextFlock -= dt) < 0) { nextFlock = 9000 + Math.random() * 9000; if (birdsV > .5 && flock.length < 8) spawnFlock(); }
      requestAnimationFrame(frame);
    }
    paint(nowT());
    clouds.forEach(c => { c.el.style.left = c.x + '%'; });
    if (still) setInterval(() => paint(nowT()), 30000); else requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
