<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />

  <style>
    /* Заглушка головної: шкільна дошка. Фактура дошки, сліди старої крейди й губки, дерев'яна рамка
       та поличка генеруються в браузері. Крейда сама пише «Edvault», привітання за часом доби, дату
       й «Класна робота», рядки коду й малюнки з дизайну (крива Безьє, блок-схема, макет сторінки); з вікна падає світло, у ньому літає пил.
       На дошці можна писати самому: крейда чотирьох кольорів, губка стирає, двічі по губці — витерти все.
       Для перевірки: /?t=19.5 (година). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { overflow: hidden; background: #5a3a21; font-family: Caveat, 'Segoe Print', cursive; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    :root { --fw: clamp(12px, 2.3vw, 30px); --tray: clamp(20px, 2.6vw, 30px); }
    .frame { position: fixed; inset: 0; background-color: #5a3a21; background-size: 512px 512px; }
    .board { position: absolute; left: var(--fw); right: var(--fw); top: var(--fw); bottom: calc(var(--fw) + var(--tray) * .55); overflow: hidden; border-radius: 3px; background: #273f33;
      box-shadow: 0 0 0 2px #2c1b0e, 0 0 0 4px rgba(255,220,180,.08), inset 0 0 0 1px rgba(0,0,0,.5), inset 0 6px 18px rgba(0,0,0,.45); }
    .board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #chalk { -webkit-mask-repeat: repeat; mask-repeat: repeat; -webkit-mask-size: 192px 192px; mask-size: 192px 192px; }
    #fx { cursor: none; touch-action: none; z-index: 3; }
    .light { position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse 80% 70% at 35% 30%, rgba(255,250,235,.05), transparent 70%), radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.38)); }
    .win { position: absolute; top: 4%; height: 78%; width: 30%; display: grid; grid-template: 1fr 1fr / 1fr 1fr; gap: 9% 11%; pointer-events: none; z-index: 2;
      transform: skewX(-14deg); filter: blur(16px); mix-blend-mode: screen; opacity: 0; transition: opacity 2s; }
    .win i { background: var(--sun, rgba(255,244,214,.09)); border-radius: 4px; }
    .tray { position: absolute; left: calc(var(--fw) * .4); right: calc(var(--fw) * .4); bottom: calc(var(--fw) * .55); height: var(--tray); z-index: 4; border-radius: 3px;
      background: linear-gradient(#7c5434, #5f3e24 45%, #4a2f1a); box-shadow: 0 -2px 0 rgba(255,220,180,.12) inset, 0 6px 10px rgba(0,0,0,.45), 0 -3px 8px rgba(0,0,0,.25);
      display: flex; align-items: flex-start; gap: clamp(8px, 1.6vw, 18px); padding: 0 clamp(14px, 6vw, 90px); }
    .tray button { border: 0; cursor: pointer; flex: none; -webkit-tap-highlight-color: transparent; transition: transform .25s cubic-bezier(.2,.8,.3,1.3), box-shadow .25s; }
    .tray button:focus-visible { outline: 2px solid #ffe9a8; outline-offset: 3px; }
    .piece { width: clamp(34px, 4vw, 52px); height: clamp(8px, .95vw, 12px); margin-top: calc(var(--tray) * .12); border-radius: 6px 4px 4px 6px; background: var(--c);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 2px 3px rgba(0,0,0,.4); transform: rotate(var(--r, 0deg)); }
    .piece.on { transform: translateY(-9px) rotate(var(--r, 0deg)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 9px 8px rgba(0,0,0,.35); }
    .eraser { margin-left: auto; width: clamp(54px, 6.4vw, 84px); height: calc(var(--tray) * .78); margin-top: calc(var(--tray) * -.18); border-radius: 4px;
      background: linear-gradient(#a8784d, #8a5f39 55%, #3e3e42 55%, #2f2f33); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 4px rgba(0,0,0,.45); }
    .eraser.on { transform: translateY(-8px) rotate(-4deg); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 8px rgba(0,0,0,.35); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .tray button { transition: none; } }
  </style>

</head>
<body>
  <div class="frame" id="frame">
    <main class="board" id="board">
      <h1 class="sr">Edvault</h1>
      <canvas id="bg" aria-hidden="true"></canvas>
      <canvas id="chalk" aria-hidden="true"></canvas>
      <div class="win" id="win" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="light" aria-hidden="true"></div>
      <canvas id="fx" role="img" aria-label="Шкільна дошка: на ній можна писати крейдою"></canvas>
    </main>
    <div class="tray" id="tray">
      <button class="piece on" style="--c:#f4f2ea;--r:-2deg" data-c="#f4f2ea" aria-label="Біла крейда" aria-pressed="true"></button>
      <button class="piece" style="--c:#f2dc84;--r:3deg" data-c="#f2dc84" aria-label="Жовта крейда" aria-pressed="false"></button>
      <button class="piece" style="--c:#f3a9c3;--r:-4deg" data-c="#f3a9c3" aria-label="Рожева крейда" aria-pressed="false"></button>
      <button class="piece" style="--c:#a3cdf2;--r:2deg" data-c="#a3cdf2" aria-label="Блакитна крейда" aria-pressed="false"></button>
      <button class="eraser" id="eraser" aria-label="Губка: стирати. Двічі — витерти всю дошку" title="Губка: стирати. Двічі — витерти всю дошку" aria-pressed="false"></button>
    </div>
  </div>

  <script>
  (() => {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const $ = id => document.getElementById(id);
    const board = $('board'), bg = $('bg'), ch = $('chalk'), fx = $('fx'), win = $('win');
    const bx = bg.getContext('2d'), cx = ch.getContext('2d'), fxx = fx.getContext('2d');
    const FONT = "Caveat, 'Segoe Print', 'Comic Sans MS', cursive";
    let W = 0, H = 0;

    // випадкові числа з зерном — щоб перемальовування після зміни розміру було тим самим
    const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const R = Math.random;

    /* ── час, привітання, дата словами ── */
    const q = parseFloat(new URLSearchParams(location.search).get('t'));
    const hour = () => { if (!isNaN(q)) return ((q % 24) + 24) % 24; const d = new Date(); return d.getHours() + d.getMinutes() / 60; };
    const greeting = t => t < 4.5 || t >= 22.5 ? 'Доброї ночі!' : t < 11 ? 'Добрий ранок!' : t < 17.5 ? 'Добрий день!' : 'Добрий вечір!';
    const ORD = ['', 'перше', 'друге', 'третє', 'четверте', "п'яте", 'шосте', 'сьоме', 'восьме', "дев'яте", 'десяте', 'одинадцяте', 'дванадцяте', 'тринадцяте', 'чотирнадцяте', "п'ятнадцяте", 'шістнадцяте', 'сімнадцяте', 'вісімнадцяте', "дев'ятнадцяте", 'двадцяте'];
    const MON = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
    const dayWord = n => n <= 20 ? ORD[n] : n < 30 ? 'двадцять ' + ORD[n - 20] : n === 30 ? 'тридцяте' : 'тридцять перше';
    const dateWords = () => { const d = new Date(), s = dayWord(d.getDate()) + ' ' + MON[d.getMonth()]; return s[0].toUpperCase() + s.slice(1); };

    /* ── дерев'яна рамка: текстура з волокнами й сучками ── */
    (() => {
      const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
      const r = rng(7);
      for (let y = 0; y < 512; y++) {
        const v = Math.sin(y * .21 + Math.sin(y * .031) * 4) * .5 + Math.sin(y * .9 + Math.sin(y * .07) * 2) * .25 + (r() - .5) * .35;
        const l = 26 + v * 6; g.fillStyle = `hsl(27 ${44 + v * 6}% ${l}%)`; g.fillRect(0, y, 512, 1);
      }
      for (let i = 0; i < 900; i++) { const y = r() * 512, x = r() * 512; g.fillStyle = `rgba(${r() < .5 ? '30,16,6' : '255,220,170'},${.05 + r() * .08})`; g.fillRect(x, y, 20 + r() * 140, 1); }
      for (let k = 0; k < 3; k++) {
        const x = r() * 512, y = r() * 512;
        for (let i = 9; i > 0; i--) { g.strokeStyle = `rgba(40,20,8,${.05 + .03 * (9 - i)})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(x, y, i * 7, i * 2.4, 0, 0, Math.PI * 2); g.stroke(); }
      }
      $('frame').style.backgroundImage = `linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.2)), url(${c.toDataURL()})`;
    })();

    /* ── зерно дошки: крейда не лягає в дрібні западинки (маска для шару крейди) ── */
    (() => {
      const c = document.createElement('canvas'); c.width = c.height = 192; const g = c.getContext('2d'), im = g.createImageData(192, 192), r = rng(3);
      for (let i = 0; i < 192 * 192; i++) { const v = r(); im.data[i * 4 + 3] = v < .16 ? 40 + v * 500 : 200 + (v - .16) * 66; }
      g.putImageData(im, 0, 0);
      const url = `url(${c.toDataURL()})`; ch.style.webkitMaskImage = url; ch.style.maskImage = url;
    })();

    /* ── поверхня дошки: колір, плями, сліди губки, старі напівстерті написи, дрібне зерно ── */
    function paintBoard() {
      const r = rng(11);
      bx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = bx.createRadialGradient(W * .42, H * .38, 0, W * .5, H * .5, Math.hypot(W, H) * .62);
      g.addColorStop(0, '#34533f'); g.addColorStop(.55, '#2a4535'); g.addColorStop(1, '#1d3228');
      bx.fillStyle = g; bx.fillRect(0, 0, W, H);
      for (let i = 0; i < 70; i++) {
        const x = r() * W, y = r() * H, rad = 40 + r() * 220, light = r() < .55;
        const gg = bx.createRadialGradient(x, y, 0, x, y, rad);
        gg.addColorStop(0, light ? `rgba(220,235,225,${.012 + r() * .022})` : `rgba(0,10,5,${.03 + r() * .04})`); gg.addColorStop(1, 'rgba(0,0,0,0)');
        bx.fillStyle = gg; bx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      }
      // широкі розводи від губки
      bx.save(); bx.lineCap = 'round'; bx.lineJoin = 'round'; bx.shadowColor = 'rgba(230,240,230,.05)'; bx.shadowBlur = 24;
      for (let k = 0; k < 9; k++) {
        bx.strokeStyle = `rgba(225,238,228,${.014 + r() * .016})`; bx.lineWidth = 40 + r() * 70; bx.beginPath();
        let x = r() * W, y = r() * H; bx.moveTo(x, y);
        for (let s = 0; s < 6; s++) { x += (r() - .3) * W * .25; y += (r() - .5) * H * .25; bx.quadraticCurveTo(x - 40 + r() * 80, y - 60 + r() * 120, x, y); }
        bx.stroke();
      }
      // напівстерті написи минулих уроків
      const ghosts = ['console.log(x)', 'Домашнє завдання', 'margin: 0 auto;', 'while (true)', 'def main():', 'git commit', 'RGB → HEX', '<div class="card">', 'Ctrl + Z', 'x = x + 1'];
      bx.textBaseline = 'middle';
      for (let i = 0; i < 9; i++) {
        bx.save(); bx.translate(r() * W, r() * H); bx.rotate((r() - .5) * .12);
        bx.font = `600 ${Math.round(18 + r() * 34)}px ${FONT}`; bx.shadowColor = 'rgba(230,240,230,.06)'; bx.shadowBlur = 6;
        bx.fillStyle = `rgba(230,240,232,${.012 + r() * .016})`; bx.fillText(ghosts[i % ghosts.length], 0, 0); bx.restore();
      }
      bx.restore();
      // дрібне зерно
      const im = bx.getImageData(0, 0, bg.width, bg.height), d = im.data;
      for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * 13 + (R() < .004 ? 16 : 0); d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      bx.putImageData(im, 0, 0);
    }

    /* ── штрих крейди: багато дрібних зерен навколо лінії; швидкий рух — блідіший ── */
    function chalkSeg(x0, y0, x1, y1, w, col, rnd, k = 1) {
      const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / .7));
      cx.fillStyle = col;
      for (let i = 0; i < n; i++) {
        const t = i / n, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
        for (let j = 0; j < 5; j++) {
          const rr = w * .5 * Math.sqrt(rnd()), a = rnd() * 6.283, s = .7 + rnd() * 1.5;
          cx.globalAlpha = (.22 + rnd() * .62) * k; cx.fillRect(px + Math.cos(a) * rr - s / 2, py + Math.sin(a) * rr - s / 2, s, s);
        }
      }
      cx.globalAlpha = 1;
    }
    // губка: стирає не до кінця й лишає білуватий розвід на дошці
    function eraseSeg(x0, y0, x1, y1, rad, strength = .38) {
      const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / (rad * .3)));
      cx.save(); cx.globalCompositeOperation = 'destination-out';
      for (let i = 0; i <= n; i++) {
        const t = i / n, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
        const g = cx.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(0,0,0,${strength})`); g.addColorStop(.7, `rgba(0,0,0,${strength * .6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        cx.fillStyle = g; cx.fillRect(px - rad, py - rad, rad * 2, rad * 2);
        if (i % 3 === 0) { bx.fillStyle = 'rgba(230,240,232,.0045)'; bx.beginPath(); bx.arc(px, py, rad * 1.05, 0, 6.283); bx.fill(); }
      }
      cx.restore();
    }

    /* ── елементи на дошці: написи (проявляються «рукою») і малюнки (штрихами) ── */
    // напис: малюємо в окреме полотно, шорсткі краї; профіль чорнила по стовпчиках — щоб крейда «ходила» по літерах
    function textItem(o) {
      const size = o.size, c = document.createElement('canvas'), g = c.getContext('2d');
      g.font = `700 ${size}px ${FONT}`;
      const tw = g.measureText(o.text).width, pad = size * .35;
      c.width = Math.ceil((tw + pad * 2) * dpr); c.height = Math.ceil(size * 1.5 * dpr);
      g.scale(dpr, dpr); g.font = `700 ${size}px ${FONT}`; g.textBaseline = 'middle'; g.fillStyle = o.color;
      const cy = size * .75;
      g.globalAlpha = .1; for (let i = 0; i < 6; i++) g.fillText(o.text, pad + (R() - .5) * 1.6, cy + (R() - .5) * 1.6);
      g.globalAlpha = o.alpha || .9; g.fillText(o.text, pad, cy);
      g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1;
      const area = (tw + pad * 2) * size * 1.5;
      for (let i = 0; i < area / 9; i++) { const s = .5 + R() * 1.4; g.globalAlpha = .3 + R() * .7; g.fillRect(R() * (tw + pad * 2), R() * size * 1.5, s, s); }
      // профіль
      const im = g.getImageData(0, 0, c.width, c.height).data, cols = [], cum = [0];
      for (let x = 0; x < c.width; x++) {
        let top = -1, bot = -1, cnt = 0;
        for (let y = 0; y < c.height; y += 2) if (im[(y * c.width + x) * 4 + 3] > 60) { if (top < 0) top = y; bot = y; cnt++; }
        cols.push([top, bot]); cum.push(cum[x] + (cnt ? cnt + 2 : .15));
      }
      return { ...o, kind: 'text', c, cols, cum, w: c.width / dpr, h: c.height / dpr, done: 0 };
    }
    const toScreen = (it, lx, ly) => { const cs = Math.cos(it.rot || 0), sn = Math.sin(it.rot || 0); return [it.x + lx * cs - ly * sn, it.y + lx * sn + ly * cs]; };
    function drawTextCols(it, from, to) {
      if (to <= from) return;
      cx.save(); cx.translate(it.x, it.y); cx.rotate(it.rot || 0);
      cx.drawImage(it.c, from, 0, to - from, it.c.height, -it.w / 2 + from / dpr, -it.h / 2, (to - from) / dpr, it.h);
      cx.restore();
    }
    // малюнок: ламані в одиницях розміру, з легким тремтінням руки
    function shapeItem(o) {
      const r = rng(o.seed), ph = [r() * 9, r() * 9, r() * 9, r() * 9];
      const paths = o.paths.map(p => p.map(([a, b], i) => {
        const t = i * .15;
        return [o.x + (a + .018 * Math.sin(t * 1.7 + ph[0]) + .012 * Math.sin(t * 4.1 + ph[1])) * o.size, o.y + (b + .018 * Math.sin(t * 1.3 + ph[2]) + .012 * Math.sin(t * 3.7 + ph[3])) * o.size];
      }));
      let len = 0; const segs = [];
      paths.forEach((p, pi) => { for (let i = 1; i < p.length; i++) { const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); segs.push({ a: p[i - 1], b: p[i], l, col: (o.colors && o.colors[pi]) || o.color }); len += l; } });
      return { ...o, kind: 'shape', segs, len, si: 0, rnd: rng(o.seed + 1) };
    }
    const ellipse = (rx, ry, rot, n = 64, from = 0, to = 1.03) => { const pts = []; for (let i = 0; i <= n; i++) { const a = (from + (to - from) * i / n) * 6.283; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; pts.push([x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)]); } return pts; };
    const line = (a, b, n = 12) => { const p = []; for (let i = 0; i <= n; i++) p.push([a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]); return p; };

    /* ── розкладка ── */
    const C = { w: '#f4f2ea', y: '#f2dc84', p: '#f3a9c3', b: '#a3cdf2' };
    let items = [], queue = [], strokes = [];
    function layout() {
      const port = W / H < .9, u = Math.min(W, H * 1.6) / 100;
      const T = (text, x, y, size, color = C.w, rot = 0, alpha = .84, dur = 1) => textItem({ text, x: x * W, y: y * H, size, color, rot, alpha, dur });
      const S = (paths, x, y, size, color, seed, dur = 1, colors) => shapeItem({ paths, x: x * W, y: y * H, size, color, colors, seed, dur });
      const titleSize = port ? Math.min(W * .3, H * .13) : Math.min(W * .19, H * .3);
      const list = [];
      const tY = port ? .44 : .47;
      list.push(T('Edvault', .5, tY, titleSize, C.w, -.02, .95, 2.6));
      list.push(T(greeting(hour()), .5, tY + titleSize * .62 / H, titleSize * .3, C.w, -.01, .9, 1.3));
      const rect = (x0, y0, x1, y1, n = 8) => [...line([x0, y0], [x1, y0], n), ...line([x1, y0], [x1, y1], n).slice(1), ...line([x1, y1], [x0, y1], n).slice(1), ...line([x0, y1], [x0, y0], n).slice(1)];
      const dot = (x, y, s = .06) => rect(x - s, y - s, x + s, y + s, 2);
      const arrow = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ux = dx / l * .13, uy = dy / l * .13; return [[...line(a, b, 6)], [[b[0] - ux - uy * .7, b[1] - uy + ux * .7], b, [b[0] - ux + uy * .7, b[1] - uy - ux * .7]]]; };
      // перо дизайнера: крива Безьє з ручками
      const bez = (p0, p1, p2, p3) => Array.from({ length: 40 }, (_, i) => { const t = i / 39, m = 1 - t; return [0, 1].map(k => m * m * m * p0[k] + 3 * m * m * t * p1[k] + 3 * m * t * t * p2[k] + t * t * t * p3[k]); });
      const pen = [bez([-1, .5], [-.75, -.75], [.75, -.75], [1, .5]), line([-1, .5], [-.75, -.75], 6), line([1, .5], [.75, -.75], 6), dot(-1, .5), dot(1, .5), dot(-.75, -.75, .05), dot(.75, -.75, .05)];
      const penCol = [C.b, C.w, C.w, C.w, C.w, C.w, C.w];
      // блок-схема алгоритму: дія → умова → дія, з гілкою «ні»
      const flow = [rect(-.5, -1, .5, -.72), ...arrow([0, -.72], [0, -.47]), [[0, -.47], [.6, -.1], [0, .27], [-.6, -.1], [0, -.47]], ...arrow([0, .27], [0, .52]), rect(-.5, .52, .5, .8), ...arrow([.6, -.1], [1, -.1]), ...line([1, -.1], [1, .66], 6).length ? [line([1, -.1], [1, .66], 6)] : [], ...arrow([1, .66], [.52, .66])];
      // макет сторінки (вайрфрейм): шапка, картинка, текст, кнопка
      const wire = [rect(-1.2, -.85, 1.2, .85), line([-1.2, -.55], [1.2, -.55], 10), dot(-1.05, -.7, .05), rect(-1.05, -.38, -.1, .62), line([-1.05, -.38], [-.1, .62], 6), line([-.1, -.38], [-1.05, .62], 6), line([.08, -.3], [1.05, -.3], 6), line([.08, -.08], [.9, -.08], 6), line([.08, .14], [1, .14], 6), rect(.08, .38, .62, .62, 4)];
      const wireCol = [C.w, C.w, C.p, C.y, C.y, C.y, C.w, C.w, C.w, C.p];
      const fs = port ? W * .065 : u * 4;
      if (!port) {
        list.push(T(dateWords(), .5, .075, u * 3.6, C.w, 0, .8, 1.3));
        list.push(T('Класна робота', .5, .145, u * 3.6, C.w, 0, .8, 1.1));
        list.push(T('print("Привіт!")', .17, .2, fs, C.w, -.05, .8, 1.2));
        list.push(S(pen, .84, .23, u * 5.4, C.b, 3, 1.5, penCol));
        list.push(S(flow, .13, .5, u * 6, C.w, 5, 1.6));
        list.push(T('?', .13, .5 - u * .6 / H, fs * .8, C.y, 0, .8, .3));
        list.push(T('</>', .86, .5, fs * 1.3, C.y, .04, .85, .8));
        list.push(T('x = x + 1', .15, .8, fs, C.w, -.03, .8, 1));
        list.push(S([[[-.5, 0], [-.1, .4], [.6, -.5]]], .15 + (fs * 2.5) / W, .8, u * 2.4, C.p, 8, .4));
        list.push(T('color: #F3A9C3;', .46, .82, fs * .9, C.p, .03, .82, 1.3));
        list.push(S(wire, .8, .79, u * 5.4, C.w, 9, 1.8, wireCol));
        list.push(T('Візьміть крейду — і пишіть', .5, .935, u * 2.9, C.y, -.01, .75, 1.4));
      } else {
        list.push(T(dateWords(), .5, .06, W * .07, C.w, 0, .8, 1.2));
        list.push(T('Класна робота', .5, .11, W * .07, C.w, 0, .8, 1));
        list.push(T('print("Привіт!")', .32, .21, fs, C.w, -.05, .8, 1.1));
        list.push(S(pen, .8, .24, W * .1, C.b, 3, 1.3, penCol));
        list.push(S(flow, .25, .7, W * .1, C.w, 5, 1.4));
        list.push(T('?', .25, .7 - W * .01 / H, fs * .8, C.y, 0, .8, .3));
        list.push(S(wire, .73, .7, W * .1, C.w, 9, 1.5, wireCol));
        list.push(T('</>', .25, .845, fs * 1.2, C.y, .04, .85, .7));
        list.push(T('#F3A9C3', .7, .845, fs, C.p, .03, .82, .9));
        list.push(T('Візьміть крейду — і пишіть', .5, .945, W * .055, C.y, -.01, .75, 1.3));
      }
      return list;
    }

    /* ── анімація письма ── */
    let cur = null, tip = null, pause = 0;
    function finishItem(it) {
      if (it.kind === 'text') { drawTextCols(it, it.done, it.c.width); it.done = it.c.width; }
      else { for (; it.si < it.segs.length; it.si++) { const s = it.segs[it.si]; chalkSeg(s.a[0], s.a[1], s.b[0], s.b[1], it.size * .045 + 1.6, s.col, it.rnd, .9); } }
    }
    function finishAll() { if (cur) { finishItem(cur); cur = null; } while (queue.length) { const it = queue.shift(); finishItem(it); } tip = null; }
    function stepWriting(dt) {
      if (pause > 0) { pause -= dt; return; }
      if (!cur) { if (!queue.length) { tip = null; return; } cur = queue.shift(); cur.t = 0; }
      const it = cur; it.t += dt / 1000;
      const p = Math.min(1, it.t / it.dur), e = p < 1 ? p * (1.15 - .15 * p) : 1;
      if (it.kind === 'text') {
        const target = it.cum[it.cum.length - 1] * e;
        let col = it.done; while (col < it.c.width && it.cum[col + 1] <= target) col++;
        drawTextCols(it, it.done, col); it.done = col;
        const pr = it.cols[Math.min(col, it.cols.length - 1)];
        const ly = pr[0] >= 0 ? pr[0] + (pr[1] - pr[0]) * (.5 + .5 * Math.sin(performance.now() / 38)) : it.c.height / 2;
        tip = toScreen(it, -it.w / 2 + col / dpr, -it.h / 2 + ly / dpr); tip.col = it.color;
      } else {
        const target = it.len * e; let acc = 0;
        for (let i = 0; i < it.segs.length; i++) { if (i >= it.si && acc + it.segs[i].l <= target) { const s = it.segs[i]; chalkSeg(s.a[0], s.a[1], s.b[0], s.b[1], it.size * .045 + 1.6, s.col, it.rnd, .9); it.si = i + 1; tip = [s.b[0], s.b[1]]; tip.col = s.col; } acc += it.segs[i].l; }
      }
      if (tip && R() < .5) dust.push({ x: tip[0], y: tip[1], vx: (R() - .5) * .02, vy: R() * .02, life: 1, s: .6 + R() * 1.2 });
      if (p >= 1) { finishItem(it); cur = null; pause = 120 + R() * 220; }
    }

    /* ── власне письмо ── */
    let tool = { kind: 'chalk', color: C.w }, drawing = null, hover = null;
    const pieces = [...document.querySelectorAll('.piece')], eraserBtn = $('eraser');
    const setTool = t => { tool = t; pieces.forEach(p => { const on = t.kind === 'chalk' && p.dataset.c === t.color; p.classList.toggle('on', on); p.setAttribute('aria-pressed', on); }); eraserBtn.classList.toggle('on', t.kind === 'eraser'); eraserBtn.setAttribute('aria-pressed', t.kind === 'eraser'); };
    pieces.forEach(p => p.addEventListener('click', () => setTool({ kind: 'chalk', color: p.dataset.c })));
    let lastEr = 0;
    eraserBtn.addEventListener('click', () => { const n = performance.now(); if (n - lastEr < 400) wipe(); else setTool({ kind: 'eraser' }); lastEr = n; });
    const chalkW = () => Math.max(3.5, Math.min(8, Math.min(W, H) * .0075));
    const eraseR = () => Math.max(22, Math.min(46, Math.min(W, H) * .045));
    const pos = e => { const b = board.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    fx.addEventListener('pointerdown', e => {
      if (wiping) return;
      fx.setPointerCapture(e.pointerId); finishAll();
      const p = pos(e), er = tool.kind === 'eraser' || e.button === 2;
      drawing = { er, color: tool.color, seed: (R() * 1e9) | 0, w: chalkW(), r: eraseR(), pts: [[p[0] / W, p[1] / H]], last: p, t: performance.now() };
      drawing.rnd = rng(drawing.seed);
      if (!er) chalkSeg(p[0], p[1], p[0] + .1, p[1] + .1, drawing.w, drawing.color, drawing.rnd);
      hover = p;
    });
    fx.addEventListener('pointermove', e => {
      const p = pos(e); hover = e.pointerType === 'mouse' || drawing ? p : null;
      if (!drawing) return;
      const now = performance.now(), d = Math.hypot(p[0] - drawing.last[0], p[1] - drawing.last[1]);
      if (d < 1.2) return;
      const v = d / Math.max(8, now - drawing.t), k = Math.max(.55, Math.min(1, 1.15 - v * .35));
      if (drawing.er) eraseSeg(drawing.last[0], drawing.last[1], p[0], p[1], drawing.r);
      else { chalkSeg(drawing.last[0], drawing.last[1], p[0], p[1], drawing.w, drawing.color, drawing.rnd, k); if (R() < .25) dust.push({ x: p[0], y: p[1], vx: (R() - .5) * .02, vy: R() * .02, life: 1, s: .6 + R() * 1.2 }); }
      drawing.pts.push([p[0] / W, p[1] / H, k]); drawing.last = p; drawing.t = now;
    });
    const end = () => { if (drawing) { strokes.push(drawing); drawing = null; } };
    fx.addEventListener('pointerup', e => { end(); if (e.pointerType !== 'mouse') hover = null; });
    fx.addEventListener('pointercancel', end);
    fx.addEventListener('pointerleave', () => { if (!drawing) hover = null; });
    fx.addEventListener('contextmenu', e => e.preventDefault());

    // повторне малювання власних штрихів (після зміни розміру вікна)
    function replay(s) {
      const rnd = rng(s.seed), sx = W, sy = H;
      for (let i = 1; i < s.pts.length; i++) {
        const a = s.pts[i - 1], b = s.pts[i];
        if (s.er) eraseSeg(a[0] * sx, a[1] * sy, b[0] * sx, b[1] * sy, s.r);
        else chalkSeg(a[0] * sx, a[1] * sy, b[0] * sx, b[1] * sy, s.w, s.color, rnd, b[2] || 1);
      }
    }

    /* ── витерти всю дошку: губка проходить змійкою, потім крейда пише знову ── */
    let wiping = null;
    function wipe() {
      if (wiping) return; finishAll(); drawing = null;
      const rows = Math.max(3, Math.round(H / (eraseR() * 2.4))), pts = [];
      for (let i = 0; i <= rows; i++) { const y = H * (i + .5) / (rows + 1); pts.push(i % 2 ? [W + 40, y] : [-40, y], i % 2 ? [-40, y] : [W + 40, y]); }
      wiping = { pts, i: 0, t: 0, last: pts[0] };
      if (still) { while (stepWipe(1000)); }
    }
    function stepWipe(dt) {
      const w = wiping, speed = Math.max(W, H) * 2.6 / 1000;
      let move = speed * dt;
      while (move > 0 && w.i < w.pts.length - 1) {
        const a = w.last, b = w.pts[w.i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const k = Math.min(1, move / Math.max(d, 1e-3)), n = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
        eraseSeg(a[0], a[1], n[0], n[1], eraseR() * 1.5, .5); w.last = n; move -= d * k;
        if (k >= 1) w.i++;
      }
      hover = w.last;
      if (w.i >= w.pts.length - 1) {
        cx.save(); cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = 'rgba(0,0,0,.85)'; cx.fillRect(0, 0, W, H); cx.restore();
        wiping = null; hover = null; strokes = []; items = layout(); queue = [...items]; pause = 500; return false;
      }
      return true;
    }

    /* ── світло з вікна й пил у ньому ── */
    function sunlight() {
      const h = hour(), day = Math.max(0, Math.min(1, (h - 7) / 1.2)) * Math.max(0, Math.min(1, (18.6 - h) / 1.4));
      win.style.opacity = (day * .9).toFixed(2);
      win.style.left = (-8 + Math.max(0, Math.min(1, (h - 8) / 10)) * 70) + '%';
      const warm = Math.max(0, Math.min(1, (h - 15.5) / 3));
      win.style.setProperty('--sun', `rgba(255,${244 - warm * 50},${214 - warm * 90},${.08 + warm * .02})`);
      board.style.filter = h < 6.5 || h > 20.5 ? 'brightness(.82) saturate(.9)' : '';
    }
    const dust = [], motes = Array.from({ length: still ? 0 : 38 }, () => ({ x: R(), y: R(), vx: (R() - .5) * .00002, vy: (R() - .5) * .00002, ph: R() * 6, s: .6 + R() * 1.4 }));

    function drawStick(x, y, col) {
      const g = fxx; g.save(); g.translate(x, y); g.rotate(-.95);
      g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 10; g.shadowOffsetX = 5; g.shadowOffsetY = 8;
      const L = Math.max(46, Math.min(70, W * .045)), w = L * .19;
      const gr = g.createLinearGradient(0, -w / 2, 0, w / 2); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.35, col); gr.addColorStop(1, 'rgba(120,120,110,1)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(3, -w * .32); g.lineTo(L, -w / 2); g.arc(L, 0, w / 2, -Math.PI / 2, Math.PI / 2); g.lineTo(3, w * .32); g.quadraticCurveTo(-1, 0, 3, -w * .32); g.fill();
      g.shadowColor = 'transparent'; g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(6, -w * .38, L - 8, w * .14);
      g.restore();
    }
    function drawEraser(x, y) {
      const g = fxx, ew = Math.max(56, Math.min(92, W * .065)), eh = ew * .42;
      g.save(); g.translate(x, y); g.rotate(-.12); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 14; g.shadowOffsetX = 6; g.shadowOffsetY = 9;
      const gr = g.createLinearGradient(0, -eh / 2, 0, eh / 2); gr.addColorStop(0, '#b07f52'); gr.addColorStop(.55, '#8a5f39'); gr.addColorStop(.56, '#46464b'); gr.addColorStop(1, '#2c2c30');
      g.fillStyle = gr; g.beginPath(); g.roundRect ? g.roundRect(-ew / 2, -eh / 2, ew, eh, 4) : g.rect(-ew / 2, -eh / 2, ew, eh); g.fill();
      g.restore();
    }

    /* ── головний цикл ── */
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(50, now - last); last = now;
      if (wiping) stepWiping(dt); else stepWriting(dt);
      fxx.setTransform(dpr, 0, 0, dpr, 0, 0); fxx.clearRect(0, 0, W, H);
      // пил у промені світла
      const wo = parseFloat(win.style.opacity) || 0;
      for (const m of motes) {
        m.x += m.vx * dt + Math.sin(now / 4000 + m.ph) * .00001 * dt; m.y += m.vy * dt - .000004 * dt; m.ph += dt * .001;
        if (m.x < 0) m.x += 1; if (m.x > 1) m.x -= 1; if (m.y < 0) m.y += 1; if (m.y > 1) m.y -= 1;
        const a = (.25 + .2 * Math.sin(m.ph)) * (.25 + wo);
        fxx.fillStyle = `rgba(255,248,225,${a.toFixed(3)})`; fxx.beginPath(); fxx.arc(m.x * W, m.y * H, m.s, 0, 6.283); fxx.fill();
      }
      // крейдяний пил, що осипається
      for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i]; d.vy += .00006 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt / 1400;
        if (d.life <= 0 || d.y > H) { dust.splice(i, 1); continue; }
        fxx.fillStyle = `rgba(240,240,232,${(d.life * .5).toFixed(3)})`; fxx.fillRect(d.x, d.y, d.s, d.s);
      }
      if (dust.length > 400) dust.splice(0, dust.length - 400);
      // рука з крейдою чи губкою
      if (wiping && hover) drawEraser(hover[0], hover[1]);
      else if (tip) drawStick(tip[0], tip[1], tip.col || C.w);
      else if (hover) { if (tool.kind === 'eraser' || (drawing && drawing.er)) drawEraser(hover[0], hover[1]); else drawStick(hover[0], hover[1], tool.color); }
      requestAnimationFrame(frame);
    }
    const stepWiping = dt => stepWipe(dt);

    /* ── розмір ── */
    function resize() {
      const b = board.getBoundingClientRect(); W = b.width; H = b.height;
      for (const c of [bg, ch, fx]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintBoard();
      cur = null; tip = null; queue = []; wiping = null;
      items = layout(); items.forEach(finishItem);
      strokes.forEach(replay);
    }
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });

    const go = () => {
      const b = board.getBoundingClientRect(); W = b.width; H = b.height;
      for (const c of [bg, ch, fx]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintBoard(); items = layout(); queue = [...items]; pause = 450;
      if (still) finishAll();
      sunlight(); setInterval(sunlight, 60000);
      requestAnimationFrame(t => { last = t; frame(t); });
    };
    Promise.race([Promise.all([document.fonts.load(`700 80px Caveat`), document.fonts.load(`700 80px Caveat`, 'Добрий ранок')]), new Promise(r => setTimeout(r, 2500))]).then(go, go);
  })();
  </script>
</body>
