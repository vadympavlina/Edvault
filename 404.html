<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сторінку не знайдено · Edvault</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Старі адреси: тренажери переїхали з /tools/ у /trainers/, а адмінка списку інструментів більше не потрібна.
  (function () {
    var TRAINERS = ['pen-trainer', 'color-trainer', 'typing-trainer', 'robot', 'mouse-trainer', 'files-trainer'];
    var p = location.pathname.replace(/\/+$/, ''), m = p.match(/^\/tools\/([\w-]+?)(\.html)?$/), to = null;
    if (m && TRAINERS.indexOf(m[1]) >= 0) to = '/trainers/' + m[1];
    else if (/^\/tools-admin(\.html)?$/.test(p)) to = '/tools/';
    if (to) { location.replace(to + location.search + location.hash); return; }
    try {
      var t = localStorage.getItem('edvault-theme') || 'auto';
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<style>
  :root { --bg: #f0f2f5; --surface: #fff; --border: #e2e5ea; --text: #1a1d23; --text2: #4b5563; --accent: #4F6BF4; }
  :root[data-theme="dark"] { --bg: #0f1117; --surface: #171a22; --border: #2a2f3b; --text: #e7e9ef; --text2: #b3b9c6; --accent: #7189ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .box { max-width: 440px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 34px 28px; box-shadow: 0 10px 30px rgba(16,24,40,.08); }
  .code { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
  h1 { font-size: 20px; margin: 14px 0 8px; }
  p { margin: 0 0 22px; color: var(--text2); line-height: 1.55; font-size: 14.5px; }
  .links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
  a:hover { border-color: var(--accent); color: var(--accent); }
  a.main { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Такої сторінки немає</h1>
    <p>Можливо, посилання застаріло або в адресі помилка.</p>
    <div class="links"><a class="main" href="/">На головну</a><a href="/tools/">Інструменти</a><a href="/trainers/">Тренажери</a></div>
  </div>
</body>
</html>
