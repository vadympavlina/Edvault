<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сторінку не знайдено · Edvault</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Старі адреси: інструменти, тренажери й емулятори тепер живуть на окремих сайтах.
  (function () {
    var OLD_TRAINERS = ['pen-trainer', 'color-trainer', 'typing-trainer', 'robot', 'mouse-trainer', 'files-trainer'];
    var p = location.pathname.replace(/\/+$/, ''), to = null;
    var m = p.match(/^\/(tools|trainers|emulators)\/([\w-]+?)(\.html)?$/);
    var SITE = { tools: 'https://tools.edvault.online/', trainers: 'https://trainers.edvault.online/', emulators: 'https://emulators.edvault.online/' };
    // колись тренажери лежали в /tools/
    if (m) to = SITE[m[1] === 'tools' && OLD_TRAINERS.indexOf(m[2]) >= 0 ? 'trainers' : m[1]] + m[2] + '.html';
    else if (/^\/(tools|tools-admin)(\.html)?$/.test(p)) to = SITE.tools;
    else if (/^\/(trainers|emulators)$/.test(p)) to = SITE[p.slice(1)];
    if (to) { location.replace(to + location.search + location.hash); return; }
    try {
      var t = localStorage.getItem('edvault-theme') || 'auto';
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<style>
  :root { --bg: #f0f2f5; --surface: #fff; --border: #e2e5ea; --text: #1a1d23; --text2: #4b5563; --accent: #4F6BF4; }
  :root[data-theme="dark"] { --bg: #0f1117; --surface: #171a22; --border: #2a2f3b; --text: #e7e9ef; --text2: #b3b9c6; --accent: #7189ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .box { max-width: 440px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 34px 28px; box-shadow: 0 10px 30px rgba(16,24,40,.08); }
  .code { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
  h1 { font-size: 20px; margin: 14px 0 8px; }
  p { margin: 0 0 22px; color: var(--text2); line-height: 1.55; font-size: 14.5px; }
  .back { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: 600 15px 'Inter', system-ui, sans-serif; text-decoration: none; cursor: pointer; transition: filter .15s, transform .15s; }
  :root[data-theme="dark"] .back { color: #0f1117; }
  .back:hover { filter: brightness(1.08); }
  .back:active { transform: translateY(1px); }
  .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Такої сторінки немає</h1>
    <p>Можливо, посилання застаріло або в адресі помилка.</p>
    <a class="back" href="/" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Повернутися назад</a>
  </div>
  <script>
    // назад — на попередню сторінку цього сайту; якщо прийшли ззовні чи відкрили напряму — на головну
    document.getElementById('back').addEventListener('click', function (e) {
      var ref = document.referrer, own = false;
      try { own = !!ref && new URL(ref).origin === location.origin; } catch (err) {}
      if (own && history.length > 1) { e.preventDefault(); history.back(); }
    });
  </script>
</body>
</html>
