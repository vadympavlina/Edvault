<title>Спрайт-редактор · Edvault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  try{
    var t = localStorage.getItem('edvault-theme') || localStorage.getItem('edvault-pixel-theme');
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e2e5ea;
    --border2: #d0d5dd;
    --accent: #4F6BF4;
    --accent-light: #eef0fe;
    --accent-hover: #3d57e0;
    --danger: #ef4444;
    --success: #10b981;
    --warn: #f59e0b;
    --text: #1a1d23;
    --text2: #4b5563;
    --muted: #9ca3af;
    --stage: #e6e9ee;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.14), 0 4px 16px rgba(0,0,0,.08);
  }
  html[data-theme="dark"] {
    --bg: #14171c; --surface: #1c212a; --surface2: #232933; --border: #2a313d; --border2: #384152;
    --accent: #6c85ff; --accent-light: rgba(108,133,255,.16); --accent-hover: #8298ff;
    --danger: #ff6b6b; --success: #34d399; --warn: #fbbf24;
    --text: #e8ecf1; --text2: #a8b0bd; --muted: #6b7280; --stage: #101318;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --shadow-md: 0 4px 16px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.55), 0 4px 16px rgba(0,0,0,.35);
  }

  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* =========== TOPBAR =========== */
  .topbar {
    min-height: 60px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 9px clamp(12px, 3vw, 24px); position: sticky; top: 0; z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-logo {
    width: 36px; height: 36px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(79,107,244,.3); flex-shrink: 0;
  }
  .topbar-logo svg { width: 18px; height: 18px; }
  .topbar-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; white-space: nowrap; }
  .topbar-text p { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 1px; white-space: nowrap; }
  .topbar-sep { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .back-btn, .ghost-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 9px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text2);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .13s ease; flex-shrink: 0; text-decoration: none;
  }
  .back-btn:hover, .ghost-btn:hover { border-color: var(--border2); background: var(--surface2); color: var(--text); }
  .back-btn svg, .ghost-btn svg { width: 14px; height: 14px; }
  .ghost-btn { font-weight: 700; }

  .name-input {
    padding: 8px 12px; border: 1.5px solid var(--border2); border-radius: 9px; background: var(--surface);
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text); outline: none;
    transition: all .15s ease; min-width: 110px; width: 200px; max-width: 34vw;
  }
  .name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,107,244,.1); }
  .save-status { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .save-status svg { width: 13px; height: 13px; color: var(--success); }
  .save-status.pending::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

  .retry-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .13s; flex-shrink: 0;
  }
  .retry-btn:hover { background: var(--accent-hover); }
  .retry-btn svg { width: 14px; height: 14px; }
  .retry-btn.danger { background: var(--danger); }

  .view-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .13s ease; flex-shrink: 0;
  }
  .view-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view-btn:disabled { opacity: .35; cursor: default; }
  .view-btn svg { width: 15px; height: 15px; }

  /* =========== CATALOG =========== */
  .main { max-width: 1200px; width: 100%; margin: 0 auto; padding: clamp(24px, 5vw, 44px) clamp(16px, 4vw, 28px) 80px; }
  .stats-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .stats-bar-left { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stats-bar-left b { color: var(--text); font-weight: 700; }
  .catalog-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
  .search-input {
    width: 210px; padding: 9px 12px 9px 32px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }

  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .tool-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 12px 12px 14px;
    cursor: pointer; display: flex; flex-direction: column; gap: 10px; position: relative; box-shadow: var(--shadow-sm);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .15s ease;
    animation: card-appear .3s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes card-appear { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  .tool-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--accent); }
  .thumb-wrap {
    width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#e9ebef 0 25%, #f7f8fa 0 50%) 0 0 / 16px 16px;
  }
  html[data-theme="dark"] .thumb-wrap { background: repeating-conic-gradient(#2a303b 0 25%, #222731 0 50%) 0 0 / 16px 16px; }
  .thumb-wrap canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .tool-name { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; word-break: break-word; padding: 0 4px; }
  .tool-desc { font-size: 11.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; padding: 0 4px; }
  .tool-more {
    position: absolute; top: 18px; right: 18px; width: 28px; height: 28px; border-radius: 8px; border: none;
    background: rgba(255,255,255,.94); color: #4b5563; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .12s ease;
  }
  .tool-card:hover .tool-more, .tool-more.open { opacity: 1; }
  .tool-more svg { width: 15px; height: 15px; }
  @media (hover: none) { .tool-more { opacity: 1; } }
  .no-results { text-align: center; color: var(--muted); font-size: 13.5px; padding: 50px 10px; }

  .empty-state { text-align: center; padding: 70px 20px; display: none; }
  .empty-state.visible { display: block; }
  .empty-icon { font-size: 40px; margin-bottom: 14px; }
  .empty-state h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text2); margin-bottom: 18px; }

  /* popover menu */
  .pop-menu {
    position: fixed; z-index: 200; min-width: 200px; padding: 5px; border-radius: 12px;
    background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow-lg);
  }
  .pop-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; border-radius: 8px;
    background: none; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left;
  }
  .pop-item:hover { background: var(--surface2); }
  .pop-item svg { width: 15px; height: 15px; color: var(--text2); flex-shrink: 0; }
  .pop-item.danger, .pop-item.danger svg { color: var(--danger); }
  .pop-item kbd { margin-left: auto; }
  .pop-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 150; background: rgba(15,18,25,.5);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 22px;
  }
  .modal.modal-sm { max-width: 400px; }
  .modal.modal-lg { max-width: 720px; }
  .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 14px; line-height: 1.55; }
  .modal-input, .num-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border2);
    background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; outline: none;
  }
  .modal-input:focus, .num-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,107,244,.12); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .field-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 7px; }
  .size-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .size-preset {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px; border-radius: 11px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all .12s ease;
  }
  .size-preset b { font-size: 14px; font-family: 'JetBrains Mono', monospace; }
  .size-preset span { font-size: 11px; color: var(--muted); }
  .size-preset:hover { border-color: var(--border2); }
  .size-preset.active { border-color: var(--accent); background: var(--accent-light); }
  .wh-row { display: flex; align-items: center; gap: 8px; }
  .wh-row .num-input { width: 90px; font-family: 'JetBrains Mono', monospace; }
  .wh-row span { color: var(--muted); font-weight: 700; }
  .anchor-grid { display: grid; grid-template-columns: repeat(3, 28px); gap: 4px; }
  .anchor-grid button { width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; }
  .anchor-grid button.active { background: var(--accent); border-color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); font-weight: 600; cursor: pointer; margin-top: 10px; }
  .check-row input { width: 16px; height: 16px; accent-color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    padding: 8px 12px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .seg button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .export-preview {
    margin-top: 14px; border-radius: 12px; border: 1px solid var(--border); min-height: 120px; max-height: 260px; overflow: auto;
    display: flex; align-items: center; justify-content: center; padding: 12px;
    background: repeating-conic-gradient(#e9ebef 0 25%, #f7f8fa 0 50%) 0 0 / 16px 16px;
  }
  html[data-theme="dark"] .export-preview { background: repeating-conic-gradient(#2a303b 0 25%, #222731 0 50%) 0 0 / 16px 16px; }
  .export-preview img, .export-preview canvas { image-rendering: pixelated; max-width: 100%; }
  .export-info { font-size: 12px; color: var(--muted); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
  .kbd-list { display: grid; grid-template-columns: 1fr auto; gap: 7px 18px; font-size: 13px; color: var(--text2); }
  .kbd-list .kbd-sec { grid-column: 1/-1; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 10px; }
  kbd {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text); white-space: nowrap;
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 300;
    background: #1a1d23; color: #fff; padding: 10px 16px; border-radius: 11px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .2s ease; max-width: calc(100vw - 32px);
  }
  html[data-theme="dark"] .toast { background: #e8ecf1; color: #14171c; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* =========== EDITOR =========== */
  #view-editor { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .ed-main { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) 264px; min-height: 0; }

  .toolbar-left {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto;
  }
  .tool-btn {
    width: 42px; height: 40px; border-radius: 10px; border: 1.5px solid transparent; background: none;
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s ease; flex-shrink: 0;
  }
  .tool-btn svg { width: 19px; height: 19px; }
  .tool-btn:hover { background: var(--surface2); color: var(--text); }
  .tool-btn.active { background: var(--accent); color: #fff; }
  .tb-sep { height: 1px; background: var(--border); margin: 4px 4px; flex-shrink: 0; }
  .tool-btn.toggle.on { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .optbar {
    min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 6px 12px; flex-wrap: wrap;
    background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text2); font-weight: 600;
  }
  .opt-title { font-weight: 800; color: var(--text); margin-right: 4px; }
  .opt-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mini-seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); }
  .mini-seg button {
    min-width: 28px; height: 26px; padding: 0 7px; border: none; border-radius: 6px; background: none;
    color: var(--text2); font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .mini-seg button svg { width: 14px; height: 14px; }
  .mini-seg button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
  .mini-btn {
    height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .mini-btn:hover { background: var(--surface2); color: var(--text); }
  .mini-btn svg { width: 13px; height: 13px; }
  .opt-hint { color: var(--muted); font-weight: 500; font-size: 12px; }
  .optbar .spacer { flex: 1; }

  #stage { flex: 1; position: relative; overflow: hidden; background: var(--stage); touch-action: none; min-height: 200px; }
  #pixel-canvas { position: absolute; inset: 0; display: block; cursor: crosshair; touch-action: none; }
  #stage.pan #pixel-canvas { cursor: grab; }
  #stage.panning #pixel-canvas { cursor: grabbing; }
  .zoom-float {
    position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 3px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md);
  }
  .zoom-float button {
    width: 28px; height: 28px; border: none; border-radius: 7px; background: none; color: var(--text2);
    font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .zoom-float button:hover { background: var(--surface2); color: var(--text); }
  .zoom-float button svg { width: 14px; height: 14px; }
  #zoom-value { min-width: 46px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text2); }

  .statusbar {
    height: 26px; display: flex; align-items: center; gap: 16px; padding: 0 12px; flex-shrink: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
  }

  /* frames strip */
  .frames-strip {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-shrink: 0;
    background: var(--surface); border-top: 1px solid var(--border); min-height: 86px;
  }
  .frames-ctrl { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .frames-list { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 6px 4px; flex: 1; min-width: 0; }
  .frame-item { position: relative; flex-shrink: 0; }
  .frame-thumb {
    width: 58px; height: 58px; border-radius: 9px; border: 2px solid var(--border); cursor: pointer; overflow: hidden; display: flex;
    align-items: center; justify-content: center; padding: 3px;
    background: repeating-conic-gradient(#e9ebef 0 25%, #f7f8fa 0 50%) 0 0 / 10px 10px;
  }
  html[data-theme="dark"] .frame-thumb { background: repeating-conic-gradient(#2a303b 0 25%, #222731 0 50%) 0 0 / 10px 10px; }
  .frame-thumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .frame-thumb canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; display: block; }
  .frame-num {
    position: absolute; left: 4px; bottom: 3px; font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', monospace;
    color: #fff; background: rgba(0,0,0,.5); border-radius: 4px; padding: 0 4px; pointer-events: none;
  }
  .frame-actions { position: absolute; top: -7px; right: -7px; display: flex; gap: 3px; opacity: 0; transition: opacity .12s ease; }
  .frame-item:hover .frame-actions { opacity: 1; }
  .frame-actions button {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--surface); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .frame-actions button svg { width: 10px; height: 10px; }
  .frame-actions .fa-dup { background: var(--accent); }
  .frame-actions .fa-del { background: var(--danger); }
  .frame-item.drag-over-left::before, .frame-item.drag-over-right::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--accent);
  }
  .frame-item.drag-over-left::before { left: -6px; }
  .frame-item.drag-over-right::after { right: -6px; }
  .frame-add {
    width: 58px; height: 58px; border-radius: 9px; border: 1.5px dashed var(--border2); background: none; flex-shrink: 0;
    color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .frame-add:hover { color: var(--accent); border-color: var(--accent); }
  .frame-add svg { width: 20px; height: 20px; }

  /* right panel */
  .right-panel {
    background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .panel-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-label select {
    border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text);
    font-family: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 6px; text-transform: none; letter-spacing: 0; cursor: pointer;
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-big {
    width: 46px; height: 46px; border-radius: 11px; border: 1.5px solid var(--border2); flex-shrink: 0; position: relative; overflow: hidden; cursor: pointer;
  }
  .color-big input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border: none; padding: 0; cursor: pointer; opacity: 0; }
  .color-big .fill { position: absolute; inset: 0; }
  .color-meta { flex: 1; min-width: 0; }
  .hex-input {
    width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; outline: none; text-transform: uppercase;
  }
  .hex-input:focus { border-color: var(--accent); }
  .recent-row { display: flex; gap: 4px; margin-top: 6px; min-height: 16px; }
  .recent-row button { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; }
  .palette-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .swatch {
    aspect-ratio: 1; border-radius: 6px; border: 1px solid rgba(0,0,0,.14); cursor: pointer; padding: 0; transition: transform .08s ease;
  }
  .swatch:hover { transform: scale(1.14); z-index: 1; }
  .swatch.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatch.add { border: 1.5px dashed var(--border2); background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .swatch.add svg { width: 12px; height: 12px; }
  .panel-empty { font-size: 12px; color: var(--muted); }

  .preview-box {
    border-radius: 12px; border: 1px solid var(--border); height: 150px; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#e9ebef 0 25%, #f7f8fa 0 50%) 0 0 / 14px 14px; overflow: hidden; cursor: pointer;
  }
  html[data-theme="dark"] .preview-box { background: repeating-conic-gradient(#2a303b 0 25%, #222731 0 50%) 0 0 / 14px 14px; }
  .preview-box canvas { image-rendering: pixelated; }
  .preview-ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
  .fps-control { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text2); white-space: nowrap; }
  .fps-control button {
    width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; color: var(--text);
  }
  .fps-control button:hover { background: var(--surface2); }
  .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .icon-tile {
    height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-tile:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .icon-tile svg { width: 16px; height: 16px; }
  .wide-btn {
    width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: 12.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .wide-btn:hover { background: var(--surface2); color: var(--text); }
  .wide-btn svg { width: 14px; height: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--text2); margin-top: 8px; cursor: pointer; }
  .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: var(--border2); border-radius: 20px; cursor: pointer; transition: background .15s ease; }
  .switch .slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s ease; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(14px); }
  .size-line { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; color: var(--text); }

  @media (max-width: 900px) {
    .ed-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(260px, 1fr) auto; }
    .toolbar-left { flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; padding: 6px 8px; }
    .tb-sep { width: 1px; height: auto; margin: 4px 2px; }
    .right-panel { border-left: none; border-top: 1px solid var(--border); max-height: 34vh; }
    .hide-sm { display: none !important; }
    .name-input { width: 130px; }
    .search-input { width: 150px; }
  }
</style>
</head>
<body>

<!-- ============ CATALOG VIEW ============ -->
<div id="view-catalog">
  <div class="topbar">
    <div class="topbar-left">

  <div class="main">

    </div>

    <div class="tools-grid" id="grid"></div>

        Створити спрайт
      </button>
    </div>
  </div>
</div>

<!-- ============ EDITOR VIEW ============ -->
<div id="view-editor" class="hidden">

    <div class="topbar-left">
      <button class="back-btn" id="back-btn" title="До списку спрайтів">

    </div>
  </div>
</div>

      }
      // mirror axes
      if(mirrorX){ ctx.fillStyle = 'rgba(236,72,153,.75)'; ctx.fillRect(ox + w / 2 - 1, oy, 2, h); }
      if(mirrorY){ ctx.fillStyle = 'rgba(236,72,153,.75)'; ctx.fillRect(ox, oy + h / 2 - 1, w, 2); }

      if(hover && !drag && !spaceDown && ['pencil','eraser','shade','fill','picker','line','rect','ellipse'].includes(tool) && inside(hover.x, hover.y)){
        const size = (tool === 'pencil' || tool === 'eraser') ? brush : 1;
        const off = Math.floor((size - 1) / 2);
        ctx.save();
        if(tool === 'pencil' || ['line','rect','ellipse','fill'].includes(tool)){ ctx.fillStyle = color; ctx.globalAlpha = .55; ctx.fillRect(ox + (hover.x - off) * z, oy + (hover.y - off) * z, size * z, size * z); }
        ctx.globalAlpha = 1; ctx.lineWidth = 1.5; ctx.strokeStyle = dark ? '#fff' : '#111';

        ctx.strokeStyle = '#4f6bf4'; ctx.setLineDash([4, 3]); ctx.strokeRect(ox + r.x * z + .5, oy + r.y * z + .5, r.w * z - 1, r.h * z - 1); ctx.restore();

  let autoFit = true;   // keep the sprite centred on resize until the user zooms or pans
  let antsOffset = 0;
  setInterval(() => { if(sel && !viewEditor.classList.contains('hidden')){ antsOffset = (antsOffset + 1) % 8; render(); } }, 120);

  // ---------- View: zoom & pan ----------
  function resizeCanvas(){
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));

    checker = checkerDark = null;
    renderNow();
  }
  new ResizeObserver(() => { if(!viewEditor.classList.contains('hidden')){ resizeCanvas(); if(autoFit) fitView(); } }).observe(stage);

  function fitZoom(){
    const r = stage.getBoundingClientRect();
    return clamp(Math.floor(Math.min((r.width - 48) / W, (r.height - 48) / H)), 1, 64);
  }
  function fitView(){
    const r = stage.getBoundingClientRect();
    view.zoom = fitZoom();
    view.ox = Math.round((r.width - W * view.zoom) / 2);
    view.oy = Math.round((r.height - H * view.zoom) / 2);
    autoFit = true;
    updateZoomLabel(); render();
  }
  function setZoom(z, cx, cy){
    const r = stage.getBoundingClientRect();

    z = clamp(Math.round(z), 1, 80);
    if(z === view.zoom) return;

    view.zoom = z; autoFit = false;
    view.ox = cx - wx * z; view.oy = cy - wy * z;

  }
  const zoomStep = (dir) => { const z = view.zoom; return dir > 0 ? (z < 4 ? z + 1 : z * 1.25) : (z <= 4 ? z - 1 : z / 1.25); };
  function updateZoomLabel(){ $('zoom-value').textContent = Math.round(view.zoom * 100) + '%'; }
  $('zoom-in').onclick = () => setZoom(zoomStep(1));
  $('zoom-out').onclick = () => setZoom(zoomStep(-1));
  $('zoom-fit').onclick = fitView;
  stage.addEventListener('wheel', e => {
    e.preventDefault();

      if(e.ctrlKey || e.metaKey || !e.shiftKey) setZoom(zoomStep(e.deltaY < 0 ? 1 : -1), e.clientX - r.left, e.clientY - r.top);

  function cellAt(e){
    const r = canvas.getBoundingClientRect();

  // ---------- Pointer interaction ----------
  let drag = null;           // active gesture
  let selDraft = null;       // selection being drawn { a, b }
  let spaceDown = false;
  let shadeVisited = null;
  const pinch = new Map();

  function normRect(a, b){

  const inSel = c => sel && c.x >= sel.x && c.y >= sel.y && c.x < sel.x + sel.w && c.y < sel.y + sel.h;

  function pickColorAt(c){
    if(!inside(c.x, c.y)) return;
    const v = (sel && sel.float && inSel(c)) ? sel.float.px[(c.y - sel.y) * sel.float.w + (c.x - sel.x)] : px()[c.y * W + c.x];
    if(v) setColor(v); else toast('Тут прозорий піксель');
  }

  function applyBrush(c, erase){

  // ---------- Selection ----------
  function liftSelection(){

  function copySel(cut){

    let data;
    if(sel.float) data = { w: sel.float.w, h: sel.float.h, px: sel.float.px.slice() };
    else {

  // ---------- Transforms ----------

  const TRANSFORMS = [

  // ---------- Canvas size ----------
  function updateSizeLine(){ $('size-line').textContent = `${W} × ${H} пікс.`; }

  function openResize(){

  // ---------- GIF encoder (LZW, global palette, transparency) ----------
  function encodeGIF(frameArrs, w, h, scale, delayMs, bg){
    const sw = w * scale, sh = h * scale;
    // palette: index 0 = transparent (or background)
    const colors = new Map(); const pal = [[0, 0, 0]];
    frameArrs.forEach(a => a.forEach(c => { if(c && !colors.has(c) && pal.length < 256){ colors.set(c, pal.length); pal.push(hexToRgb(c)); } }));
    const nearest = (c) => { // only if more than 255 colours
      const [r, g, b] = hexToRgb(c); let best = 1, bd = Infinity;
      for(let i = 1; i < pal.length; i++){ const p = pal[i], d = (p[0]-r)**2 + (p[1]-g)**2 + (p[2]-b)**2; if(d < bd){ bd = d; best = i; } }
      colors.set(c, best); return best;
    };
    if(bg) pal[0] = hexToRgb(bg);
    let bits = 1; while((1 << bits) < pal.length) bits++;
    const size = 1 << bits;
    const out = [];
    const str = s => { for(let i = 0; i < s.length; i++) out.push(s.charCodeAt(i)); };
    const u16 = v => out.push(v & 255, (v >> 8) & 255);
    str('GIF89a'); u16(sw); u16(sh);
    out.push(0x80 | ((bits - 1) << 4) | (bits - 1), 0, 0);
    for(let i = 0; i < size; i++){ const p = pal[i] || [0, 0, 0]; out.push(p[0], p[1], p[2]); }
    if(frameArrs.length > 1){ out.push(0x21, 0xff, 11); str('NETSCAPE2.0'); out.push(3, 1); u16(0); out.push(0); }
    const minCode = Math.max(2, bits);
    frameArrs.forEach(a => {
      out.push(0x21, 0xf9, 4, (2 << 2) | (bg ? 0 : 1)); u16(Math.round(delayMs / 10)); out.push(0, 0);
      out.push(0x2c); u16(0); u16(0); u16(sw); u16(sh); out.push(0);
      const idx = new Uint8Array(sw * sh);
      for(let y = 0; y < sh; y++) for(let x = 0; x < sw; x++){
        const c = a[Math.floor(y / scale) * w + Math.floor(x / scale)];
        idx[y * sw + x] = c ? (colors.get(c) ?? nearest(c)) : 0;
      }
      out.push(minCode);
      const data = lzw(idx, minCode);
      for(let i = 0; i < data.length; i += 255){ const chunk = data.slice(i, i + 255); out.push(chunk.length); for(const b of chunk) out.push(b); }
      out.push(0);
    });
    out.push(0x3b);
    return new Uint8Array(out);
  }
  function lzw(indices, minCode){
    const clear = 1 << minCode, eoi = clear + 1;
    let codeSize = minCode + 1, next = eoi + 1;
    let dict = new Map();
    const out = []; let acc = 0, accBits = 0;
    const emit = c => { acc |= c << accBits; accBits += codeSize; while(accBits >= 8){ out.push(acc & 255); acc >>>= 8; accBits -= 8; } };
    emit(clear);
    let prefix = indices[0];
    for(let i = 1; i < indices.length; i++){
      const k = indices[i], key = prefix * 256 + k, v = dict.get(key);
      if(v !== undefined){ prefix = v; continue; }
      emit(prefix);
      if(next === 4096){ emit(clear); dict = new Map(); codeSize = minCode + 1; next = eoi + 1; }
      else { if(next >= (1 << codeSize)) codeSize++; dict.set(key, next++); }
      prefix = k;
    }
    emit(prefix); emit(eoi);
    if(accBits > 0) out.push(acc & 255);
    return out;
  }

    const name = slugify($('sprite-name').value).replace(/-/g, '_').replace(/^(\d)/, '_$1') || 'sprite';

    }
    const url = frameToCanvas(frames[0]).toDataURL('image/png');
    return `// Спрайт «${$('sprite-name').value || 'спрайт'}» ${W}×${H}\nconst ${name} = new Image();\n${name}.src = "${url}";\n\n// малювання в грі (scale — у скільки разів збільшити):\nfunction draw${cap(name)}(ctx, x, y, scale = 4){\n  ctx.imageSmoothingEnabled = false;\n  ctx.drawImage(${name}, x, y, ${W} * scale, ${H} * scale);\n}`;

  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function openExport(){

  // ---------- Import image ----------
  function loadImageFile(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
      img.onerror = () => { reject(new Error('bad image')); URL.revokeObjectURL(url); };
      img.src = url;
    });
  }
  function imageToPixels(img, tw, th){
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = img.naturalWidth > tw * 2; // shrink photos smoothly, keep pixel art crisp
    g.drawImage(img, 0, 0, tw, th);
    const d = g.getImageData(0, 0, tw, th).data, out = new Array(tw * th).fill(null);
    for(let i = 0; i < out.length; i++) if(d[i * 4 + 3] >= 128) out[i] = rgbToHex(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
    return out;
  }
  function fitSize(iw, ih, max){
    if(iw <= max && ih <= max) return [iw, ih];
    const k = max / Math.max(iw, ih);
    return [Math.max(1, Math.round(iw * k)), Math.max(1, Math.round(ih * k))];
  }

    const [nw, nh] = fitSize(iw, ih, 64);
    let mode = 'fit', target = 'replace';
    const box = openModal(`<h3 class="modal-title">Імпорт картинки</h3>

      for(let y = 0; y < th; y++) for(let x = 0; x < tw; x++) arr[(y + offY) * W + x + offX] = small[y * tw + x];

    list.forEach(s => {
      const d = decodeSprite(s);
      const card = document.createElement('div');
      card.className = 'tool-card';
      card.innerHTML = `<div class="thumb-wrap"></div>

  async function quickPng(s){
    const d = decodeSprite(s);
    const k = Math.max(1, Math.floor(512 / Math.max(d.w, d.h)));

    const c = document.createElement('canvas'); c.width = d.w * k * cols; c.height = d.h * k;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    d.frames.forEach((f, i) => g.drawImage(frameToCanvas(f, d.w, d.h), i * d.w * k, 0, d.w * k, d.h * k));

    const box = openModal(`<h3 class="modal-title">Гарячі клавіші та підказки</h3>
      <div class="kbd-list">
        <div class="kbd-sec">Інструменти</div>
        ${TOOLS.map(t => row(t.label, t.key)).join('')}
        ${row('Розмір пензля', '[ ]')}
        ${row('Піпетка з будь-якого інструмента', 'Alt+клік')}
        ${row('Стерти олівцем', 'Права кнопка')}
        <div class="kbd-sec">Полотно</div>
        ${row('Наблизити / віддалити', '+ − коліщатко')}
        ${row('Вмістити все', '0')}
        ${row('Перетягнути полотно', 'Пробіл+миша')}
        ${row('Сітка', '#')}
        <div class="kbd-sec">Редагування</div>
        ${row('Скасувати / повернути', 'Mod+Z Mod+Y')}
        ${row('Виділити все', 'Mod+A')}
        ${row('Копіювати / вирізати / вставити', 'Mod+C Mod+X Mod+V')}
        ${row('Видалити виділене', 'Delete')}
        ${row('Зсунути виділене на 1 піксель', '← ↑ → ↓')}
        ${row('Зняти виділення', 'Esc')}
        ${row('Віддзеркалити / повернути', 'Shift+H Shift+V Shift+R')}
        <div class="kbd-sec">Кадри</div>
        ${row('Попередній / наступний кадр', ', .')}
        ${row('Новий кадр / дублювати', 'N Shift+N')}
        ${row('Програти анімацію', 'Enter')}
      </div>
      <div class="modal-actions"><button class="retry-btn" data-x>Зрозуміло</button></div>`);
    box.querySelector('[data-x]').onclick = closeModal;
  };

  // ---------- Keyboard ----------
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if(menuEl){ closeMenu(); return; }
      if(isModalOpen()){ closeModal(); return; }
    }
    if(viewEditor.classList.contains('hidden') || isModalOpen()) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
    const mod = e.ctrlKey || e.metaKey;
    if(mod){
      if(e.code === 'KeyZ' && !e.shiftKey){ e.preventDefault(); undo(); }
      else if(e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)){ e.preventDefault(); redo(); }
      else if(e.code === 'KeyS'){ e.preventDefault(); commitFloat(); if(save()) toast('Збережено'); }
      else if(e.code === 'KeyC'){ e.preventDefault(); copySel(false); updateOptbar(); }
      else if(e.code === 'KeyX'){ e.preventDefault(); copySel(true); updateOptbar(); }
      else if(e.code === 'KeyV'){ e.preventDefault(); paste(); }
      else if(e.code === 'KeyA'){ e.preventDefault(); selectAll(); }
      return;
    }
    if(e.code === 'Space'){ if(!spaceDown){ spaceDown = true; stage.classList.add('pan'); } e.preventDefault(); return; }
    if(e.shiftKey && e.code === 'KeyH'){ flip(true); return; }
    if(e.shiftKey && e.code === 'KeyV'){ flip(false); return; }
    if(e.shiftKey && e.code === 'KeyR'){ rotate(true); return; }
    if(e.shiftKey && e.code === 'KeyN'){ duplicateFrame(cur); return; }
    const t = TOOLS.find(x => 'Key' + x.key === e.code);
    if(t && !e.altKey){ setTool(t.id); return; }
    switch(e.code){
      case 'BracketLeft': brush = Math.max(1, brush - 1); updateOptbar(); render(); break;
      case 'BracketRight': brush = Math.min(4, brush + 1); updateOptbar(); render(); break;
      case 'Equal': case 'NumpadAdd': setZoom(zoomStep(1)); break;
      case 'Minus': case 'NumpadSubtract': setZoom(zoomStep(-1)); break;
      case 'Digit0': case 'Numpad0': fitView(); break;
      case 'Delete': case 'Backspace': if(sel){ e.preventDefault(); deleteSel(); updateOptbar(); } break;
      case 'Escape': if(canvasPlaying) stopCanvasPlay(); else clearSelection(); break;
      case 'Enter': canvasPlaying ? stopCanvasPlay() : startCanvasPlay(); break;
      case 'Comma': switchFrame((cur - 1 + frames.length) % frames.length); break;
      case 'Period': switchFrame((cur + 1) % frames.length); break;
      case 'KeyN': addFrame(); break;
      case 'Digit3': if(e.shiftKey){ showGrid = !showGrid; $('grid-toggle').checked = showGrid; render(); } break;
      case 'ArrowLeft': if(sel){ e.preventDefault(); nudge(-1, 0); } break;
      case 'ArrowRight': if(sel){ e.preventDefault(); nudge(1, 0); } break;
      case 'ArrowUp': if(sel){ e.preventDefault(); nudge(0, -1); } break;
      case 'ArrowDown': if(sel){ e.preventDefault(); nudge(0, 1); } break;
    }
  });
  document.addEventListener('keyup', e => { if(e.code === 'Space'){ spaceDown = false; stage.classList.remove('pan'); } });
  window.addEventListener('blur', () => { spaceDown = false; stage.classList.remove('pan'); });

  // ---------- Start ----------
  applyTheme(isDarkTheme());
  setColor(color);
  renderPalette();
  renderCatalog();
  window.__spriteEditor = { get state(){ return { W, H, frames, cur, sel, tool, color, undo: undoStack.length, view: { ...view } }; }, encodeGIF };
})();
</script>

</body>
</html>
