  // ---------- Mini-Emmet for the HTML pane ----------
  // "ul>li*3", "div.card>h2{Title}+p", "a[href=#]", "(li>a)*2" … then Tab.
  const EMMET_TAGS = new Set(('a abbr address article aside audio b blockquote br button canvas caption code col dd details '
    + 'dialog div dl dt em fieldset figcaption figure footer form h1 h2 h3 h4 h5 h6 header hr i iframe img input label legend '
    + 'li main mark nav ol optgroup option p picture pre progress q s section select small source span strong sub summary sup '
    + 'table tbody td textarea tfoot th thead time tr u ul video svg').split(' '));
  const EMMET_VOID = new Set(['br','hr','img','input','source','col','meta','link']);
  const EMMET_CHILD = { ul:'li', ol:'li', table:'tr', tbody:'tr', thead:'tr', tfoot:'tr', tr:'td', select:'option', optgroup:'option', dl:'dt' };
  const EMMET_INLINE = new Set(['a','b','i','em','strong','span','small','label','button','p','h1','h2','h3','h4','h5','h6','q','s','u','sub','sup','mark','abbr','code']);
  const EMMET_DEFAULT_ATTRS = { a:{ href:'' }, img:{ src:'', alt:'' }, input:{ type:'text' }, label:{ for:'' }, iframe:{ src:'' }, form:{ action:'' } };
  const CARET = '\u0001';

  function emmetParse(s){
    let i = 0;
    const fail = () => { throw new Error('bad abbr'); };
    function parseEl(){
      const node = { tag:'', id:'', cls:[], attrs:[], text:null, count:1, children:[] };
      let any = false;
      const m = /^[a-zA-Z][\w-]*/.exec(s.slice(i));
      if(m){ node.tag = m[0].toLowerCase(); i += m[0].length; any = true; }
      while(i < s.length){
        const c = s[i];
        if(c === '.' || c === '#'){
          const mm = /^[\w$-]+/.exec(s.slice(i + 1)); if(!mm) fail();
          if(c === '.') node.cls.push(mm[0]); else node.id = mm[0];
          i += 1 + mm[0].length; any = true;
        } else if(c === '['){
          const end = s.indexOf(']', i); if(end < 0) fail();
          const re = /([\w:@-]+)(?:=("[^"]*"|'[^']*'|[^\s\]]+))?/g; let am;
          const body = s.slice(i + 1, end);
          while((am = re.exec(body))) node.attrs.push([am[1], am[2] == null ? '' : am[2].replace(/^["']|["']$/g, '')]);
          i = end + 1; any = true;
        } else if(c === '{'){
          const end = s.indexOf('}', i); if(end < 0) fail();
          node.text = s.slice(i + 1, end); i = end + 1; any = true;
        } else break;
      }
      if(!any) fail();
      return node;
    }
    function parseSeq(){
      const root = { children:[] };
      const stack = [root];
      while(i < s.length && s[i] !== ')'){
        let node;
        if(s[i] === '('){ i++; node = { group:true, children: parseSeq(), count:1 }; if(s[i] !== ')') fail(); i++; }
        else node = parseEl();
        if(s[i] === '*'){ const m = /^\*(\d+)/.exec(s.slice(i)); if(!m) fail(); node.count = Math.min(100, +m[1]); i += m[0].length; }
        stack[stack.length - 1].children.push(node);
        const op = s[i];
        if(op === '>'){ if(node.group) fail(); i++; stack.push(node); if(i >= s.length) fail(); }
        else if(op === '+'){ i++; if(i >= s.length) fail(); }
        else if(op === '^'){ while(s[i] === '^'){ i++; if(stack.length > 1) stack.pop(); } }
        else if(op !== undefined && op !== ')') fail();
      }
      return root.children;
    }
    const nodes = parseSeq();
    if(i !== s.length || !nodes.length) fail();
    return nodes;
  }
  function emmetRender(nodes, parentTag, pad, unit, outerK){
    const out = [];
    nodes.forEach(n => {
      for(let k = 1; k <= n.count; k++){
        const idx = n.count > 1 ? k : outerK;
        const num = str => str.replace(/\$+/g, m => String(idx).padStart(m.length, '0'));
        if(n.group){ out.push(...emmetRender(n.children, parentTag, pad, unit, idx)); continue; }
        const tag = n.tag || EMMET_CHILD[parentTag] || (EMMET_INLINE.has(parentTag) ? 'span' : 'div');
        let attrs = '';
        if(n.id) attrs += ` id="${num(n.id)}"`;
        if(n.cls.length) attrs += ` class="${num(n.cls.join(' '))}"`;
        const given = new Set(n.attrs.map(a => a[0]));
        n.attrs.forEach(([k2, v]) => { attrs += ` ${k2}="${v ? num(v) : CARET}"`; });
        Object.entries(EMMET_DEFAULT_ATTRS[tag] || {}).forEach(([k2, v]) => { if(!given.has(k2)) attrs += ` ${k2}="${v || CARET}"`; });
        const open = `<${tag}${attrs}>`;
        if(EMMET_VOID.has(tag)){ out.push(pad + open); continue; }
        const text = n.text != null ? num(n.text) : '';
        const only = n.children.length === 1 ? n.children[0] : null;
        if(only && !only.group && only.count === 1 && !only.children.length && EMMET_INLINE.has(only.tag || 'span')){
          // a single inline child stays on the same line: <li><a href="">…</a></li>
          out.push(pad + open + text + emmetRender(n.children, tag, '', unit, idx)[0] + `</${tag}>`);
        } else if(n.children.length){
          out.push(pad + open + text);
          out.push(...emmetRender(n.children, tag, pad + unit, unit, idx));
          out.push(pad + `</${tag}>`);
        } else {
          out.push(pad + open + (text || CARET) + `</${tag}>`);
        }
      }
    });
    return out;
  }
  function tryEmmet(cm){
    if(cm.somethingSelected()) return false;
    const cur = cm.getCursor();
    if(cm.getModeAt(cur).name !== 'xml') return false;
    const tok = cm.getTokenAt(cur);
    if(tok.type && /tag|attribute|string|comment|bracket/.test(tok.type) && tok.end >= cur.ch && tok.start < cur.ch) return false;
    const line = cm.getLine(cur.line);
    const before = line.slice(0, cur.ch);
    // left bound: end of the last real HTML token (tag/bracket) on this line
    let bound = 0;
    cm.getLineTokens(cur.line).forEach(t => { if(t.end <= cur.ch && t.type && /tag|bracket|attribute|string|comment/.test(t.type)) bound = Math.max(bound, t.end); });
    let j = cur.ch, sq = 0, cu = 0;
    while(j > bound){
      const c = before[j - 1];
      if(c === ']') sq++; else if(c === '[') sq--;
      else if(c === '}') cu++; else if(c === '{') cu--;
      else if(sq <= 0 && cu <= 0 && /[\s<]/.test(c)) break;
      j--;
    }
    const abbr = before.slice(j);
    if(!abbr || !/^[a-zA-Z.#(\[]/.test(abbr)) return false;
    const first = /^[a-zA-Z][\w-]*/.exec(abbr.replace(/^\(+/, ''));
    if(first && !EMMET_TAGS.has(first[0].toLowerCase())) return false;
    if(/^[a-zA-Z]+$/.test(abbr) && !EMMET_TAGS.has(abbr.toLowerCase())) return false;
    let nodes;
    try{ nodes = emmetParse(abbr); }catch(e){ return false; }
    const lineIndent = /^\s*/.exec(line)[0];
    const unit = ' '.repeat(cm.getOption('indentUnit') || 2);
    const lines = emmetRender(nodes, '', '', unit, 1);
    let text = lines.map((l, k) => (k ? lineIndent : '') + l).join('\n');
    const caretAt = text.indexOf(CARET);
    text = text.split(CARET).join('');
    const from = { line: cur.line, ch: j };
    cm.replaceRange(text, from, cur, '+emmet');
    if(caretAt >= 0){
      const pre = text.slice(0, caretAt).split('\n');
      cm.setCursor({ line: cur.line + pre.length - 1, ch: (pre.length === 1 ? j : 0) + pre[pre.length - 1].length });
    }
    return true;
  }

  function smartTab(cm){
    if(cm.state.completionActive && cm.state.completionActive.widget) return CodeMirror.Pass;
    if(cm.state.completionActive) cm.state.completionActive.close();
    if(cm.somethingSelected()){ cm.execCommand('indentMore'); return; }
    if(cm === cmHtml && tryEmmet(cm)) return;
    cm.execCommand('insertSoftTab');
  }

  // ---------- Colour swatches in CSS ----------
  const COLOR_RE = /#(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{3,4})\b|(?:rgba?|hsla?)\([^()]*\)/g;
  let swatchMarks = [], swatchTimer = null;
  function refreshSwatches(){
    if(!cmCss) return;
    cmCss.operation(() => {
      swatchMarks.forEach(m => m.clear());
      swatchMarks = [];
      cmCss.eachLine(lh => {
        const ln = cmCss.getLineNumber(lh);
        const text = lh.text;
        if(text.length > 2000) return;
        COLOR_RE.lastIndex = 0;
        let m;
        while((m = COLOR_RE.exec(text))){
          const type = cmCss.getTokenTypeAt({ line: ln, ch: m.index + 1 }) || '';
          if(/builtin|comment|qualifier|tag/.test(type)) continue; // #id selectors, comments
          if(!CSS.supports('color', m[0])) continue;
          const w = document.createElement('span');
          w.className = 'cm-swatch';
          w.style.setProperty('--sw', m[0]);
          w.title = 'Клацни, щоб вибрати колір';
          const bm = cmCss.setBookmark({ line: ln, ch: m.index }, { widget: w, insertLeft: true });
          w.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); pickColor(bm, w); });
          swatchMarks.push(bm);
        }
      });
    });
  }
  function scheduleSwatches(){ clearTimeout(swatchTimer); swatchTimer = setTimeout(refreshSwatches, 250); }
  function cssToRgba(color){
    const c = document.createElement('canvas').getContext('2d');
    c.fillStyle = '#000'; c.fillStyle = color;
    const v = c.fillStyle; // "#rrggbb" or "rgba(r, g, b, a)"
    if(v[0] === '#') return { hex: v, a: 1 };
    const m = v.match(/[\d.]+/g).map(Number);
    return { hex: '#' + m.slice(0, 3).map(x => x.toString(16).padStart(2, '0')).join(''), a: m[3] == null ? 1 : m[3] };
  }
  let pickState = null;
  function pickColor(bm, w){
    const pos = bm.find(); if(!pos) return;
    const lineText = cmCss.getLine(pos.line);
    COLOR_RE.lastIndex = pos.ch;
    const m = COLOR_RE.exec(lineText);
    if(!m || m.index !== pos.ch) return;
    const { hex, a } = cssToRgba(m[0]);
    pickState = { line: pos.line, ch: pos.ch, len: m[0].length, alpha: a, first: true, orig: m[0] };
    const r = w.getBoundingClientRect();
    colorInput.style.left = r.left + 'px'; colorInput.style.top = (r.bottom + 2) + 'px';
    colorInput.value = hex;
    colorInput.click();
  }
  colorInput.addEventListener('input', () => {
    if(!pickState) return;
    const v = colorInput.value;
    let out = v;
    if(pickState.alpha < 1){
      const n = [1, 3, 5].map(k => parseInt(v.slice(k, k + 2), 16));
      out = `rgba(${n.join(', ')}, ${pickState.alpha})`;
    }
    const from = { line: pickState.line, ch: pickState.ch }, to = { line: pickState.line, ch: pickState.ch + pickState.len };
    cmCss.replaceRange(out, from, to, pickState.first ? '+color' : '*color');
    pickState.first = false;
    pickState.len = out.length;
  });
  colorInput.addEventListener('change', () => { pickState = null; refreshSwatches(); });

  // ---------- Code formatting (Prettier, loaded on first use) ----------
  const PRETTIER_BASE = 'https://cdn.jsdelivr.net/npm/prettier@3.3.3/';
  let prettierReady = null;
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('load ' + src));
      document.head.appendChild(s);
    });
  }
  function loadPrettier(){
    if(!prettierReady){
      prettierReady = loadScript(PRETTIER_BASE + 'standalone.js')
        .then(() => Promise.all(['html','postcss','babel','estree'].map(n => loadScript(PRETTIER_BASE + 'plugins/' + n + '.js'))))
        .catch(e => { prettierReady = null; throw e; });
    }
    return prettierReady;
  }
  async function formatCode(lang){
    const cm = cmByLang[lang];
    const src = cm.getValue();
    if(!src.trim()){ toast('Тут поки немає коду'); return; }
    try{ await loadPrettier(); }
    catch(e){ toast('Не вдалося завантажити форматувальник — перевір інтернет', 3500); return; }
    try{
      const out = (await prettier.format(src, {
        parser: { html:'html', css:'css', js:'babel' }[lang],
        plugins: Object.values(window.prettierPlugins || {}),
        tabWidth: 2, printWidth: 90
      })).replace(/\n+$/, '');
      if(out === src.replace(/\n+$/, '')){ toast('Код уже впорядкований'); return; }
      const line = cm.getCursor().line;
      const last = cm.lastLine();
      cm.operation(() => {
        cm.replaceRange(out, { line:0, ch:0 }, { line:last, ch:cm.getLine(last).length }, '+format');
        cm.setCursor({ line: Math.min(line, cm.lastLine()), ch: 0 });
      });
      toast('Код упорядковано');
    }catch(e){
      const msg = String(e && e.message || e).split('\n')[0];
      const pos = msg.match(/\((\d+):(\d+)\)/);
      toast(pos ? `Не вдалося впорядкувати: помилка в рядку ${pos[1]}` : 'Не вдалося впорядкувати: ' + msg, 4000);
    }
  }

  // ---------- CodeMirror setup ----------
  function runNow(){ updatePreview(); }
  function initEditors(){
    const cmOptions = {
      theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dracula' : 'idea',
      lineNumbers:true,
      lineWrapping: wrapToggle.checked,
      matchBrackets:true,
      autoCloseBrackets:true,
      styleActiveLine:true,
      tabSize:2,
      indentUnit:2,
      keyMap:'sublime',
      foldGutter:true,
      gutters:['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
      viewportMargin:Infinity
    };
    const baseKeys = lang => ({
      'Ctrl-F': 'findPersistent', 'Cmd-F': 'findPersistent',
      'Ctrl-H': 'replace', 'Cmd-Alt-F': 'replace',
      'Shift-Ctrl-F': 'replaceAll', 'Shift-Cmd-Alt-F': 'replaceAll',
      'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment',
      'Ctrl-Enter': runNow, 'Cmd-Enter': runNow,
      'Shift-Alt-F': () => formatCode(lang),
      'Tab': smartTab,
      'Shift-Tab': 'indentLess'
    });
    cmHtml = CodeMirror.fromTextArea(document.getElementById('cm-html'), {...cmOptions, mode:'htmlmixed', autoCloseTags:true, matchTags:{bothTags:true},
      extraKeys:{ ...baseKeys('html'), 'Ctrl-Space': cm => CodeMirror.showHint(cm, CodeMirror.hint.html, { completeSingle:false }) }});
    cmCss  = CodeMirror.fromTextArea(document.getElementById('cm-css'),  {...cmOptions, mode:'css',
      extraKeys:{ ...baseKeys('css'), 'Ctrl-Space': cm => attachFontPick(CodeMirror.showHint(cm, cssSmartHint, { completeSingle:false })) }});
    cmJs   = CodeMirror.fromTextArea(document.getElementById('cm-js'),   {...cmOptions, mode:'javascript',
      extraKeys:{ ...baseKeys('js'), 'Ctrl-Space': cm => CodeMirror.showHint(cm, CodeMirror.hint.javascript, { completeSingle:false }) }});
    cmByLang = { html: cmHtml, css: cmCss, js: cmJs };

    paneEls = {
      html: document.querySelector('.pane-html'),
      css: document.querySelector('.pane-css'),
      js: document.querySelector('.pane-js')
    };

    [cmHtml, cmCss, cmJs].forEach(cm => {
      cm.on('change', () => {
        if(loading) return;
        markDirty();
        if(autorun){
          clearTimeout(previewTimer);
          previewTimer = setTimeout(updatePreview, 400);
        } else {
          previewStale = true;
          runBtn.classList.add('pending');
        }
      });
    });
    cmCss.on('change', scheduleSwatches);

    cmHtml.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      // only inside a tag (<di…, attributes) — in plain text Tab belongs to Emmet
      const ch = change.text[0];
      const tok = cm.getTokenAt(cm.getCursor());
      if(ch === '<' || (/[\/a-zA-Z-]/.test(ch) && tok.type && /tag|attribute/.test(tok.type))){
        CodeMirror.showHint(cm, CodeMirror.hint.html, { completeSingle:false });
      }
    });
    cmCss.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      if(/[a-zA-Z:]/.test(change.text[0])){
        attachFontPick(CodeMirror.showHint(cm, cssSmartHint, { completeSingle:false }));
      }
    });
    cmJs.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      if(/[a-zA-Z_$.]/.test(change.text[0])){
        CodeMirror.showHint(cm, CodeMirror.hint.javascript, { completeSingle:false });
      }
    });

    document.querySelectorAll('[data-download]').forEach(btn => {
      btn.addEventListener('click', () => downloadSingle(btn.dataset.download));
    });
    document.querySelectorAll('[data-format]').forEach(btn => {
      btn.addEventListener('click', () => formatCode(btn.dataset.format));
    });
  }

  function refreshAll(){ cmHtml.refresh(); cmCss.refresh(); cmJs.refresh(); }

  // ---------- Preview ----------
  function updatePreview(){
    clearTimeout(previewTimer);
    clearConsole();
    clearErrorMarks();
    const p = currentData();
    const { head, tail } = docParts(p, { bridge:true });
    jsStartLine = head.split('\n').length;

    runBtn.classList.remove('pending');
  }
  runBtn.addEventListener('click', updatePreview);
  newtabBtn.addEventListener('click', () => {
    const p = currentData();
    const url = URL.createObjectURL(new Blob([composeDoc(p, { title: p.name || 'Проєкт' })], { type:'text/html' }));

  // Device sizes: the iframe gets the real device width (so media queries
  // work) and is scaled down to fit when the pane is narrower.
  const DEVICES = { full:null, phone:375, tablet:768, laptop:1280 };
  let device = 'full';
  try{ const d = localStorage.getItem('edvault-we-device'); if(d && d in DEVICES) device = d; }catch(e){}
  function applyDevice(){
    deviceSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.device === device));
    // on narrow screens the switcher is hidden, so the preview is always full width
    const W = innerWidth > 900 ? DEVICES[device] : null;
    if(!W){
      previewStage.classList.remove('device');
      previewFrame.style.width = previewFrame.style.height = previewFrame.style.transform = previewFrame.style.marginLeft = '';
      deviceLabel.textContent = '';
      return;
    }
    previewStage.classList.add('device');
    const sw = previewStage.clientWidth - 28, sh = previewStage.clientHeight - 28;
    const s = Math.min(1, sw / W);
    previewFrame.style.width = W + 'px';
    previewFrame.style.height = Math.max(100, sh / s) + 'px';
    previewFrame.style.marginLeft = (-W / 2) + 'px';
    previewFrame.style.transform = `scale(${s})`;
    deviceLabel.textContent = W + ' px' + (s < 0.995 ? ` · ${Math.round(s * 100)}%` : '');
  }
  deviceSeg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-device]'); if(!b) return;
    device = b.dataset.device;
    try{ localStorage.setItem('edvault-we-device', device); }catch(err){}
    applyDevice();
  });
  new ResizeObserver(() => { if(DEVICES[device]) applyDevice(); }).observe(previewStage);

  // ---------- Downloads ----------
  function slugify(str){
    return (str || 'project').trim().toLowerCase()
      .replace(/[^a-z0-9а-яіїєґ]+/gi, '-')
      .replace(/^-+|-+$/g, '') || 'project';
  }
  function triggerDownload(filename, content, mime){
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function downloadSingle(lang){
    const filename = lang === 'html' ? 'index.html' : lang === 'css' ? 'style.css' : 'script.js';
    const mime = lang === 'html' ? 'text/html' : lang === 'css' ? 'text/css' : 'text/javascript';
    triggerDownload(filename, cmByLang[lang].getValue(), mime);
  }
  function downloadHtml(p){
    triggerDownload(slugify(p.name) + '.html', composeDoc(p, { title: p.name || 'project' }), 'text/html');
  }
  async function downloadZip(p){
    if(p.code){ downloadHtml(p); return; }
    const fonts = fontLinkTags(p.fonts);
    const indexHtml = '<!DOCTYPE html>\n<html lang="uk">\n<head>\n<meta charset="UTF-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + escapeHtml(p.name || 'project')
      + '</title>\n' + (fonts ? fonts + '\n' : '')
      + '<link rel="stylesheet" href="style.css">\n</head>\n<body>\n'
      + (p.html || '') + '\n<script src="script.js"><\/script>\n</body>\n</html>';
    const zip = new JSZip();
    zip.file('index.html', indexHtml);
    zip.file('style.css', p.css || '');
    zip.file('script.js', p.js || '');
    triggerDownload(slugify(p.name) + '.zip', await zip.generateAsync({ type:'blob' }));
  }
  downloadZipBtn.addEventListener('click', () => downloadZip(currentData()));
  downloadHtmlBtn.addEventListener('click', () => downloadHtml(currentData()));

    if(editorBody.dataset.layout !== 'grid' && activeTab !== lang){ activeTab = lang; renderLangTabs(); updateCodeLayout(); }
  }
  function jumpToJsLine(n){
    revealLang('js');
    requestAnimationFrame(() => {
      cmJs.focus();
      cmJs.setCursor({ line: n - 1, ch: 0 });
      cmJs.scrollIntoView({ line: n - 1, ch: 0 }, 80);
    });
  }
  function addConsoleLine(level, args, docLine){
    if(level === 'clear'){ clearConsole(); return; }
    const empty = consoleBody.querySelector('.console-empty');
    if(empty) empty.remove();
    const line = document.createElement('div');
    line.className = 'console-line console-' + level;
    const prefix = level === 'error' || level === 'warn' ? '' : level === 'result' ? '← ' : level === 'input' ? '› ' : '';
    const text = document.createElement('span');
    text.className = 'console-text';
    text.textContent = prefix + args.join(' ');
    if(level === 'error' || level === 'warn') text.insertAdjacentHTML('afterbegin', svg(level === 'error' ? ICONS.xmark : ICONS.alert, 'class="console-ic"'));
    line.appendChild(text);
    const jsLine = docLine ? docLine - jsStartLine + 1 : 0;
    if(jsLine >= 1 && cmJs && jsLine <= cmJs.lineCount()){
      const loc = document.createElement('span');
      loc.className = 'console-loc';
      loc.textContent = 'JS:' + jsLine;
      loc.title = 'Перейти до рядка ' + jsLine;
      loc.addEventListener('click', () => jumpToJsLine(jsLine));
      line.appendChild(loc);
      if(level === 'error') errorLineHandles.push(cmJs.addLineClass(jsLine - 1, 'background', 'cm-error-line'));
    }
    consoleBody.appendChild(line);
    consoleBody.scrollTop = consoleBody.scrollHeight;
    if(level === 'error'){
      errorCount++;
      consoleBadge.textContent = errorCount > 99 ? '99+' : String(errorCount);
      consoleBadge.classList.remove('hidden');
    }
  }
  window.addEventListener('message', (e) => {
    const data = e.data;
    if(!data || !data.__edvaultConsole || e.source !== previewFrame.contentWindow) return;
    addConsoleLine(data.level, data.args || [], data.line);
  });

  function setConsoleOpen(open){
    consolePanel.classList.toggle('hidden', !open);
    consoleToggleBtn.classList.toggle('active', open);
    if(open) renderEmptyConsoleIfNeeded();
    requestAnimationFrame(() => { refreshAll(); if(DEVICES[device]) applyDevice(); });
  }
  consoleToggleBtn.addEventListener('click', () => {
    const open = consolePanel.classList.contains('hidden');
    setConsoleOpen(open);
    if(open) consoleInput.focus();
  });
  consoleClearBtn.addEventListener('click', clearConsole);
  consoleInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      const code = consoleInput.value.trim();
      if(!code) return;
      consoleHistory.push(code); historyPos = consoleHistory.length;
      addConsoleLine('input', [code]);
      consoleInput.value = '';
      try{ previewFrame.contentWindow.postMessage({ __edvaultEval:true, code }, '*'); }catch(err){}
    } else if(e.key === 'ArrowUp' && consoleHistory.length){
      historyPos = Math.max(0, historyPos - 1); consoleInput.value = consoleHistory[historyPos]; e.preventDefault();
    } else if(e.key === 'ArrowDown' && consoleHistory.length){
      historyPos = Math.min(consoleHistory.length, historyPos + 1); consoleInput.value = consoleHistory[historyPos] || ''; e.preventDefault();
    }
  });
  clearConsole();

  // ---------- Fullscreen preview ----------
  const FS_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>';
  const FS_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  function setFullscreen(on){
    viewEditor.classList.toggle('preview-fullscreen', on);
    fullscreenBtn.title = on ? 'Вийти з повного екрана (Esc)' : 'На весь екран';
    fullscreenBtn.innerHTML = on ? FS_OFF : FS_ON;
    requestAnimationFrame(() => { if(DEVICES[device]) applyDevice(); });
  }
  fullscreenBtn.addEventListener('click', () => setFullscreen(!viewEditor.classList.contains('preview-fullscreen')));

  // ---------- Language visibility + pane layout ----------
  function applyVisibility(){
    ['html','css','js'].forEach(l => langPills[l].classList.toggle('active', visible[l]));
    renderLangTabs();
    updateCodeLayout();
  }

  function renderLangTabs(){
    const langs = ['html','css','js'].filter(l => visible[l]);
    if(!langs.includes(activeTab)) activeTab = langs[0] || 'html';
    langTabsEl.innerHTML = langs.map(l =>
      `<button class="lang-tab-btn ${l===activeTab?'active':''}" data-lang="${l}">${l.toUpperCase()}</button>`
    ).join('');
    langTabsEl.querySelectorAll('.lang-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.lang; renderLangTabs(); updateCodeLayout(); });
    });
  }

  // Rebuilds .code-panes so that in grid layout every visible language sits
  // side by side with a draggable divider between neighbours; in split
  // layout only the active tab's pane is shown (no divider needed).
  function updateCodeLayout(){
    const layout = editorBody.dataset.layout;
    codePanesContainer.innerHTML = '';
    const langs = ['html','css','js'].filter(l => visible[l]);

    if(layout === 'grid'){
      langs.forEach((l, idx) => {
        const pane = paneEls[l];
        const isLast = idx === langs.length - 1;
        pane.classList.remove('hidden-lang', 'tab-hidden');
        pane.style.flex = (!isLast && paneFlexBasis[l] != null) ? `0 0 ${paneFlexBasis[l]}px` : '1 1 0%';
        codePanesContainer.appendChild(pane);
        if(idx < langs.length - 1){
          const r = document.createElement('div');
          r.className = 'pane-resizer';
          r.dataset.left = l;
          r.addEventListener('mousedown', paneDragStart);
          r.addEventListener('touchstart', paneDragStart, { passive:true });
          codePanesContainer.appendChild(r);
        }
      });
    } else {
      if(!langs.includes(activeTab)) activeTab = langs[0] || 'html';
      const pane = paneEls[activeTab];
      pane.classList.remove('hidden-lang', 'tab-hidden');
      pane.style.flex = '1 1 0%';
      codePanesContainer.appendChild(pane);
    }
    requestAnimationFrame(refreshAll);
  }

  // Dragging the divider between two grid panes: the pane to its LEFT gets a
  // fixed pixel width, everything else keeps flexing to fill the rest.
  let paneDragging = null;
  function paneDragStart(e){
    const r = e.currentTarget;
    const p = pointOf(e);
    paneDragging = { leftLang: r.dataset.left, startX: p.clientX, startWidth: paneEls[r.dataset.left].getBoundingClientRect().width, r };
    r.classList.add('dragging');
    document.body.style.userSelect = 'none';
    previewFrame.style.pointerEvents = 'none';
  }
  function paneDragMove(e){
    if(!paneDragging) return;
    const p = pointOf(e);
    const delta = p.clientX - paneDragging.startX;
    const containerWidth = codePanesContainer.getBoundingClientRect().width;
    const newWidth = Math.max(80, Math.min(containerWidth - 160, paneDragging.startWidth + delta));
    paneFlexBasis[paneDragging.leftLang] = newWidth;
    paneEls[paneDragging.leftLang].style.flex = `0 0 ${newWidth}px`;
  }
  function paneDragEnd(){
    if(!paneDragging) return;
    paneDragging.r.classList.remove('dragging');
    paneDragging = null;
    document.body.style.userSelect = '';
    previewFrame.style.pointerEvents = '';
    refreshAll();
  }
  window.addEventListener('mousemove', paneDragMove);
  window.addEventListener('mouseup', paneDragEnd);
  window.addEventListener('touchmove', paneDragMove, { passive:true });
  window.addEventListener('touchend', paneDragEnd);

  Object.keys(langPills).forEach(l => {
    langPills[l].addEventListener('click', () => {
      const visibleCount = Object.values(visible).filter(Boolean).length;
      if(visible[l] && visibleCount === 1) return; // keep at least one visible
      visible[l] = !visible[l];
      applyVisibility();
      markDirty();
    });
  });

  // ---------- Layout switching ----------
  function setLayout(mode){
    editorBody.dataset.layout = mode;
    codeZone.style.flexBasis = '';
    optGrid.classList.toggle('active', mode === 'grid');
    optRight.classList.toggle('active', mode === 'split');
    optLeft.classList.toggle('active', mode === 'split-rev');
    updateCodeLayout();
    requestAnimationFrame(() => { if(DEVICES[device]) applyDevice(); });
  }
  optGrid.addEventListener('click', () => { setLayout('grid'); markDirty(); });
  optRight.addEventListener('click', () => { setLayout('split'); markDirty(); });
  optLeft.addEventListener('click', () => { setLayout('split-rev'); markDirty(); });

  // ---------- Settings dropdown ----------
  function closeSettings(){ settingsPanel.classList.add('hidden'); settingsBtn.classList.remove('active'); }
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle('hidden');
    settingsBtn.classList.toggle('active', !settingsPanel.classList.contains('hidden'));
  });
  document.addEventListener('click', (e) => {
    if(!settingsPanel.classList.contains('hidden') && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) closeSettings();
  });

  // ---------- Theme (light/dark) ----------
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function applyTheme(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try{ localStorage.setItem('edvault-theme', dark ? 'dark' : 'light'); }catch(e){}
    themeToggle.checked = dark;
    catalogThemeBtn.innerHTML = svg(dark ? ICONS.sun : ICONS.moon);
    if(cmByLang){
      const cmTheme = dark ? 'dracula' : 'idea';
      [cmHtml, cmCss, cmJs].forEach(cm => cm.setOption('theme', cmTheme));
      requestAnimationFrame(refreshAll);
    }
  }
  themeToggle.addEventListener('change', () => applyTheme(themeToggle.checked));
  catalogThemeBtn.addEventListener('click', () => applyTheme(!isDark()));
  applyTheme(isDark());

  // ---------- Line wrap toggle ----------
  try{ wrapToggle.checked = localStorage.getItem('edvault-we-wrap') !== '0'; }catch(e){}
  wrapToggle.addEventListener('change', () => {
    const wrap = wrapToggle.checked;
    try{ localStorage.setItem('edvault-we-wrap', wrap ? '1' : '0'); }catch(e){}
    [cmHtml, cmCss, cmJs].forEach(cm => cm && cm.setOption('lineWrapping', wrap));
    if(cmHtml) requestAnimationFrame(refreshAll);
  });

  // ---------- Auto-run toggle ----------
  try{ autorun = localStorage.getItem('edvault-we-autorun') !== '0'; }catch(e){}
  autorunToggle.checked = autorun;
  autorunToggle.addEventListener('change', () => {
    autorun = autorunToggle.checked;
    try{ localStorage.setItem('edvault-we-autorun', autorun ? '1' : '0'); }catch(e){}
    if(autorun && previewStale) updatePreview();
    runBtn.title = autorun ? 'Оновити перегляд (Ctrl+Enter)' : 'Запустити код (Ctrl+Enter)';
  });

  // ---------- Font size ----------
  function applyFontSize(){
    document.documentElement.style.setProperty('--cm-font-size', fontSize + 'px');
    fontSizeValue.textContent = fontSize + 'px';
    try{ localStorage.setItem('edvault-font-size', String(fontSize)); }catch(e){}
    if(cmHtml) requestAnimationFrame(refreshAll);
  }
  fontDecBtn.addEventListener('click', () => { fontSize = Math.max(11, fontSize - 1); applyFontSize(); });
  fontIncBtn.addEventListener('click', () => { fontSize = Math.min(22, fontSize + 1); applyFontSize(); });
  (function initFontSize(){
    try{
      const saved = parseInt(localStorage.getItem('edvault-font-size'), 10);
      if(saved && saved >= 11 && saved <= 22) fontSize = saved;
    }catch(e){}
    applyFontSize();
  })();

  // ---------- Resizer drag ----------
  let dragging = false, startPos = 0, startSize = 0;
  function pointOf(e){ return e.touches ? e.touches[0] : e; }

  function dragStart(e){
    dragging = true;
    const layout = editorBody.dataset.layout;
    const p = pointOf(e);
    const vertical = layout === 'grid' || innerWidth <= 900;
    startPos = vertical ? p.clientY : p.clientX;
    startSize = vertical ? codeZone.getBoundingClientRect().height : codeZone.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    previewFrame.style.pointerEvents = 'none';
  }
  function dragMove(e){
    if(!dragging) return;
    const layout = editorBody.dataset.layout;
    const rect = editorBody.getBoundingClientRect();
    const p = pointOf(e);
    let newSize;
    if(layout === 'grid' || innerWidth <= 900){
      const delta = p.clientY - startPos;
      newSize = Math.max(120, Math.min(rect.height - 100, startSize + delta));
    } else {
      const delta = layout === 'split-rev' ? (startPos - p.clientX) : (p.clientX - startPos);
      newSize = Math.max(220, Math.min(rect.width - 220, startSize + delta));
    }
    codeZone.style.flexBasis = newSize + 'px';
    if(DEVICES[device]) applyDevice();
  }
  function dragEnd(){
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    previewFrame.style.pointerEvents = '';
    refreshAll();
  }
  resizer.addEventListener('mousedown', dragStart);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  resizer.addEventListener('touchstart', dragStart, { passive:true });
  window.addEventListener('touchmove', dragMove, { passive:true });
  window.addEventListener('touchend', dragEnd);

  // ---------- Saving (automatic + Ctrl+S) ----------
  function setSaveStatus(state){
    saveStatus.classList.toggle('pending', state === 'pending');
    saveStatus.classList.toggle('error', state === 'error');
    if(state === 'pending') saveStatus.textContent = 'Не збережено';
    else if(state === 'saved') saveStatus.innerHTML = svg(ICONS.check) + 'Збережено';
    else if(state === 'error') saveStatus.innerHTML = svg(ICONS.alert) + 'Не збережено';
    else saveStatus.textContent = '';
  }
  function markDirty(){
    if(loading) return;
    isDirty = true;
    setSaveStatus('pending');
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => saveProject({ silent:true }), 900);
  }
  function updateDirtyIndicator(){ setSaveStatus(isDirty ? 'pending' : ''); }

  function injectGoogleFont(font){
    if(usedFonts.has(font)) return;
    usedFonts.add(font);
    markDirty();
    updatePreview();
  }

  function saveProject(opts = {}){
    clearTimeout(autosaveTimer);
    const projects = loadProjects();
    let name = nameInput.value.trim();
    if(!name){
      // while the field is being cleared to type a new name, keep the stored one
      const existing = currentEditId && projects.find(p => p.id === currentEditId);
      name = existing ? existing.name : uniqueName('Новий проєкт');
      if(!opts.silent || !existing) nameInput.value = name;
    }

    const data = { ...currentData(), name, ui:{ layout: editorBody.dataset.layout, visible:{ ...visible } }, updated: Date.now() };

    if(currentEditId && projects.some(p => p.id === currentEditId)){
      const idx = projects.findIndex(p => p.id === currentEditId);
      projects[idx] = { ...projects[idx], ...data };
      delete projects[idx].code;
    } else {
      currentEditId = currentEditId || newId();
      projects.push({ id: currentEditId, created: Date.now(), ...data });
    }
    try{ saveProjects(projects); }
    catch(e){
      setSaveStatus('error');
      toast('Не вдалося зберегти: у браузері закінчилося місце. Видали старі проєкти або завантаж цей як .zip', 5000);
      return false;
    }
    isDirty = false;
    setSaveStatus('saved');
    if(!opts.silent) flashSaved();
    return true;
  }

  function flashSaved(){
    const label = saveBtn.querySelector('.save-label');
    label.textContent = 'Збережено';
    saveBtn.classList.add('saved-flash');
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(() => {
      label.textContent = 'Зберегти';
      saveBtn.classList.remove('saved-flash');
    }, 1300);
  }

  saveBtn.addEventListener('click', () => saveProject());
  nameInput.addEventListener('input', markDirty);
  nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); nameInput.blur(); } });

  // ---------- Editor open/close ----------
  function openEditor(project, opts = {}){
    if(!cmHtml) initEditors();
    closeMenu();

    loading = true;
    currentEditId = project && project.id ? project.id : null;
    nameInput.value = project ? (project.name || '') : '';

    if(project && project.code){
      cmHtml.setValue(project.code);
      cmCss.setValue('');
      cmJs.setValue('');
    } else {
      cmHtml.setValue(project ? (project.html || '') : '');
      cmCss.setValue(project ? (project.css || '') : '');
      cmJs.setValue(project ? (project.js || '') : '');
    }
    [cmHtml, cmCss, cmJs].forEach(cm => { cm.clearHistory(); cm.setCursor({ line:0, ch:0 }); });

    const ui = (project && project.ui) || {};
    visible = { html:true, css:true, js:true, ...(ui.visible || {}) };
    if(!visible.html && !visible.css && !visible.js) visible = { html:true, css:true, js:true };
    activeTab = 'html';
    paneFlexBasis = { html:null, css:null, js:null };
    usedFonts = new Set(project && Array.isArray(project.fonts) ? project.fonts : []);
    closeSettings();
    setConsoleOpen(false);
    clearConsole();
    setFullscreen(false);
    applyVisibility();
    setLayout(['grid','split','split-rev'].includes(ui.layout) ? ui.layout : 'grid');

    viewCatalog.classList.add('hidden');
    viewEditor.classList.remove('hidden');
    loading = false;

    isDirty = false;
    setSaveStatus(currentEditId ? 'saved' : '');
    if(opts.isNew) saveProject({ silent:true });

    requestAnimationFrame(() => {
      refreshAll();
      updatePreview();
      refreshSwatches();
      applyDevice();
      if(opts.isNew || !currentEditId){ cmHtml.focus(); } else { cmHtml.focus(); }
    });
  }

  function closeEditor(){
    if(isDirty) saveProject({ silent:true });
    setFullscreen(false);
    previewFrame.srcdoc = '';
    viewEditor.classList.add('hidden');
    viewCatalog.classList.remove('hidden');
    renderCatalog();
  }
  backBtn.addEventListener('click', closeEditor);

  // Data lives in localStorage, so a synchronous save on leave is safe.
  window.addEventListener('pagehide', () => { if(!viewEditor.classList.contains('hidden') && isDirty) saveProject({ silent:true }); });
  document.addEventListener('visibilitychange', () => { if(document.hidden && !viewEditor.classList.contains('hidden') && isDirty) saveProject({ silent:true }); });

  // ---------- Share button ----------
  document.getElementById('share-btn').addEventListener('click', () => {
    const p = currentData();
    p.name = p.name || 'Проєкт';
    openShare(p);
  });

  // ---------- Shortcuts help ----------
  const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
  document.getElementById('shortcuts-btn').addEventListener('click', () => {
    closeSettings();
    const row = (label, keys) => `<span>${label}</span><span>${keys.split(' ').map(k => `<kbd>${k.replace('Mod', MOD)}</kbd>`).join(' ')}</span>`;
    const box = openModal(`<h3 class="modal-title">Гарячі клавіші та підказки</h3>
      <div class="kbd-list">
        <div class="kbd-sec">Основне</div>
        ${row('Зберегти (і так зберігається само)', 'Mod+S')}
        ${row('Оновити / запустити перегляд', 'Mod+Enter')}
        ${row('Упорядкувати код', 'Shift+Alt+F')}
        ${row('Підказки коду', 'Ctrl+Space')}
        <div class="kbd-sec">Редагування</div>
        ${row('Закоментувати рядок', 'Mod+/')}
        ${row('Виділити наступне таке ж слово', 'Mod+D')}
        ${row('Перемістити рядок вгору / вниз', 'Alt+↑ Alt+↓')}
        ${row('Дублювати рядок', 'Mod+Shift+D')}
        ${row('Видалити рядок', 'Mod+Shift+K')}
        ${row('Пошук / заміна', 'Mod+F Mod+H')}
        <div class="kbd-sec">Швидкий HTML (Emmet)</div>
        ${row('Список із 3 пунктів', 'ul>li*3 Tab')}
        ${row('Блок з класом і заголовком', 'div.card>h2 Tab')}
        ${row('Текст усередині', 'p{Привіт} Tab')}
        ${row('Сусідні елементи', 'h1+p Tab')}
        ${row('Нумерація', 'li.item$*3 Tab')}
        <div class="kbd-sec">CSS</div>
        <span>Клацни на кольоровий квадратик біля кольору, щоб вибрати інший</span><span></span>
      </div>
      <div class="modal-actions" style="margin-top:18px"><button class="retry-btn" data-x>Зрозуміло</button></div>`, 'modal-md');
    box.querySelector('[data-x]').onclick = closeModal;
  });

  // ---------- Global keys ----------
  document.addEventListener('keydown', (e) => {
    const inEditor = !viewEditor.classList.contains('hidden');
    if((e.ctrlKey || e.metaKey) && e.code === 'KeyS' && inEditor){
      e.preventDefault();
      saveProject();
    } else if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && inEditor){
      e.preventDefault();
      updatePreview();
    }
  });

  // ---------- Import files into the open project ----------
  const importBtn = document.getElementById('import-btn');
  const importInput = document.getElementById('import-input');
  importBtn.addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', async () => {
    const files = Array.from(importInput.files || []);
    if(!files.length) return;
    const imported = [];
    for(const file of files){
      const ext = file.name.split('.').pop().toLowerCase();
      const text = await file.text();
      if(ext === 'html' || ext === 'htm'){
        const parts = await parseProjectHtml(text, null);
        cmHtml.setValue(parts.html);
        if(parts.css) cmCss.setValue(parts.css);
        if(parts.js) cmJs.setValue(parts.js);
        parts.fonts.forEach(f => usedFonts.add(f));
        imported.push('HTML');
      }
      else if(ext === 'css'){ cmCss.setValue(text); imported.push('CSS'); }
      else if(ext === 'js'){ cmJs.setValue(text); imported.push('JS'); }
    }
    importInput.value = '';
    closeSettings();
    updatePreview();
    if(!imported.length) toast('Підтримуються тільки файли .html, .css, .js');
    else toast('Імпортовано: ' + imported.join(', '));
  });

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(menuEl){ closeMenu(); return; }
    if(isModalOpen()){ closeModal(); return; }
    if(viewEditor.classList.contains('hidden')) return;
    if(!settingsPanel.classList.contains('hidden')) closeSettings();
    else if(viewEditor.classList.contains('preview-fullscreen')) setFullscreen(false);
  });

  // ---------- Start ----------
  renderCatalog();
  window.addEventListener('hashchange', openSharedFromHash);
  openSharedFromHash();
  async function openSharedFromHash(){
    const m = location.hash.match(/^#p=([\w-]+)/);
    if(!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    try{
      const p = await decodeShare(m[1]);
      p.name = uniqueName(p.name);
      openEditor(p, { isNew:true });
      toast('Відкрито проєкт за посиланням — копію збережено у твої проєкти', 4000);
    }catch(e){
      toast('Посилання пошкоджене або неповне', 4000);
    }
  }
</script>

</body>
