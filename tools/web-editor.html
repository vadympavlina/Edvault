<!DOCTYPE html>
<html lang="uk">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6BF4'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Редактор коду · Edvault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/idea.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<script>
  // Apply saved theme before first paint to avoid a light-mode flash
  try{
    var t = localStorage.getItem('edvault-theme');
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e2e5ea;
    --border2: #d0d5dd;
    --accent: #4F6BF4;
    --accent-light: #eef0fe;
    --accent-hover: #3d57e0;
    --danger: #ef4444;
    --success: #10b981;
    --warn: #f59e0b;
    --text: #1a1d23;
    --text2: #4b5563;
    --muted: #9ca3af;
    --lang-html: #e34c26;
    --lang-css: #2965f1;
    --lang-js: #d4a017;
    --cm-font-size: 13px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.14), 0 4px 16px rgba(0,0,0,.08);
  }

  .CodeMirror-hints{
    font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    background: var(--surface) !important; border: 1.5px solid var(--border) !important;
    border-radius: 10px !important; box-shadow: var(--shadow-lg) !important; padding: 4px !important;
  }
  .CodeMirror-hint{ padding: 5px 10px !important; border-radius: 6px !important; color: var(--text) !important; }
  li.CodeMirror-hint-active{ background: var(--accent) !important; color: #fff !important; }

  .CodeMirror-matchingtag{
    background: var(--accent-light) !important;
    border-bottom: 1.5px solid var(--accent) !important;
  }

  .CodeMirror-dialog{
    background: var(--surface2) !important; border-bottom: 1.5px solid var(--border) !important;
    color: var(--text) !important; font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    padding: 8px 12px !important;
  }
  .CodeMirror-dialog input{
    background: var(--surface) !important; border: 1.5px solid var(--border2) !important;
    border-radius: 6px !important; color: var(--text) !important; padding: 4px 8px !important;
    font-family: inherit !important;
  }
  .CodeMirror-search-hint{ display: none; }

  .CodeMirror-dialog{
    background: var(--surface2) !important; color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
    font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    padding: 8px 10px !important;
  }
  .CodeMirror-dialog input{
    background: var(--surface) !important; color: var(--text) !important;
    border: 1.5px solid var(--border2) !important; border-radius: 6px !important;
    padding: 3px 8px !important; font-family: inherit !important;
  }

  html[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1c212a;
    --surface2: #232933;
    --border: #2a313d;
    --border2: #384152;
    --accent: #6c85ff;
    --accent-light: rgba(108,133,255,.16);
    --accent-hover: #8298ff;
    --danger: #ff6b6b;
    --success: #34d399;
    --warn: #fbbf24;
    --text: #e8ecf1;
    --text2: #a8b0bd;
    --muted: #6b7280;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --shadow-md: 0 4px 16px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.55), 0 4px 16px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] body{ background: var(--bg); }
  html[data-theme="dark"] #preview-frame{ background: #fff; } /* preview stays a real page, not app chrome */

  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }

  .hidden { display: none !important; }

  /* =========== TOPBAR (shared) =========== */
  .topbar {
    min-height: 64px; flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 10px clamp(16px, 4vw, 28px);
    padding-top: env(safe-area-inset-top, 0);
    position: sticky; top: 0; z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: clamp(9px, 2vw, 12px); min-width: 0; }
  .topbar-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(79,107,244,.3); flex-shrink: 0;
  }
  .topbar-logo svg { width: 18px; height: 18px; }
  .topbar-text { min-width: 0; }
  .topbar-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-text p { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    background: var(--accent-light); color: var(--accent); letter-spacing: .03em;
    flex-shrink: 0;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--surface); color:var(--text2); font-family:inherit;
    font-size:13px;font-weight:600;cursor:pointer; transition:all .13s ease; flex-shrink:0;
  }
  .back-btn:hover{ border-color:var(--border2); background:var(--surface2); color:var(--text); }
  .back-btn svg{ width:14px; height:14px; }

  .name-input{
    padding:8px 12px; border:1.5px solid var(--border2); border-radius:9px;
    background:var(--surface); font-family:inherit; font-size:14px; font-weight:700; color:var(--text);
    outline:none; transition:all .15s ease; min-width:140px; max-width:260px;
  }
  .name-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,107,244,.1); }

  .unsaved-dot{
    width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0;
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .retry-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: background .13s;
    flex-shrink: 0;
  }
  .retry-btn:hover { background: var(--accent-hover); }
  .retry-btn svg{ width:14px; height:14px; }
  .retry-btn.saved-flash{ background: var(--success) !important; }

  .view-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .13s ease; flex-shrink: 0;
  }
  .view-btn:hover, .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view-btn svg { width: 15px; height: 15px; }

  .settings-wrap{ position: relative; flex-shrink: 0; }
  .settings-panel{
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 250px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg); padding: 14px; z-index: 40;
    max-height: calc(100vh - 90px); overflow-y: auto;
  }
  .settings-section{ margin-bottom: 14px; }
  .settings-section:last-child{ margin-bottom: 0; }
  .settings-label{ font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .settings-opt-row{ display: flex; gap: 5px; }
  .settings-opt-btn{
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 4px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text2); font-family: inherit;
    font-size: 10.5px; font-weight: 700; cursor: pointer; transition: all .13s ease;
  }
  .settings-opt-btn .dot{ width: 8px; height: 8px; border-radius: 50%; }
  .settings-opt-btn.active .dot{ background: #fff !important; }
  .settings-opt-btn.settings-opt-full{ flex-direction: row; width: 100%; gap: 8px; }
  .settings-opt-btn:hover{ border-color: var(--border2); background: var(--surface2); }
  .settings-opt-btn.active{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .settings-opt-btn svg{ width: 15px; height: 15px; }

  .settings-toggle{ display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text2); font-weight: 600; cursor: pointer; }

  .font-size-control{
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px; padding: 4px;
  }
  .font-btn{
    width: 28px; height: 28px; border: none; border-radius: 7px; background: var(--surface);
    color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: all .13s ease;
  }
  .font-btn:hover{ background: var(--accent); color: #fff; }
  #font-size-value{ font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text2); }
  .switch{ position: relative; width: 38px; height: 22px; flex-shrink: 0; display: inline-block; }
  .switch input{ opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider{ position: absolute; inset: 0; background: var(--border2); border-radius: 20px; cursor: pointer; transition: background .15s ease; }
  .switch .slider::before{ content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s ease; box-shadow: var(--shadow-sm); }
  .switch input:checked + .slider{ background: var(--accent); }
  .switch input:checked + .slider::before{ transform: translateX(16px); }

  /* =========== MAIN / CATALOG =========== */
  .main {
    max-width: 1200px; width: 100%;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 48px) clamp(16px, 4vw, 28px) clamp(56px, 10vw, 100px);
  }

  .stats-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; margin-bottom: 22px;
  }
  .stats-bar-left { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stats-bar-left b { color: var(--text); font-weight: 700; }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px;
  }

  .tool-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    cursor: pointer;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 16px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .15s ease;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .tool-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--card-accent-light, rgba(79,107,244,.06)), transparent 65%);
    opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  .tool-card:hover { transform: translateY(-4px) scale(1.012); box-shadow: var(--shadow-md); border-color: var(--card-accent, var(--accent)); }
  .tool-card:hover::before { opacity: 1; }
  .tool-card:active { transform: translateY(-1px) scale(1.005); }

  .tool-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .tool-icon {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card-accent-light, var(--accent-light));
    border: 1.5px solid var(--card-accent-border, #d6dcfd);
  }
  .tool-icon svg { width: 22px; height: 22px; color: var(--card-accent, var(--accent)); }

  .tool-tag {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
    background: var(--card-accent-light, var(--accent-light));
    color: var(--card-accent, var(--accent)); letter-spacing: .04em; text-transform: uppercase;
    white-space: nowrap; font-family:'JetBrains Mono', monospace;
  }

  .tool-card-body { flex: 1; }
  .tool-name { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; word-break:break-word; }
  .tool-desc { font-size: 13px; color: var(--text2); line-height: 1.6; }

  .tool-card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .tool-open-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--card-accent, var(--accent));
    background: var(--card-accent-light, var(--accent-light));
    border: 1.5px solid var(--card-accent-border, #d6dcfd);
    padding: 7px 14px; border-radius: 9px;
    transition: all .13s ease;
  }
  .tool-card:hover .tool-open-btn {
    background: var(--card-accent, var(--accent)); color: #fff; border-color: var(--card-accent, var(--accent));
  }
  .tool-open-btn svg { width: 12px; height: 12px; }

  .tool-del{
    position:absolute; top:14px; right:14px;
    width:26px;height:26px;border-radius:8px;border:none;
    background:var(--surface2); color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; opacity:0; transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .tool-card:hover .tool-del{ opacity:1; }
  .tool-del:hover{ background:var(--danger); color:#fff; }
  .tool-del svg{ width:13px; height:13px; }

  .empty-state { text-align: center; padding: 80px 20px; display: none; }
  .empty-state.visible { display: block; }
  .empty-icon { display: flex; justify-content: center; color: var(--muted, var(--text2)); margin-bottom: 16px; }
  .empty-icon svg { width: 44px; height: 44px; }
  .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text2); margin-bottom: 18px; }

  @keyframes card-appear { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .tool-card { animation: card-appear .35s cubic-bezier(.16,1,.3,1) both; }

  @media (max-width: 640px) {
    .tools-grid { grid-template-columns: 1fr; gap: 14px; }
    .tool-card { padding: 18px; border-radius: 16px; gap: 13px; }
  }

  /* =========== EDITOR VIEW =========== */
  #view-editor{ height: 100vh; display: flex; flex-direction: column; }

  #editor-body{ flex: 1; display: flex; min-height: 0; background: var(--bg); }
  #editor-body[data-layout="grid"]{ flex-direction: column; }
  #editor-body[data-layout="split"]{ flex-direction: row; }
  #editor-body[data-layout="split-rev"]{ flex-direction: row-reverse; }

  .code-zone{ display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
  #editor-body[data-layout="grid"] .code-zone{ flex: 0 0 55%; }
  #editor-body[data-layout="split"] .code-zone,
  #editor-body[data-layout="split-rev"] .code-zone{ flex: 0 0 46%; }

  .preview-zone{ flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }

  .resizer{ flex-shrink: 0; background: var(--border); position: relative; transition: background .12s ease; }
  .resizer:hover, .resizer.dragging{ background: var(--accent); }
  #editor-body[data-layout="grid"] .resizer{ height: 6px; cursor: row-resize; }
  #editor-body[data-layout="split"] .resizer,
  #editor-body[data-layout="split-rev"] .resizer{ width: 6px; cursor: col-resize; }

  .lang-tabs{ display: none; gap: 2px; padding: 8px 8px 0; background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink:0; }
  #editor-body[data-layout="split"] .lang-tabs,
  #editor-body[data-layout="split-rev"] .lang-tabs{ display: flex; }
  .lang-tab-btn{
    padding: 8px 16px; border: none; border-radius: 8px 8px 0 0;
    background: transparent; color: var(--text2); font-family:'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .lang-tab-btn.active{ background: var(--surface); color: var(--text); box-shadow: 0 -1px 0 var(--border) inset; }
  .lang-tab-btn:hover:not(.active){ color: var(--text); }

  .code-panes{ flex: 1; display: flex; min-height: 0; }
  #editor-body[data-layout="grid"] .code-panes{ flex-direction: row; }
  #editor-body[data-layout="split"] .code-panes,
  #editor-body[data-layout="split-rev"] .code-panes{ flex-direction: column; }

  .code-pane{ flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); }
  #editor-body[data-layout="grid"] .code-pane:last-child{ border-right: none; }
  #editor-body[data-layout="split"] .code-pane,
  #editor-body[data-layout="split-rev"] .code-pane{ border-right: none; }
  .code-pane.hidden-lang, .code-pane.tab-hidden{ display: none; }

  .pane-resizer{
    flex-shrink: 0; width: 6px; background: var(--border); cursor: col-resize;
    transition: background .12s ease;
  }
  .pane-resizer:hover, .pane-resizer.dragging{ background: var(--accent); }

  .pane-head{
    flex-shrink: 0; display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--text2);
  }
  .pane-head .dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .pane-html .pane-head .dot{ background: var(--lang-html); }
  .pane-css  .pane-head .dot{ background: var(--lang-css); }
  .pane-js   .pane-head .dot{ background: var(--lang-js); }
  .pane-preview .pane-head .dot{ background: var(--success); }
  .pane-head .spacer{ flex: 1; }
  .pane-head .icon-btn{
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 3px; border-radius: 5px;
  }
  .pane-head .icon-btn:hover{ color: var(--text); background: var(--border); }
  .pane-head .icon-btn svg{ width: 14px; height: 14px; }

  /* fullscreen preview */
  #view-editor.preview-fullscreen .topbar,
  #view-editor.preview-fullscreen .code-zone,
  #view-editor.preview-fullscreen .resizer{ display: none; }

  .cm-wrap{ flex: 1; min-height: 0; }
  .CodeMirror{ height: 100%; font-size: var(--cm-font-size, 13px); font-family: 'JetBrains Mono', monospace; background: var(--surface); color: var(--text); }
  .CodeMirror-gutters{ background: var(--surface2); border-right: 1px solid var(--border); }
  .CodeMirror-cursor{ border-left: 2px solid var(--accent); }
  .CodeMirror-selected{ background: var(--accent-light) !important; }
  .CodeMirror-activeline-background{ background: var(--surface2) !important; }

  #preview-frame{ flex: 1; width: 100%; border: none; background: #fff; }

  .icon-btn{ position: relative; }
  .console-badge{
    position: absolute; top: 1px; right: 1px; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1; font-family: 'JetBrains Mono', monospace;
  }
  #console-toggle-btn.active{ color: var(--accent); background: var(--accent-light); }

  .console-panel{
    flex-shrink: 0; height: 160px; display: flex; flex-direction: column;
    border-top: 1.5px solid var(--border); background: var(--surface2);
  }
  .console-toolbar{
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 5px 12px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .console-clear-btn{ background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .console-clear-btn:hover{ color: var(--text); }
  .console-body{ flex: 1; overflow-y: auto; padding: 4px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .console-line{
    padding: 4px 12px; border-bottom: 1px solid var(--border); white-space: pre-wrap; word-break: break-word;
    color: var(--text2); line-height: 1.5;
  }
  .console-line.console-error{ color: var(--danger); background: rgba(239,68,68,.06); }
  .console-line.console-warn{ color: var(--warn); background: rgba(245,158,11,.06); }
  .console-line.console-info{ color: var(--accent); }
  .console-empty{ padding: 14px 12px; color: var(--muted); font-size: 12px; text-align: center; }

  @media (max-width: 900px){
    #editor-body[data-layout="split"],
    #editor-body[data-layout="split-rev"]{ flex-direction: column; }
    #editor-body[data-layout="split"] .code-zone,
    #editor-body[data-layout="split-rev"] .code-zone{ flex: 0 0 48%; }
    #editor-body[data-layout="split"] .resizer,
    #editor-body[data-layout="split-rev"] .resizer{ width: auto; height: 6px; cursor: row-resize; }
    .topbar-text p{ display:none; }
    .name-input{ min-width: 100px; max-width: 140px; }
  }

  /* =========== CATALOG EXTRAS =========== */
  .topbar-sep{ width:1px; height:26px; background:var(--border); flex-shrink:0; }

  .catalog-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .search-box{ position:relative; }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none; }
  .search-input{
    width:220px; padding:9px 12px 9px 32px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color .13s ease;
  }
  .search-input:focus{ border-color:var(--accent); }
  .ghost-btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text2);
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all .13s ease; flex-shrink:0;
  }
  .ghost-btn:hover{ border-color:var(--border2); background:var(--surface2); color:var(--text); }
  .ghost-btn svg{ width:14px; height:14px; }

  .tool-card.has-thumb{ padding:12px 12px 16px; gap:12px; }
  .tool-thumb{
    position:relative; aspect-ratio:16/10; border-radius:11px; overflow:hidden;
    border:1px solid var(--border); background:#fff;
  }
  .tool-thumb iframe{ position:absolute; top:0; left:0; width:1200px; height:750px; border:0; transform-origin:0 0; pointer-events:none; background:#fff; }
  .tool-thumb .thumb-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--card-accent, var(--accent)); background:var(--card-accent-light, var(--accent-light));
  }
  .tool-thumb .thumb-empty svg{ width:34px; height:34px; opacity:.7; }
  .tool-card.has-thumb .tool-card-body{ padding:0 6px; }
  .tool-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tool-meta .tool-desc{ font-size:12px; color:var(--muted); }
  .tool-more{
    position:absolute; top:20px; right:20px; width:30px; height:30px; border-radius:9px; border:none;
    background:rgba(255,255,255,.92); color:#4b5563; box-shadow:0 1px 4px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .12s ease, background .12s ease; z-index:2;
  }
  .tool-card:hover .tool-more, .tool-more.open{ opacity:1; }
  .tool-more:hover{ background:#fff; color:#111; }
  .tool-more svg{ width:16px; height:16px; }
  @media (hover:none){ .tool-more{ opacity:1; } }
  .no-results{ text-align:center; color:var(--muted); font-size:13.5px; padding:50px 10px; }

  /* popover menu */
  .pop-menu{
    position:fixed; z-index:200; min-width:200px; padding:5px; border-radius:12px;
    background:var(--surface); border:1.5px solid var(--border); box-shadow:var(--shadow-lg);
    animation:pop-in .12s ease;
  }
  @keyframes pop-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .pop-item{
    display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; border-radius:8px;
    background:none; color:var(--text); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; text-align:left;
  }
  .pop-item:hover{ background:var(--surface2); }
  .pop-item svg{ width:15px; height:15px; color:var(--text2); flex-shrink:0; }
  .pop-item.danger{ color:var(--danger); }
  .pop-item.danger svg{ color:var(--danger); }
  .pop-sep{ height:1px; background:var(--border); margin:4px 6px; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; z-index:150; background:rgba(15,18,25,.5);
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation:fade-in .15s ease;
  }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
  .modal{
    width:100%; max-width:820px; max-height:88vh; overflow:auto; background:var(--surface);
    border:1.5px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); padding:22px;
  }
  .modal.modal-sm{ max-width:420px; }
  .modal.modal-md{ max-width:560px; }
  .modal-title{ font-size:18px; font-weight:800; letter-spacing:-.3px; color:var(--text); margin-bottom:4px; }
  .modal-sub{ font-size:13px; color:var(--text2); margin-bottom:16px; line-height:1.55; }
  .modal-input{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border2);
    background:var(--surface); color:var(--text); font-family:inherit; font-size:14px; outline:none; margin:12px 0 16px;
  }
  .modal-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,107,244,.12); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .retry-btn.danger{ background:var(--danger); }

  .tpl-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-top:16px; }
  .tpl-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left;
    padding:16px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); font-family:inherit; cursor:pointer; transition:all .14s ease;
  }
  .tpl-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .tpl-emoji{ display:flex; color:var(--accent); margin-bottom:4px; }
  .tpl-emoji svg{ width:26px; height:26px; }
  .tpl-name{ font-size:14.5px; font-weight:800; }
  .tpl-desc{ font-size:12.5px; color:var(--text2); line-height:1.5; }
  .tpl-level{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--accent-light); color:var(--accent); margin-top:4px; }

  .share-row{ display:flex; gap:8px; margin:6px 0 10px; }
  .share-row .modal-input{ margin:0; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .share-note{ font-size:12px; color:var(--muted); line-height:1.5; }
  .share-note .share-warn{ width:13px; height:13px; color:var(--warn); vertical-align:-2px; margin-right:5px; }

  .kbd-list{ display:grid; grid-template-columns:1fr auto; gap:8px 18px; margin-top:12px; font-size:13px; color:var(--text2); }
  .kbd-list .kbd-sec{ grid-column:1/-1; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:10px; }
  kbd{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;
    background:var(--surface2); border:1px solid var(--border2); color:var(--text); white-space:nowrap;
  }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); z-index:300;
    background:#1a1d23; color:#fff; padding:10px 16px; border-radius:11px; font-size:13px; font-weight:500;
    box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:all .2s ease; max-width:calc(100vw - 32px);
  }
  html[data-theme="dark"] .toast{ background:#e8ecf1; color:#14171c; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* =========== EDITOR EXTRAS =========== */
  .save-status{ font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .save-status svg{ width:13px; height:13px; color:var(--success); }
  .save-status.error svg{ color:var(--danger); }
  .save-status.pending::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--warn); animation:pulse-dot 1.4s ease-in-out infinite; }

  .pane-head .icon-btn.pending{ color:#fff; background:var(--accent); animation:pulse-dot 1.4s ease-in-out infinite; }
  .device-seg{ display:flex; gap:1px; padding:2px; border-radius:8px; background:var(--border); margin-right:4px; }
  .device-seg button{
    border:none; background:var(--surface2); color:var(--muted); padding:3px 7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .device-seg button:first-child{ border-radius:6px 0 0 6px; }
  .device-seg button:last-child{ border-radius:0 6px 6px 0; }
  .device-seg button svg{ width:14px; height:14px; }
  .device-seg button:hover{ color:var(--text); }
  .device-seg button.active{ background:var(--accent); color:#fff; }
  .device-label{ font-size:10.5px; color:var(--muted); letter-spacing:0; text-transform:none; margin-right:4px; }

  .preview-stage{ flex:1; position:relative; min-height:0; overflow:hidden; display:flex; }
  .preview-stage.device{ background:var(--surface2); background-image:radial-gradient(var(--border2) 1px, transparent 1px); background-size:16px 16px; }
  .preview-stage.device #preview-frame{
    position:absolute; top:14px; left:50%; flex:none; transform-origin:top center;
    border-radius:12px; box-shadow:0 0 0 1px var(--border2), var(--shadow-md);
  }

  .CodeMirror-foldgutter{ width:14px; }
  .CodeMirror-foldgutter-open, .CodeMirror-foldgutter-folded{ color:var(--muted); cursor:pointer; }
  .CodeMirror-foldgutter-open:after{ content:'▾'; }
  .CodeMirror-foldgutter-folded:after{ content:'▸'; }
  .CodeMirror-foldmarker{ color:var(--accent); background:var(--accent-light); border-radius:4px; padding:0 4px; font-family:inherit; text-shadow:none; cursor:pointer; }
  .cm-error-line{ background:rgba(239,68,68,.13) !important; }
  .cm-swatch{
    display:inline-block; width:11px; height:11px; border-radius:3px; margin:0 4px -1px 1px; cursor:pointer; vertical-align:baseline;
    box-shadow:0 0 0 1px rgba(0,0,0,.28) inset, 0 0 0 1px rgba(255,255,255,.4);
    background-image:linear-gradient(var(--sw), var(--sw)), repeating-conic-gradient(#ccc 0 25%, #fff 0 50%);
    background-size:auto, 6px 6px;
  }
  .cm-swatch:hover{ transform:scale(1.25); }
  #color-input{ position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }

  .console-line{ display:flex; gap:10px; }
  .console-line .console-text{ flex:1; min-width:0; }
  .console-line .console-ic{ width:12px; height:12px; vertical-align:-1px; margin-right:6px; }
  .console-loc{ flex-shrink:0; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .console-loc:hover{ color:var(--accent); }
  .console-line.console-input{ color:var(--muted); }
  .console-line.console-result{ color:var(--text); }
  .console-input-row{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:5px 12px;
    border-top:1px solid var(--border); font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--accent);
  }
  .console-input-row input{
    flex:1; border:none; outline:none; background:transparent; color:var(--text);
    font-family:inherit; font-size:12px;
  }
  .console-panel{ height:190px; }
  .console-tools{ display:flex; gap:10px; align-items:center; }

  @media (max-width: 900px){
    .device-seg, .device-label{ display:none; }
    .search-input{ width:150px; }
    .hide-sm{ display:none; }
  }
</style>
</head>
<body>

<!-- ============ CATALOG VIEW ============ -->
<div id="view-catalog">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>
      </div>
      <div class="topbar-text">
        <h1>Редактор коду</h1>
        <p>HTML, CSS і JavaScript з живим переглядом</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="view-btn" id="catalog-theme-btn" title="Світла / темна тема"></button>
    </div>
  </div>

  <div class="main">
    <div class="stats-bar">
      <div class="stats-bar-left"><b id="proj-count">0</b> <span id="proj-word">проєктів</span></div>
      <div class="catalog-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" class="search-input" id="search-input" placeholder="Пошук проєктів…">
        </div>
        <button class="ghost-btn" id="catalog-import-btn" title="Відкрити .zip або .html з комп'ютера">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="hide-sm">Імпорт</span>
        </button>
        <input type="file" id="catalog-import-input" class="hidden" accept=".zip,.html,.htm">
        <button class="retry-btn" id="add-tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Новий проєкт
        </button>
      </div>
    </div>

    <div class="tools-grid" id="grid"></div>
    <div class="no-results hidden" id="no-results">Нічого не знайдено</div>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></div>
      <h3>Поки що порожньо</h3>
      <p>Створи перший проєкт — можна почати з готового шаблону: візитка, список справ, гра чи вікторина</p>
      <button class="retry-btn" id="empty-new-btn" style="margin:0 auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Створити проєкт
      </button>
    </div>
  </div>
</div>

<!-- ============ EDITOR VIEW ============ -->
<div id="view-editor" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="hide-sm">Проєкти</span>
      </button>
      <input type="text" id="project-name" class="name-input" placeholder="Назва проєкту">
      <span class="save-status" id="save-status"></span>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn" id="share-btn" title="Поділитися посиланням на проєкт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="hide-sm">Поділитися</span>
      </button>
      <div class="settings-wrap" id="settings-wrap">
        <button class="view-btn" id="settings-btn" title="Налаштування">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="settings-panel hidden" id="settings-panel">

          <div class="settings-section">
            <div class="settings-label">Мови в редакторі</div>
            <div class="settings-opt-row">
              <button class="settings-opt-btn active" id="pill-html" data-lang="html">
                <span class="dot" style="background:var(--lang-html)"></span>HTML
              </button>
              <button class="settings-opt-btn active" id="pill-css" data-lang="css">
                <span class="dot" style="background:var(--lang-css)"></span>CSS
              </button>
              <button class="settings-opt-btn active" id="pill-js" data-lang="js">
                <span class="dot" style="background:var(--lang-js)"></span>JS
              </button>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-label">Де показувати результат</div>
            <div class="settings-opt-row">
              <button class="settings-opt-btn active" id="opt-grid" title="Перегляд знизу">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="8"/><rect x="10.5" y="3" width="7" height="8"/><rect x="18" y="3" width="3" height="8"/><rect x="3" y="13" width="18" height="8" fill="currentColor" fill-opacity=".22"/></svg>
                Знизу
              </button>
              <button class="settings-opt-btn" id="opt-right" title="Перегляд справа">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18" fill="currentColor" fill-opacity=".22"/></svg>
                Справа
              </button>
              <button class="settings-opt-btn" id="opt-left" title="Перегляд зліва">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="18" fill="currentColor" fill-opacity=".22"/><rect x="13" y="3" width="8" height="18"/></svg>
                Зліва
              </button>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-label">Розмір шрифту</div>
            <div class="font-size-control">
              <button class="font-btn" id="font-dec" title="Менше">−</button>
              <span id="font-size-value">13px</span>
              <button class="font-btn" id="font-inc" title="Більше">+</button>
            </div>
          </div>

          <div class="settings-section">
            <label class="settings-toggle">
              <span>Оновлювати перегляд одразу</span>
              <span class="switch"><input type="checkbox" id="autorun-toggle" checked><span class="slider"></span></span>
            </label>
          </div>

          <div class="settings-section">
            <label class="settings-toggle">
              <span>Перенос рядків</span>
              <span class="switch"><input type="checkbox" id="wrap-toggle" checked><span class="slider"></span></span>
            </label>

    const lastSemi = lineText.lastIndexOf(';');

    const declStart = Math.max(lastSemi, lastBrace);

        list = GOOGLE_FONT_HINTS.concat(GENERIC_FONT_FALLBACKS.map(g => ({ text:g, displayText:g })));

      html:'<div class="card">\n  <div class="avatar">🦊</div>\n  <h1>Олена Коваленко</h1>\n  <p class="role">Учениця 8-Б класу</p>\n  <p class="about">Люблю малювати, програмувати і читати фантастику. Мрію створити власну гру!</p>\n  <ul class="tags">\n    <li>🎨 Малювання</li>\n    <li>💻 Код</li>\n    <li>📚 Книги</li>\n  </ul>\n  <div class="links">\n    <a href="#" class="btn">Мої роботи</a>\n    <a href="#" class="btn btn-outline">Написати</a>\n  </div>\n</div>',
      css:'body {\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #a5b4fc, #f0abfc);\n}\n\n.card {\n  width: 320px;\n  padding: 32px 28px;\n  text-align: center;\n  background: white;\n  border-radius: 24px;\n  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);\n}\n\n.avatar {\n  width: 96px;\n  height: 96px;\n  margin: 0 auto 12px;\n  font-size: 56px;\n  line-height: 96px;\n  border-radius: 50%;\n  background: #fef3c7;\n}\n\nh1 { margin: 0; font-size: 22px; }\n.role { margin: 4px 0 14px; color: #6366f1; font-weight: 600; }\n.about { color: #475569; line-height: 1.6; }\n\n.tags {\n  display: flex;\n  justify-content: center;\n  gap: 8px;\n  padding: 0;\n  list-style: none;\n}\n\n.tags li {\n  padding: 4px 10px;\n  font-size: 13px;\n  border-radius: 20px;\n  background: #eef2ff;\n}\n\n.links { display: flex; gap: 10px; margin-top: 20px; }\n\n.btn {\n  flex: 1;\n  padding: 10px;\n  border-radius: 12px;\n  background: #6366f1;\n  color: white;\n  text-decoration: none;\n  font-weight: 600;\n  transition: transform 0.15s;\n}\n\n.btn:hover { transform: translateY(-2px); }\n.btn-outline { background: white; color: #6366f1; border: 2px solid #6366f1; }',

    { id:'counter', icon:'counter', name:'Лічильник кліків', desc:'Кнопки, змінна і подія click — основи JavaScript', level:'Перші кроки в JS',
      html:'<div class="box">\n  <h1>Лічильник</h1>\n  <div id="count">0</div>\n  <div class="buttons">\n    <button id="minus">−</button>\n    <button id="reset">Скинути</button>\n    <button id="plus">+</button>\n  </div>\n</div>',
      css:'body {\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  font-family: system-ui, sans-serif;\n  background: #0f172a;\n  color: white;\n}\n\n.box { text-align: center; }\n\n#count {\n  font-size: 96px;\n  font-weight: 800;\n  margin: 10px 0 24px;\n  transition: transform 0.15s;\n}\n\n.buttons { display: flex; gap: 12px; justify-content: center; }\n\nbutton {\n  min-width: 64px;\n  padding: 12px 18px;\n  font-size: 20px;\n  border: none;\n  border-radius: 14px;\n  background: #4f6bf4;\n  color: white;\n  cursor: pointer;\n}\n\nbutton:hover { background: #6c85ff; }\n#reset { font-size: 15px; background: #334155; }',
      js:'// Змінна, у якій зберігаємо число\nlet count = 0;\n\nconst countEl = document.getElementById(\'count\');\n\nfunction show() {\n  countEl.textContent = count;\n  // колір змінюється залежно від знаку числа\n  countEl.style.color = count > 0 ? \'#4ade80\' : count < 0 ? \'#f87171\' : \'white\';\n  countEl.style.transform = \'scale(1.15)\';\n  setTimeout(() => countEl.style.transform = \'\', 120);\n}\n\ndocument.getElementById(\'plus\').addEventListener(\'click\', () => {\n  count++;\n  show();\n});\n\ndocument.getElementById(\'minus\').addEventListener(\'click\', () => {\n  count--;\n  show();\n});\n\ndocument.getElementById(\'reset\').addEventListener(\'click\', () => {\n  count = 0;\n  show();\n});\n\nconsole.log(\'Лічильник готовий! Відкрий консоль, щоб бачити такі повідомлення.\');' },
    { id:'todo', icon:'todo', name:'Список справ', desc:'Додавання, виконання і видалення завдань, збереження в браузері', level:'Середній',
      html:'<div class="todo">\n  <h1>📝 Мої справи</h1>\n  <form id="form">\n    <input id="input" placeholder="Що потрібно зробити?" autocomplete="off">\n    <button>Додати</button>\n  </form>\n  <ul id="list"></ul>\n  <p id="stats"></p>\n</div>',
      css:'body {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n  background: #f1f5f9;\n}\n\n.todo {\n  max-width: 440px;\n  margin: 50px auto;\n  padding: 24px;\n  background: white;\n  border-radius: 18px;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);\n}\n\nh1 { margin-top: 0; font-size: 24px; }\n\nform { display: flex; gap: 8px; }\n\ninput {\n  flex: 1;\n  padding: 10px 12px;\n  font-size: 15px;\n  border: 2px solid #e2e8f0;\n  border-radius: 10px;\n  outline: none;\n}\n\ninput:focus { border-color: #10b981; }\n\nbutton {\n  padding: 10px 16px;\n  border: none;\n  border-radius: 10px;\n  background: #10b981;\n  color: white;\n  font-weight: 600;\n  cursor: pointer;\n}\n\nul { list-style: none; padding: 0; }\n\nli {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 4px;\n  border-bottom: 1px solid #f1f5f9;\n}\n\nli span { flex: 1; cursor: pointer; }\nli.done span { text-decoration: line-through; color: #94a3b8; }\n\n.del {\n  padding: 4px 9px;\n  background: #fee2e2;\n  color: #ef4444;\n}\n\n#stats { color: #64748b; font-size: 14px; }',
      js:'const form = document.getElementById(\'form\');\nconst input = document.getElementById(\'input\');\nconst list = document.getElementById(\'list\');\nconst stats = document.getElementById(\'stats\');\n\n// Завантажуємо збережені справи (або порожній масив)\nlet todos = JSON.parse(localStorage.getItem(\'todos\') || \'[]\');\n\nfunction save() {\n  localStorage.setItem(\'todos\', JSON.stringify(todos));\n}\n\nfunction render() {\n  list.innerHTML = \'\';\n  todos.forEach((todo, i) => {\n    const li = document.createElement(\'li\');\n    if (todo.done) li.classList.add(\'done\');\n\n    const text = document.createElement(\'span\');\n    text.textContent = todo.text;\n    text.onclick = () => { todo.done = !todo.done; save(); render(); };\n\n    const del = document.createElement(\'button\');\n    del.textContent = \'✕\';\n    del.className = \'del\';\n    del.onclick = () => { todos.splice(i, 1); save(); render(); };\n\n    li.append(text, del);\n    list.append(li);\n  });\n  const left = todos.filter(t => !t.done).length;\n  stats.textContent = todos.length ? `Залишилось: ${left} з ${todos.length}` : \'Список порожній 🎉\';\n}\n\nform.addEventListener(\'submit\', (e) => {\n  e.preventDefault();\n  const text = input.value.trim();\n  if (!text) return;\n  todos.push({ text, done: false });\n  input.value = \'\';\n  save();\n  render();\n});\n\nrender();' },
    { id:'anim', icon:'palette', name:'CSS-анімації', desc:'Ключові кадри @keyframes: стрибки, обертання, пульсація', level:'Початківці',
      html:'<div class="scene">\n  <div class="ball"></div>\n  <div class="square"></div>\n  <div class="heart">❤️</div>\n</div>\n<p class="hint">Наведи мишку на фігури 👆</p>',
      css:'body {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n  background: #fdf4ff;\n  text-align: center;\n}\n\n.scene {\n  display: flex;\n  justify-content: center;\n  align-items: flex-end;\n  gap: 60px;\n  height: 260px;\n  padding-top: 40px;\n}\n\n.ball {\n  width: 70px;\n  height: 70px;\n  border-radius: 50%;\n  background: radial-gradient(circle at 30% 30%, #fde047, #f97316);\n  animation: bounce 0.8s ease-in infinite alternate;\n}\n\n@keyframes bounce {\n  from { transform: translateY(-160px); }\n  to { transform: translateY(0) scaleY(0.85); }\n}\n\n.square {\n  width: 70px;\n  height: 70px;\n  border-radius: 14px;\n  background: #8b5cf6;\n  animation: spin 3s linear infinite;\n}\n\n@keyframes spin {\n  to { transform: rotate(360deg); }\n}\n\n.heart {\n  font-size: 64px;\n  animation: pulse 1s ease-in-out infinite;\n}\n\n@keyframes pulse {\n  50% { transform: scale(1.25); }\n}\n\n.scene > div:hover { animation-play-state: paused; }\n.hint { color: #a855f7; }',
      js:'' },
    { id:'game', icon:'game', name:'Гра «Спіймай кульку»', desc:'Canvas, таймер і рахунок: клацай по кульках, поки не скінчився час', level:'Середній',
      html:'<div class="hud">\n  <span>Рахунок: <b id="score">0</b></span>\n  <span>Час: <b id="time">30</b></span>\n  <button id="start">Почати</button>\n</div>\n<canvas id="game" width="640" height="400"></canvas>',
      css:'body {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n  background: #0b1020;\n  color: white;\n  text-align: center;\n}\n\n.hud {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  gap: 24px;\n  padding: 14px;\n  font-size: 18px;\n}\n\nbutton {\n  padding: 8px 18px;\n  font-size: 16px;\n  border: none;\n  border-radius: 10px;\n  background: #22c55e;\n  color: white;\n  cursor: pointer;\n}\n\ncanvas {\n  max-width: 100%;\n  background: #111833;\n  border-radius: 16px;\n  cursor: crosshair;\n}',
      js:'const canvas = document.getElementById(\'game\');\nconst ctx = canvas.getContext(\'2d\');\nconst scoreEl = document.getElementById(\'score\');\nconst timeEl = document.getElementById(\'time\');\n\nlet ball = null;\nlet score = 0;\nlet timeLeft = 0;\nlet timer = null;\n\nfunction newBall() {\n  const r = 14 + Math.random() * 22;\n  ball = {\n    x: r + Math.random() * (canvas.width - 2 * r),\n    y: r + Math.random() * (canvas.height - 2 * r),\n    r,\n    color: `hsl(${Math.random() * 360}, 85%, 60%)`\n  };\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  if (ball) {\n    ctx.beginPath();\n    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);\n    ctx.fillStyle = ball.color;\n    ctx.fill();\n  } else {\n    ctx.fillStyle = \'white\';\n    ctx.font = \'24px system-ui\';\n    ctx.textAlign = \'center\';\n    ctx.fillText(\'Натисни «Почати»\', canvas.width / 2, canvas.height / 2);\n  }\n  requestAnimationFrame(draw);\n}\n\ncanvas.addEventListener(\'click\', (e) => {\n  if (!ball || timeLeft <= 0) return;\n  const rect = canvas.getBoundingClientRect();\n  const x = (e.clientX - rect.left) * (canvas.width / rect.width);\n  const y = (e.clientY - rect.top) * (canvas.height / rect.height);\n  if (Math.hypot(x - ball.x, y - ball.y) <= ball.r) {\n    score++;\n    scoreEl.textContent = score;\n    newBall();\n  }\n});\n\ndocument.getElementById(\'start\').addEventListener(\'click\', () => {\n  score = 0;\n  timeLeft = 30;\n  scoreEl.textContent = 0;\n  timeEl.textContent = timeLeft;\n  newBall();\n  clearInterval(timer);\n  timer = setInterval(() => {\n    timeLeft--;\n    timeEl.textContent = timeLeft;\n    if (timeLeft <= 0) {\n      clearInterval(timer);\n      ball = null;\n      alert(\'Час вийшов! Твій рахунок: \' + score);\n    }\n  }, 1000);\n});\n\ndraw();' },
    { id:'quiz', icon:'quiz', name:'Вікторина', desc:'Питання з варіантами відповідей, перевірка і підсумок', level:'Середній',
      html:'<div class="quiz">\n  <div class="progress" id="progress"></div>\n  <h2 id="question"></h2>\n  <div id="answers"></div>\n  <button id="next" hidden>Далі →</button>\n</div>',
      css:'body {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n  background: #ecfeff;\n}\n\n.quiz {\n  max-width: 520px;\n  margin: 50px auto;\n  padding: 28px;\n  background: white;\n  border-radius: 20px;\n  box-shadow: 0 10px 30px rgba(8, 145, 178, 0.15);\n}\n\n.progress { color: #0891b2; font-weight: 600; font-size: 14px; }\n\n#answers { display: grid; gap: 10px; margin: 18px 0; }\n\n#answers button {\n  padding: 12px 14px;\n  font-size: 16px;\n  text-align: left;\n  border: 2px solid #e2e8f0;\n  border-radius: 12px;\n  background: white;\n  cursor: pointer;\n}\n\n#answers button:hover:not(:disabled) { border-color: #06b6d4; }\n#answers .right { border-color: #22c55e; background: #dcfce7; }\n#answers .wrong { border-color: #ef4444; background: #fee2e2; }\n\n#next {\n  padding: 10px 20px;\n  font-size: 16px;\n  border: none;\n  border-radius: 12px;\n  background: #0891b2;\n  color: white;\n  cursor: pointer;\n}',
      js:'// Додай свої питання: текст, варіанти і номер правильного (з нуля)\nconst questions = [\n  { q: \'Яке місто є столицею України?\', a: [\'Львів\', \'Київ\', \'Одеса\', \'Харків\'], right: 1 },\n  { q: \'Скільки буде 7 × 8?\', a: [\'54\', \'56\', \'64\', \'48\'], right: 1 },\n  { q: \'Який тег робить заголовок першого рівня?\', a: [\'<p>\', \'<head>\', \'<h1>\', \'<title>\'], right: 2 }\n];\n\nlet current = 0;\nlet score = 0;\n\nconst questionEl = document.getElementById(\'question\');\nconst answersEl = document.getElementById(\'answers\');\nconst progressEl = document.getElementById(\'progress\');\nconst nextBtn = document.getElementById(\'next\');\n\nfunction showQuestion() {\n  const item = questions[current];\n  progressEl.textContent = `Питання ${current + 1} з ${questions.length}`;\n  questionEl.textContent = item.q;\n  answersEl.innerHTML = \'\';\n  nextBtn.hidden = true;\n\n  item.a.forEach((text, i) => {\n    const btn = document.createElement(\'button\');\n    btn.textContent = text;\n    btn.onclick = () => {\n      const buttons = answersEl.querySelectorAll(\'button\');\n      buttons.forEach(b => b.disabled = true);\n      buttons[item.right].classList.add(\'right\');\n      if (i === item.right) score++;\n      else btn.classList.add(\'wrong\');\n      nextBtn.hidden = false;\n    };\n    answersEl.append(btn);\n  });\n}\n\nnextBtn.onclick = () => {\n  current++;\n  if (current < questions.length) {\n    showQuestion();\n  } else {\n    progressEl.textContent = \'Готово!\';\n    questionEl.textContent = `Правильних відповідей: ${score} з ${questions.length} 🎉`;\n    answersEl.innerHTML = \'\';\n    nextBtn.hidden = true;\n  }\n};\n\nshowQuestion();' }

  // ---------- Storage ----------
  function loadProjects(){

  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function formatDate(ts){
    const d = new Date(ts), now = new Date();
    const time = d.toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' });
    if(d.toDateString() === now.toDateString()) return 'сьогодні о ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if(d.toDateString() === y.toDateString()) return 'вчора о ' + time;
    return d.toLocaleDateString('uk-UA', { day:'2-digit', month:'2-digit', year:'numeric' });
  }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g, '&quot;'); }
  function plural(n, one, few, many){
    const m10 = n % 10, m100 = n % 100;
    if(m10 === 1 && m100 !== 11) return one;
    if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function hashStr(s){ let h = 0; for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

  // ---------- Popover menu ----------

  function openMenu(anchor, items){

      b.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); it.action(); });
      m.appendChild(b);
    });
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth, mh = m.offsetHeight;
    const x = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8));
    let y = r.bottom + 6;
    if(y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 6);

  // ---------- Building the page document ----------
  // Runs inside the preview iframe: forwards console output and errors to the
  // parent page, and evaluates expressions typed into our console.
  function edvaultConsoleBridge(){
    var P = window.parent;
    function fmt(a, d){
      if(a === undefined) return 'undefined';
      if(a === null) return 'null';
      var t = typeof a;
      if(t === 'string') return d ? JSON.stringify(a) : a;
      if(t === 'number' || t === 'boolean' || t === 'bigint') return String(a);
      if(t === 'function') return 'ƒ ' + (a.name || 'anonymous') + '()';
      if(t === 'symbol') return a.toString();
      if(a instanceof Error) return a.name + ': ' + a.message;
      if(typeof Element !== 'undefined' && a instanceof Element){
        var s = '<' + a.tagName.toLowerCase();
        if(a.id) s += ' id="' + a.id + '"';
        if(typeof a.className === 'string' && a.className) s += ' class="' + a.className + '"';
        return s + '>';
      }
      if(d > 2) return Array.isArray(a) ? '[…]' : '{…}';
      try{
        if(Array.isArray(a)) return '[' + a.slice(0, 50).map(function(x){ return fmt(x, d + 1); }).join(', ') + (a.length > 50 ? ', …' : '') + ']';
        var keys = Object.keys(a);
        return '{' + keys.slice(0, 30).map(function(k){ return k + ': ' + fmt(a[k], d + 1); }).join(', ') + (keys.length > 30 ? ', …' : '') + '}';
      }catch(e){ return String(a); }
    }
    function send(level, args, line){
      try{
        P.postMessage({ __edvaultConsole:true, level:level, line:line || 0,
          args: Array.prototype.map.call(args, function(x){ return fmt(x, level === 'result' ? 1 : 0); }) }, '*');
      }catch(e){}
    }
    ['log', 'info', 'warn', 'error', 'debug'].forEach(function(level){
      var orig = console[level];
      console[level] = function(){ send(level === 'debug' ? 'log' : level, arguments); if(orig) orig.apply(console, arguments); };
    });
    console.table = console.dir = console.log;
    console.clear = function(){ send('clear', []); };
    window.addEventListener('error', function(e){ if(e.message) send('error', [e.message], e.lineno); });
    window.addEventListener('unhandledrejection', function(e){
      var r = e.reason; send('error', ['Помилка в Promise: ' + (r && r.message ? r.message : r)]);
    });
    window.addEventListener('message', function(e){
      var m = e.data;
      if(!m || !m.__edvaultEval) return;
      try{ send('result', [(0, eval)(m.code)]); }
      catch(err){ send('error', [err && err.name ? err.name + ': ' + err.message : String(err)]); }
    });
  }
  const CONSOLE_BRIDGE_SCRIPT = '<script>(' + edvaultConsoleBridge.toString() + ')();<\/script>';

  function fontLinkTags(fonts){
    return Array.from(fonts || []).map(f =>
      `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}:wght@400;700&display=swap">`
      + `\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}&display=swap">`
    ).join('\n');
  }

  // Splits a full page into the part before the JS and the part after it,
  // so the preview can know on which line the JS pane starts.
  function docParts(p, opts = {}){
    const fonts = fontLinkTags(p.fonts);
    const head = '<!DOCTYPE html>\n<html lang="uk">\n<head>\n<meta charset="UTF-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
      + (opts.title ? '<title>' + escapeHtml(opts.title) + '</title>\n' : '')
      + (opts.bridge ? CONSOLE_BRIDGE_SCRIPT + '\n' : '')
      + (fonts ? fonts + '\n' : '')
      + '<style>\n' + (p.css || '') + '\n</style>\n</head>\n<body>\n'
      + (p.html || '') + '\n' + (opts.noScript ? '' : '<script>\n');
    return { head, tail: opts.noScript ? '</body>\n</html>' : '\n<\/script>\n</body>\n</html>' };
  }
  function composeDoc(p, opts = {}){
    if(p.code) return p.code; // legacy single-field projects
    const { head, tail } = docParts(p, opts);
    return head + (opts.noScript ? '' : (p.js || '')) + tail;
  }
  function currentData(){

  // ---------- Catalog rendering ----------
  let thumbObserver = null;
  const thumbResize = new ResizeObserver(entries => {
    entries.forEach(en => {

    });
  });
  function mountThumb(thumb, p){
    const hasContent = ((p.html || '') + (p.css || '') + (p.code || '')).trim().length > 0;
    if(!hasContent){ thumb.innerHTML = `<div class="thumb-empty">${svg(CODE_ICON)}</div>`; return; }
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', '');          // no scripts in thumbnails: fast and safe
    f.setAttribute('tabindex', '-1');
    f.setAttribute('aria-hidden', 'true');
    f.srcdoc = composeDoc(p, { noScript:true });
    f.style.transform = `scale(${thumb.clientWidth / 1200 || 0.2})`;
    thumb.appendChild(f);
    thumbResize.observe(thumb);
  }

  function renderCatalog(){
    const all = loadProjects();
    const q = searchInput.value.trim().toLowerCase();
    const projects = all.slice()
      .sort((a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0))
      .filter(p => !q || (p.name || '').toLowerCase().includes(q));
    grid.innerHTML = '';
    thumbResize.disconnect();
    if(thumbObserver) thumbObserver.disconnect();
    thumbObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(!en.isIntersecting) return;
        thumbObserver.unobserve(en.target);
        const p = all.find(x => x.id === en.target.dataset.id);
        if(p) mountThumb(en.target, p);
      });
    }, { rootMargin:'200px' });

    projCount.textContent = all.length;
    projWord.textContent = plural(all.length, 'проєкт', 'проєкти', 'проєктів');
    emptyState.classList.toggle('visible', all.length === 0);
    noResults.classList.toggle('hidden', !(all.length && !projects.length));

    projects.forEach(p => {
      const pal = PALETTE[hashStr(p.id || p.name || '') % PALETTE.length];
      const langs = ['html','css','js'].filter(l => (p[l] || '').trim().length > 0);
      const tag = p.code ? 'HTML' : langs.length ? langs.map(l => l.toUpperCase()).join(' · ') : 'Порожньо';

      const card = document.createElement('div');

        <div class="tool-card-body">

        </div>`;
      card.addEventListener('click', (e) => {
        if(e.target.closest('.tool-more')) return;
        openEditor(p);
      });
      const more = card.querySelector('.tool-more');
      more.addEventListener('click', (e) => {
        e.stopPropagation();
        if(menuAnchor === more){ closeMenu(); return; }
        openMenu(more, [
          { label:'Відкрити', icon:ICONS.open, action:() => openEditor(p) },
          { label:'Перейменувати', icon:ICONS.rename, action:() => renameProject(p) },
          { label:'Дублювати', icon:ICONS.copy, action:() => duplicateProject(p) },
          '-',
          { label:'Завантажити .html', icon:ICONS.file, action:() => downloadHtml(p) },
          { label:'Завантажити .zip', icon:ICONS.zip, action:() => downloadZip(p) },
          { label:'Поділитися посиланням', icon:ICONS.link, action:() => openShare(p) },
          '-',
          { label:'Видалити', icon:ICONS.trash, danger:true, action:() => deleteProject(p) }
        ]);
      });
      grid.appendChild(card);
      thumbObserver.observe(card.querySelector('.tool-thumb'));
    });
  }
  searchInput.addEventListener('input', renderCatalog);

  async function renameProject(p){
    const name = await askText('Перейменувати проєкт', p.name);

  function duplicateProject(p){

  // ---------- New project: templates ----------
  function openTemplates(){
    const box = openModal(`<h3 class="modal-title">Новий проєкт</h3>

  function uniqueName(base){
    const names = new Set(loadProjects().map(p => p.name));
    if(!names.has(base)) return base;
    let i = 2; while(names.has(`${base} ${i}`)) i++;
    return `${base} ${i}`;
  }

  // ---------- Import a whole project (.zip / .html) into the catalog ----------
  function isLocalRef(url){ return url && !/^([a-z]+:)?\/\//i.test(url) && !url.startsWith('data:'); }
  function baseName(path){ return path.split('/').pop(); }
  async function parseProjectHtml(text, readFile){
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const cssParts = [], jsParts = [], fonts = [];
    for(const l of Array.from(doc.querySelectorAll('link[rel~="stylesheet"][href]'))){
      const href = l.getAttribute('href');
      const m = href.match(/fonts\.googleapis\.com\/css2?\?family=([^:&]+)/);
      if(m){ const f = decodeURIComponent(m[1]).replace(/\+/g, ' '); if(!fonts.includes(f)) fonts.push(f); l.remove(); continue; }
      if(isLocalRef(href) && readFile){ const c = await readFile(href); if(c != null){ cssParts.push(c.trim()); l.remove(); } }
    }
    doc.querySelectorAll('style').forEach(s => { cssParts.push(s.textContent.trim()); s.remove(); });
    for(const s of Array.from(doc.querySelectorAll('script'))){
      const src = s.getAttribute('src');
      if(!src){ jsParts.push(s.textContent.trim()); s.remove(); continue; }
      if(isLocalRef(src) && readFile){ const c = await readFile(src); if(c != null){ jsParts.push(c.trim()); s.remove(); } }
    }
    const headExtra = Array.from(doc.head.querySelectorAll('link[rel~="stylesheet"], script[src]')).map(n => n.outerHTML).join('\n');
    const html = dedent(doc.body.innerHTML).trim();
    return { title: doc.title.trim(), html: headExtra ? headExtra + '\n' + html : html,
      css: cssParts.filter(Boolean).join('\n\n'), js: jsParts.filter(Boolean).join('\n\n'), fonts };
  }
  function dedent(text){
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    const indents = lines.filter(l => l.trim()).map(l => l.match(/^[ \t]*/)[0].length);
    const min = indents.length ? Math.min(...indents) : 0;
    return min ? lines.map(l => l.slice(Math.min(min, l.match(/^[ \t]*/)[0].length))).join('\n') : text;
  }
  async function importProjectFile(file){
    const ext = file.name.split('.').pop().toLowerCase();
    const stem = file.name.replace(/\.[^.]+$/, '');
    let data;
    if(ext === 'zip'){
      const zip = await JSZip.loadAsync(file);
      const files = Object.values(zip.files).filter(f => !f.dir && !f.name.startsWith('__MACOSX'));
      const htmlFile = files.find(f => baseName(f.name).toLowerCase() === 'index.html') || files.find(f => /\.html?$/i.test(f.name));
      const used = new Set();
      const readFile = async (href) => {
        const want = href.replace(/^\.\//, '').split(/[?#]/)[0];
        const f = files.find(x => x.name === want || x.name.endsWith('/' + want));
        if(!f) return null;
        used.add(f.name);
        return f.async('string');
      };
      if(htmlFile){
        data = await parseProjectHtml(await htmlFile.async('string'), readFile);
      } else {
        data = { html:'', css:'', js:'', fonts:[] };
      }
      // CSS/JS files that the page didn't reference still go in
      for(const f of files){
        if(used.has(f.name)) continue;
        if(/\.css$/i.test(f.name)) data.css = [data.css, (await f.async('string')).trim()].filter(Boolean).join('\n\n');
        else if(/\.js$/i.test(f.name)) data.js = [data.js, (await f.async('string')).trim()].filter(Boolean).join('\n\n');
      }
    } else {
      data = await parseProjectHtml(await file.text(), null);
    }
    return { name: uniqueName(data.title || stem || 'Імпортований проєкт'), html: data.html, css: data.css, js: data.js, fonts: data.fonts || [] };
  }
  const catalogImportInput = document.getElementById('catalog-import-input');
  document.getElementById('catalog-import-btn').addEventListener('click', () => catalogImportInput.click());
  catalogImportInput.addEventListener('change', async () => {
    const file = catalogImportInput.files && catalogImportInput.files[0];

    }
  });

  // ---------- Share link ----------
  function b64urlFromBytes(bytes){
    let bin = '';
    for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function bytesFromB64url(s){
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    const out = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function encodeShare(p){
    const json = JSON.stringify({ v:1, n:p.name, h:p.html || p.code || '', c:p.css || '', j:p.js || '', f:p.fonts || [] });
    const stream = new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return b64urlFromBytes(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  async function decodeShare(s){
    const stream = new Blob([bytesFromB64url(s)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const o = JSON.parse(await new Response(stream).text());
    return { name: o.n || 'Спільний проєкт', html: o.h || '', css: o.c || '', js: o.j || '', fonts: Array.isArray(o.f) ? o.f : [] };
  }
  async function openShare(p){
    let url;
    try{ url = location.origin + location.pathname + '#p=' + await encodeShare(p); }
    catch(e){ toast('Цей браузер не вміє створювати посилання. Скористайся завантаженням .zip', 4000); return; }
    const long = url.length > 30000;
    const box = openModal(`<h3 class="modal-title">Поділитися проєктом</h3>
      <p class="modal-sub">Увесь код зашитий у посилання — нікуди не завантажується. Хто відкриє його, отримає <b>власну копію</b> проєкту, а твій лишиться без змін.</p>
      <div class="share-row"><input class="modal-input" readonly value="${escapeAttr(url)}"><button class="retry-btn" data-copy>Копіювати</button></div>
      <p class="share-note">${long ? svg(ICONS.alert, 'class="share-warn"') + 'Проєкт великий, тож посилання дуже довге — деякі месенджери можуть його обрізати. Тоді краще надіслати файл .zip.' : 'Посилання можна надіслати в месенджер, Classroom чи на пошту.'}</p>
