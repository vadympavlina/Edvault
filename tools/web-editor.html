<!DOCTYPE html>
<html lang="uk">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6BF4'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Редактор коду · Edvault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/idea.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

<script>
  // Apply saved theme before first paint to avoid a light-mode flash
  try{
    var t = localStorage.getItem('edvault-theme');
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e2e5ea;
    --border2: #d0d5dd;
    --accent: #4F6BF4;
    --accent-light: #eef0fe;
    --accent-hover: #3d57e0;
    --danger: #ef4444;
    --success: #10b981;
    --warn: #f59e0b;
    --text: #1a1d23;
    --text2: #4b5563;
    --muted: #9ca3af;
    --lang-html: #e34c26;
    --lang-css: #2965f1;
    --lang-js: #d4a017;
    --cm-font-size: 13px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.14), 0 4px 16px rgba(0,0,0,.08);
  }

  .CodeMirror-hints{
    font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    background: var(--surface) !important; border: 1.5px solid var(--border) !important;
    border-radius: 10px !important; box-shadow: var(--shadow-lg) !important; padding: 4px !important;
  }
  .CodeMirror-hint{ padding: 5px 10px !important; border-radius: 6px !important; color: var(--text) !important; }
  li.CodeMirror-hint-active{ background: var(--accent) !important; color: #fff !important; }

  .CodeMirror-matchingtag{
    background: var(--accent-light) !important;
    border-bottom: 1.5px solid var(--accent) !important;
  }

  .CodeMirror-dialog{
    background: var(--surface2) !important; border-bottom: 1.5px solid var(--border) !important;
    color: var(--text) !important; font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    padding: 8px 12px !important;
  }
  .CodeMirror-dialog input{
    background: var(--surface) !important; border: 1.5px solid var(--border2) !important;
    border-radius: 6px !important; color: var(--text) !important; padding: 4px 8px !important;
    font-family: inherit !important;
  }
  .CodeMirror-search-hint{ display: none; }

  .CodeMirror-dialog{
    background: var(--surface2) !important; color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
    font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important;
    padding: 8px 10px !important;
  }
  .CodeMirror-dialog input{
    background: var(--surface) !important; color: var(--text) !important;
    border: 1.5px solid var(--border2) !important; border-radius: 6px !important;
    padding: 3px 8px !important; font-family: inherit !important;
  }

  html[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1c212a;
    --surface2: #232933;
    --border: #2a313d;
    --border2: #384152;
    --accent: #6c85ff;
    --accent-light: rgba(108,133,255,.16);
    --accent-hover: #8298ff;
    --danger: #ff6b6b;
    --success: #34d399;
    --warn: #fbbf24;
    --text: #e8ecf1;
    --text2: #a8b0bd;
    --muted: #6b7280;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --shadow-md: 0 4px 16px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.55), 0 4px 16px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] body{ background: var(--bg); }
  html[data-theme="dark"] #preview-frame{ background: #fff; } /* preview stays a real page, not app chrome */

  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }

  .hidden { display: none !important; }

  /* =========== TOPBAR (shared) =========== */
  .topbar {
    min-height: 64px; flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 10px clamp(16px, 4vw, 28px);
    padding-top: env(safe-area-inset-top, 0);
    position: sticky; top: 0; z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: clamp(9px, 2vw, 12px); min-width: 0; }
  .topbar-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(79,107,244,.3); flex-shrink: 0;
  }
  .topbar-logo svg { width: 18px; height: 18px; }
  .topbar-text { min-width: 0; }
  .topbar-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-text p { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    background: var(--accent-light); color: var(--accent); letter-spacing: .03em;
    flex-shrink: 0;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--surface); color:var(--text2); font-family:inherit;
    font-size:13px;font-weight:600;cursor:pointer; transition:all .13s ease; flex-shrink:0;
  }
  .back-btn:hover{ border-color:var(--border2); background:var(--surface2); color:var(--text); }
  .back-btn svg{ width:14px; height:14px; }

  .name-input{
    padding:8px 12px; border:1.5px solid var(--border2); border-radius:9px;
    background:var(--surface); font-family:inherit; font-size:14px; font-weight:700; color:var(--text);
    outline:none; transition:all .15s ease; min-width:140px; max-width:260px;
  }
  .name-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,107,244,.1); }

  .unsaved-dot{
    width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0;
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .retry-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: background .13s;
    flex-shrink: 0;
  }
  .retry-btn:hover { background: var(--accent-hover); }
  .retry-btn svg{ width:14px; height:14px; }
  .retry-btn.saved-flash{ background: var(--success) !important; }

  .view-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .13s ease; flex-shrink: 0;
  }
  .view-btn:hover, .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view-btn svg { width: 15px; height: 15px; }

  .settings-wrap{ position: relative; flex-shrink: 0; }
  .settings-panel{
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 250px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg); padding: 14px; z-index: 40;
    max-height: calc(100vh - 90px); overflow-y: auto;
  }
  .settings-section{ margin-bottom: 14px; }
  .settings-section:last-child{ margin-bottom: 0; }
  .settings-label{ font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .settings-opt-row{ display: flex; gap: 5px; }
  .settings-opt-btn{
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 4px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text2); font-family: inherit;
    font-size: 10.5px; font-weight: 700; cursor: pointer; transition: all .13s ease;
  }
  .settings-opt-btn .dot{ width: 8px; height: 8px; border-radius: 50%; }
  .settings-opt-btn.active .dot{ background: #fff !important; }
  .settings-opt-btn.settings-opt-full{ flex-direction: row; width: 100%; gap: 8px; }
  .settings-opt-btn:hover{ border-color: var(--border2); background: var(--surface2); }
  .settings-opt-btn.active{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .settings-opt-btn svg{ width: 15px; height: 15px; }

  .settings-toggle{ display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text2); font-weight: 600; cursor: pointer; }

  .font-size-control{
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px; padding: 4px;
  }
  .font-btn{
    width: 28px; height: 28px; border: none; border-radius: 7px; background: var(--surface);
    color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: all .13s ease;
  }
  .font-btn:hover{ background: var(--accent); color: #fff; }
  #font-size-value{ font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text2); }
  .switch{ position: relative; width: 38px; height: 22px; flex-shrink: 0; display: inline-block; }
  .switch input{ opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider{ position: absolute; inset: 0; background: var(--border2); border-radius: 20px; cursor: pointer; transition: background .15s ease; }
  .switch .slider::before{ content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s ease; box-shadow: var(--shadow-sm); }
  .switch input:checked + .slider{ background: var(--accent); }
  .switch input:checked + .slider::before{ transform: translateX(16px); }

  /* =========== MAIN / CATALOG =========== */
  .main {
    max-width: 1200px; width: 100%;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 48px) clamp(16px, 4vw, 28px) clamp(56px, 10vw, 100px);
  }

  .stats-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; margin-bottom: 22px;
  }
  .stats-bar-left { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stats-bar-left b { color: var(--text); font-weight: 700; }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px;
  }

  .tool-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    cursor: pointer;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 16px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .15s ease;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .tool-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--card-accent-light, rgba(79,107,244,.06)), transparent 65%);
    opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  .tool-card:hover { transform: translateY(-4px) scale(1.012); box-shadow: var(--shadow-md); border-color: var(--card-accent, var(--accent)); }
  .tool-card:hover::before { opacity: 1; }
  .tool-card:active { transform: translateY(-1px) scale(1.005); }

  .tool-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .tool-icon {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card-accent-light, var(--accent-light));
    border: 1.5px solid var(--card-accent-border, #d6dcfd);
  }
  .tool-icon svg { width: 22px; height: 22px; color: var(--card-accent, var(--accent)); }

  .tool-tag {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
    background: var(--card-accent-light, var(--accent-light));
    color: var(--card-accent, var(--accent)); letter-spacing: .04em; text-transform: uppercase;
    white-space: nowrap; font-family:'JetBrains Mono', monospace;
  }

  .tool-card-body { flex: 1; }
  .tool-name { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; word-break:break-word; }
  .tool-desc { font-size: 13px; color: var(--text2); line-height: 1.6; }

  .tool-card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .tool-open-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--card-accent, var(--accent));
    background: var(--card-accent-light, var(--accent-light));
    border: 1.5px solid var(--card-accent-border, #d6dcfd);
    padding: 7px 14px; border-radius: 9px;
    transition: all .13s ease;
  }
  .tool-card:hover .tool-open-btn {
    background: var(--card-accent, var(--accent)); color: #fff; border-color: var(--card-accent, var(--accent));
  }
  .tool-open-btn svg { width: 12px; height: 12px; }

  .tool-del{
    position:absolute; top:14px; right:14px;
    width:26px;height:26px;border-radius:8px;border:none;
    background:var(--surface2); color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; opacity:0; transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .tool-card:hover .tool-del{ opacity:1; }
  .tool-del:hover{ background:var(--danger); color:#fff; }
  .tool-del svg{ width:13px; height:13px; }

  .empty-state { text-align: center; padding: 80px 20px; display: none; }
  .empty-state.visible { display: block; }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text2); margin-bottom: 18px; }

  @keyframes card-appear { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .tool-card { animation: card-appear .35s cubic-bezier(.16,1,.3,1) both; }

  @media (max-width: 640px) {
    .tools-grid { grid-template-columns: 1fr; gap: 14px; }
    .tool-card { padding: 18px; border-radius: 16px; gap: 13px; }
  }

  /* =========== EDITOR VIEW =========== */
  #view-editor{ height: 100vh; display: flex; flex-direction: column; }

  #editor-body{ flex: 1; display: flex; min-height: 0; background: var(--bg); }
  #editor-body[data-layout="grid"]{ flex-direction: column; }
  #editor-body[data-layout="split"]{ flex-direction: row; }
  #editor-body[data-layout="split-rev"]{ flex-direction: row-reverse; }

  .code-zone{ display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
  #editor-body[data-layout="grid"] .code-zone{ flex: 0 0 55%; }
  #editor-body[data-layout="split"] .code-zone,
  #editor-body[data-layout="split-rev"] .code-zone{ flex: 0 0 46%; }

  .preview-zone{ flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }

  .resizer{ flex-shrink: 0; background: var(--border); position: relative; transition: background .12s ease; }
  .resizer:hover, .resizer.dragging{ background: var(--accent); }
  #editor-body[data-layout="grid"] .resizer{ height: 6px; cursor: row-resize; }
  #editor-body[data-layout="split"] .resizer,
  #editor-body[data-layout="split-rev"] .resizer{ width: 6px; cursor: col-resize; }

  .lang-tabs{ display: none; gap: 2px; padding: 8px 8px 0; background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink:0; }
  #editor-body[data-layout="split"] .lang-tabs,
  #editor-body[data-layout="split-rev"] .lang-tabs{ display: flex; }
  .lang-tab-btn{
    padding: 8px 16px; border: none; border-radius: 8px 8px 0 0;
    background: transparent; color: var(--text2); font-family:'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .lang-tab-btn.active{ background: var(--surface); color: var(--text); box-shadow: 0 -1px 0 var(--border) inset; }
  .lang-tab-btn:hover:not(.active){ color: var(--text); }

  .code-panes{ flex: 1; display: flex; min-height: 0; }
  #editor-body[data-layout="grid"] .code-panes{ flex-direction: row; }
  #editor-body[data-layout="split"] .code-panes,
  #editor-body[data-layout="split-rev"] .code-panes{ flex-direction: column; }

  .code-pane{ flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); }
  #editor-body[data-layout="grid"] .code-pane:last-child{ border-right: none; }
  #editor-body[data-layout="split"] .code-pane,
  #editor-body[data-layout="split-rev"] .code-pane{ border-right: none; }
  .code-pane.hidden-lang, .code-pane.tab-hidden{ display: none; }

  .pane-resizer{
    flex-shrink: 0; width: 6px; background: var(--border); cursor: col-resize;
    transition: background .12s ease;
  }
  .pane-resizer:hover, .pane-resizer.dragging{ background: var(--accent); }

  .pane-head{
    flex-shrink: 0; display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--text2);
  }
  .pane-head .dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .pane-html .pane-head .dot{ background: var(--lang-html); }
  .pane-css  .pane-head .dot{ background: var(--lang-css); }
  .pane-js   .pane-head .dot{ background: var(--lang-js); }
  .pane-preview .pane-head .dot{ background: var(--success); }
  .pane-head .spacer{ flex: 1; }
  .pane-head .icon-btn{
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 3px; border-radius: 5px;
  }
  .pane-head .icon-btn:hover{ color: var(--text); background: var(--border); }
  .pane-head .icon-btn svg{ width: 14px; height: 14px; }

  /* fullscreen preview */
  #view-editor.preview-fullscreen .topbar,
  #view-editor.preview-fullscreen .code-zone,
  #view-editor.preview-fullscreen .resizer{ display: none; }

  .cm-wrap{ flex: 1; min-height: 0; }
  .CodeMirror{ height: 100%; font-size: var(--cm-font-size, 13px); font-family: 'JetBrains Mono', monospace; background: var(--surface); color: var(--text); }
  .CodeMirror-gutters{ background: var(--surface2); border-right: 1px solid var(--border); }
  .CodeMirror-cursor{ border-left: 2px solid var(--accent); }
  .CodeMirror-selected{ background: var(--accent-light) !important; }
  .CodeMirror-activeline-background{ background: var(--surface2) !important; }

  #preview-frame{ flex: 1; width: 100%; border: none; background: #fff; }

  .icon-btn{ position: relative; }
  .console-badge{
    position: absolute; top: 1px; right: 1px; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1; font-family: 'JetBrains Mono', monospace;
  }

  function cssSmartHint(cm){
    const cur = cm.getCursor();
    const lineText = cm.getLine(cur.line).slice(0, cur.ch);
    const wordMatch = /[\w-]*$/.exec(lineText);
    const word = wordMatch[0];
    const from = CodeMirror.Pos(cur.line, cur.ch - word.length);
    const to = CodeMirror.Pos(cur.line, cur.ch);

    const lastColon = lineText.lastIndexOf(':');
    const lastSemi = lineText.lastIndexOf(';');
    const lastBrace = Math.max(lineText.lastIndexOf('{'), lineText.lastIndexOf('}'));
    const declStart = Math.max(lastSemi, lastBrace);

    let list;
    if(lastColon > declStart){
      // cursor is after ":" within the current declaration => suggest values for THIS property only
      const propName = lineText.slice(declStart + 1, lastColon).trim().toLowerCase();
      if(propName === 'font-family'){
        list = GOOGLE_FONT_HINTS.concat(GENERIC_FONT_FALLBACKS.map(g => ({ text:g, displayText:g })));
      } else {
        let values = CSS_VALUES[propName] ? CSS_VALUES[propName].slice() : [];
        if(CSS_COLOR_PROPS.includes(propName)) values = values.concat(CSS_COLORS);
        list = values.length ? values.concat(CSS_GLOBAL_VALUES) : CSS_GLOBAL_VALUES.slice();
      }
    } else {
      list = CSS_PROPERTIES;
    }

    const label = item => (typeof item === 'string' ? item : item.displayText);
    const lower = word.toLowerCase();
    const sortedAll = list.slice().sort((a, b) => label(a).localeCompare(label(b)));
    const filtered = sortedAll.filter(item => label(item).toLowerCase().startsWith(lower));
    return { list: (filtered.length ? filtered : sortedAll), from, to };
  }

  // ---------- CodeMirror setup ----------
  function initEditors(){
    const cmOptions = {
      theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dracula' : 'idea',
      lineNumbers:true,
      lineWrapping:true,
      matchBrackets:true,

      indentUnit:2,
      viewportMargin:Infinity
    };
    const searchKeys = {
      'Ctrl-F': 'findPersistent', 'Cmd-F': 'findPersistent',

    };
    cmHtml = CodeMirror.fromTextArea(document.getElementById('cm-html'), {...cmOptions, mode:'htmlmixed', autoCloseTags:true, matchTags:{bothTags:true},
      extraKeys:{ ...searchKeys, 'Ctrl-Space': cm => CodeMirror.showHint(cm, CodeMirror.hint.html, { completeSingle:false }) }});
    cmCss  = CodeMirror.fromTextArea(document.getElementById('cm-css'),  {...cmOptions, mode:'css',
      extraKeys:{ ...searchKeys, 'Ctrl-Space': cm => attachFontPick(CodeMirror.showHint(cm, cssSmartHint, { completeSingle:false })) }});
    cmJs   = CodeMirror.fromTextArea(document.getElementById('cm-js'),   {...cmOptions, mode:'javascript',
      extraKeys:{ ...searchKeys, 'Ctrl-Space': cm => CodeMirror.showHint(cm, CodeMirror.hint.javascript, { completeSingle:false }) }});
    cmByLang = { html: cmHtml, css: cmCss, js: cmJs };

    paneEls = {
      html: document.querySelector('.pane-html'),
      css: document.querySelector('.pane-css'),
      js: document.querySelector('.pane-js')
    };

    [cmHtml, cmCss, cmJs].forEach(cm => {
      cm.on('change', () => {
        isDirty = true;
        updateDirtyIndicator();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(updatePreview, 350);
      });
    });

    cmHtml.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      if(/[<\/a-zA-Z]/.test(change.text[0])){
        CodeMirror.showHint(cm, CodeMirror.hint.html, { completeSingle:false });
      }
    });
    cmCss.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      if(/[a-zA-Z:]/.test(change.text[0])){
        attachFontPick(CodeMirror.showHint(cm, cssSmartHint, { completeSingle:false }));
      }
    });
    cmJs.on('inputRead', (cm, change) => {
      if(cm.state.completionActive || !change.text[0]) return;
      if(/[a-zA-Z_$.]/.test(change.text[0])){
        CodeMirror.showHint(cm, CodeMirror.hint.javascript, { completeSingle:false });

    document.querySelectorAll('[data-download]').forEach(btn => {
      btn.addEventListener('click', () => downloadSingle(btn.dataset.download));

  function refreshAll(){ cmHtml.refresh(); cmCss.refresh(); cmJs.refresh(); }

  // Overrides console.log/warn/error/info inside the preview iframe and
  // forwards them (plus uncaught errors / rejected promises) to the parent
  // page via postMessage, so they can be shown in our console panel.
  const CONSOLE_BRIDGE_SCRIPT = '<script>(function(){'
    + 'function send(level,args){try{window.parent.postMessage({__edvaultConsole:true,level:level,args:args.map(function(a){'
    + 'try{return typeof a==="object"&&a!==null?JSON.stringify(a):String(a);}catch(e){return String(a);}'
    + '})},"*");}catch(e){}}'
    + '["log","info","warn","error"].forEach(function(level){var orig=console[level];console[level]=function(){'
    + 'send(level,Array.prototype.slice.call(arguments));if(orig)orig.apply(console,arguments);};});'
    + 'window.onerror=function(msg,src,line){send("error",[msg+" (рядок "+line+")"]);return false;};'
    + 'window.addEventListener("unhandledrejection",function(e){var r=e.reason;send("error",["Unhandled promise rejection: "+(r&&r.message?r.message:r)]);});'
    + '})();<\/script>';

  function fontLinkTags(){
    return Array.from(usedFonts).map(f =>
      `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}:wght@400;700&display=swap">`
      + `\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}&display=swap">`
    ).join('\n');
  }

  function buildDoc(project){
    if(project && project.code) return project.code; // legacy single-field projects
    const html = cmHtml.getValue(), css = cmCss.getValue(), js = cmJs.getValue();
    const fonts = fontLinkTags();
    return '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n'
      + CONSOLE_BRIDGE_SCRIPT + '\n'
      + (fonts ? fonts + '\n' : '')
      + '<style>\n' + css + '\n</style>\n</head>\n<body>\n'
      + html + '\n<script>\n'
      + js + '\n<\/script>\n</body>\n</html>';
  }
  function updatePreview(){
    clearConsole();
    previewFrame.srcdoc = buildDoc();
  }

  // ---------- Downloads ----------
  function slugify(str){
    return (str || 'project').trim().toLowerCase()
      .replace(/[^a-z0-9а-яіїєґ]+/gi, '-')
      .replace(/^-+|-+$/g, '') || 'project';
  }
  function triggerDownload(filename, content, mime){
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function downloadSingle(lang){
    const filename = lang === 'html' ? 'index.html' : lang === 'css' ? 'style.css' : 'script.js';
    const mime = lang === 'html' ? 'text/html' : lang === 'css' ? 'text/css' : 'text/javascript';
    triggerDownload(filename, cmByLang[lang].getValue(), mime);
  }
  async function downloadZip(){
    const slug = slugify(nameInput.value);
    const html = cmHtml.getValue(), css = cmCss.getValue(), js = cmJs.getValue();
    const fonts = fontLinkTags();
    const indexHtml = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>' + escapeHtml(nameInput.value || 'project')
      + '</title>\n' + (fonts ? fonts + '\n' : '')
      + '<link rel="stylesheet" href="style.css">\n</head>\n<body>\n'
      + html + '\n<script src="script.js"><\/script>\n</body>\n</html>';

    const zip = new JSZip();
    zip.file('index.html', indexHtml);
    zip.file('style.css', css);
    zip.file('script.js', js);
    const blob = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${slug}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  downloadZipBtn.addEventListener('click', downloadZip);

  function renderEmptyConsoleIfNeeded(){

  function addConsoleLine(level, args){

    const line = document.createElement('div');
    line.className = 'console-line console-' + level;
    const prefix = level === 'error' ? '✕ ' : level === 'warn' ? '⚠ ' : '';
    line.textContent = prefix + args.join(' ');
    consoleBody.appendChild(line);
    consoleBody.scrollTop = consoleBody.scrollHeight;
    if(level === 'error'){
      errorCount++;
      consoleBadge.textContent = errorCount > 99 ? '99+' : String(errorCount);

      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>';

  // ---------- Language visibility + pane layout ----------
  function applyVisibility(){
    ['html','css','js'].forEach(l => langPills[l].classList.toggle('active', visible[l]));
    renderLangTabs();
    updateCodeLayout();
  }

  function renderLangTabs(){
    const langs = ['html','css','js'].filter(l => visible[l]);
    if(!langs.includes(activeTab)) activeTab = langs[0] || 'html';
    langTabsEl.innerHTML = langs.map(l =>

      btn.addEventListener('click', () => { activeTab = btn.dataset.lang; renderLangTabs(); updateCodeLayout(); });

  // Rebuilds .code-panes so that in grid layout every visible language sits
  // side by side with a draggable divider between neighbours; in split
  // layout only the active tab's pane is shown (no divider needed).
  function updateCodeLayout(){
    const layout = editorBody.dataset.layout;
    codePanesContainer.innerHTML = '';
    const langs = ['html','css','js'].filter(l => visible[l]);

    if(layout === 'grid'){
      langs.forEach((l, idx) => {
        const pane = paneEls[l];
        const isLast = idx === langs.length - 1;
        pane.classList.remove('hidden-lang', 'tab-hidden');
        pane.style.flex = (!isLast && paneFlexBasis[l] != null) ? `0 0 ${paneFlexBasis[l]}px` : '1 1 0%';
        codePanesContainer.appendChild(pane);
        if(idx < langs.length - 1){
          const r = document.createElement('div');
          r.className = 'pane-resizer';
          r.dataset.left = l;
          r.addEventListener('mousedown', paneDragStart);
          r.addEventListener('touchstart', paneDragStart, { passive:true });
          codePanesContainer.appendChild(r);
        }
      });
    } else {
      if(!langs.includes(activeTab)) activeTab = langs[0] || 'html';
      const pane = paneEls[activeTab];
      pane.classList.remove('hidden-lang', 'tab-hidden');
      pane.style.flex = '1 1 0%';
      codePanesContainer.appendChild(pane);
    }
    requestAnimationFrame(refreshAll);
  }

  // Dragging the divider between two grid panes: the pane to its LEFT gets a
  // fixed pixel width, everything else keeps flexing to fill the rest.
  let paneDragging = null;
  function paneDragStart(e){
    const r = e.currentTarget;
    const p = pointOf(e);
    paneDragging = { leftLang: r.dataset.left, startX: p.clientX, startWidth: paneEls[r.dataset.left].getBoundingClientRect().width, r };
    r.classList.add('dragging');
    document.body.style.userSelect = 'none';
    previewFrame.style.pointerEvents = 'none';
  }
  function paneDragMove(e){
    if(!paneDragging) return;
    const p = pointOf(e);
    const delta = p.clientX - paneDragging.startX;
    const containerWidth = codePanesContainer.getBoundingClientRect().width;
    const newWidth = Math.max(80, Math.min(containerWidth - 160, paneDragging.startWidth + delta));
    paneFlexBasis[paneDragging.leftLang] = newWidth;
    paneEls[paneDragging.leftLang].style.flex = `0 0 ${newWidth}px`;
  }
  function paneDragEnd(){
    if(!paneDragging) return;
    paneDragging.r.classList.remove('dragging');
    paneDragging = null;
    document.body.style.userSelect = '';
    previewFrame.style.pointerEvents = '';
    refreshAll();
  }
  window.addEventListener('mousemove', paneDragMove);
  window.addEventListener('mouseup', paneDragEnd);
  window.addEventListener('touchmove', paneDragMove, { passive:true });
  window.addEventListener('touchend', paneDragEnd);

  Object.keys(langPills).forEach(l => {
    langPills[l].addEventListener('click', () => {
      const visibleCount = Object.values(visible).filter(Boolean).length;
      if(visible[l] && visibleCount === 1) return; // keep at least one visible
      visible[l] = !visible[l];
      applyVisibility();
    });
  });

  // ---------- Layout switching ----------
  function setLayout(mode){
    editorBody.dataset.layout = mode;

  // ---------- Theme (light/dark) ----------
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }

  // ---------- Font size ----------
  function applyFontSize(){
    document.documentElement.style.setProperty('--cm-font-size', fontSize + 'px');
    fontSizeValue.textContent = fontSize + 'px';
    try{ localStorage.setItem('edvault-font-size', String(fontSize)); }catch(e){}
    if(cmHtml) requestAnimationFrame(refreshAll);
  }
  fontDecBtn.addEventListener('click', () => { fontSize = Math.max(11, fontSize - 1); applyFontSize(); });
  fontIncBtn.addEventListener('click', () => { fontSize = Math.min(22, fontSize + 1); applyFontSize(); });
  (function initFontSize(){
    try{
      const saved = parseInt(localStorage.getItem('edvault-font-size'), 10);
      if(saved && saved >= 11 && saved <= 22) fontSize = saved;
    }catch(e){}
    applyFontSize();
  })();

  // ---------- Resizer drag ----------
  let dragging = false, startPos = 0, startSize = 0;
  function pointOf(e){ return e.touches ? e.touches[0] : e; }

  function dragStart(e){
    dragging = true;
    const layout = editorBody.dataset.layout;
    const p = pointOf(e);
    startPos = layout === 'grid' ? p.clientY : p.clientX;
    startSize = layout === 'grid' ? codeZone.getBoundingClientRect().height : codeZone.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    previewFrame.style.pointerEvents = 'none';
  }
  function dragMove(e){
    if(!dragging) return;
    const layout = editorBody.dataset.layout;
    const rect = editorBody.getBoundingClientRect();
    const p = pointOf(e);
    let newSize;
    if(layout === 'grid'){
      const delta = p.clientY - startPos;
      newSize = Math.max(120, Math.min(rect.height - 100, startSize + delta));
    } else {
      const delta = layout === 'split-rev' ? (startPos - p.clientX) : (p.clientX - startPos);
      newSize = Math.max(220, Math.min(rect.width - 220, startSize + delta));
    }
    codeZone.style.flexBasis = newSize + 'px';
  }
  function dragEnd(){
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    previewFrame.style.pointerEvents = '';
    refreshAll();
  }
  resizer.addEventListener('mousedown', dragStart);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  resizer.addEventListener('touchstart', dragStart, { passive:true });
  window.addEventListener('touchmove', dragMove, { passive:true });
  window.addEventListener('touchend', dragEnd);

  // ---------- Editor open/close ----------
  function updateDirtyIndicator(){
    unsavedDot.classList.toggle('hidden', !isDirty);
  }

  function openEditor(project){
    if(!cmHtml) initEditors();

    currentEditId = project ? project.id : null;
    nameInput.value = project ? project.name : '';

    if(project && project.code){
      cmHtml.setValue(project.code);
      cmCss.setValue('');
      cmJs.setValue('');
    } else {
      cmHtml.setValue(project ? (project.html || '') : '<div id="app">\n  Привіт, Edvault!\n</div>');
      cmCss.setValue(project ? (project.css || '') : 'body{\n  font-family: sans-serif;\n  text-align: center;\n  margin-top: 60px;\n}');
      cmJs.setValue(project ? (project.js || '') : '');
    }

    visible = { html:true, css:true, js:true };
    activeTab = 'html';
    paneFlexBasis = { html:null, css:null, js:null };
    usedFonts = new Set(project && Array.isArray(project.fonts) ? project.fonts : []);
    settingsPanel.classList.add('hidden');
    settingsBtn.classList.remove('active');
    consolePanel.classList.add('hidden');
    consoleToggleBtn.classList.remove('active');
    clearConsole();
    viewEditor.classList.remove('preview-fullscreen');
    fullscreenBtn.title = 'На весь екран';
    fullscreenBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>';
    applyVisibility();
    setLayout('grid');

    viewCatalog.classList.add('hidden');
    viewEditor.classList.remove('hidden');

    // setValue() above triggers 'change' (marks dirty) — clear it now that loading is done
    isDirty = false;
    updateDirtyIndicator();

    requestAnimationFrame(() => {
      refreshAll();
      updatePreview();
      nameInput.focus();
    });
  }

  function closeEditor(){
    viewEditor.classList.add('hidden');
    viewCatalog.classList.remove('hidden');
    renderCatalog();
  }
  backBtn.addEventListener('click', () => {
    if(isDirty && !confirm('Є незбережені зміни. Вийти без збереження?')) return;
    closeEditor();
  });

  function saveProject(){
    const name = nameInput.value.trim();
    if(!name){ alert('Введи назву проєкту'); nameInput.focus(); return false; }

    const projects = loadProjects();
    const data = { name, html: cmHtml.getValue(), css: cmCss.getValue(), js: cmJs.getValue(), fonts: Array.from(usedFonts), updated: Date.now() };

    if(currentEditId){
      const idx = projects.findIndex(p => p.id === currentEditId);
      if(idx !== -1){
        projects[idx] = { ...projects[idx], ...data };
        delete projects[idx].code;
      }
    } else {
      const newId = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      projects.push({ id: newId, created: Date.now(), ...data });
      currentEditId = newId;
    }
    saveProjects(projects);
    isDirty = false;
    updateDirtyIndicator();
    flashSaved();
    return true;
  }

  function flashSaved(){
    const label = saveBtn.querySelector('.save-label');
    const original = label.textContent;
    label.textContent = 'Збережено';
    saveBtn.classList.add('saved-flash');
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(() => {
      label.textContent = original;
      saveBtn.classList.remove('saved-flash');
    }, 1300);
  }

  saveBtn.addEventListener('click', saveProject);

  nameInput.addEventListener('input', () => { isDirty = true; updateDirtyIndicator(); });

  window.addEventListener('beforeunload', (e) => {
    if(!viewEditor.classList.contains('hidden') && isDirty){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && !viewEditor.classList.contains('hidden')){
      e.preventDefault();
      saveProject();
    }
  });

  // ---------- Import files ----------
  const importBtn = document.getElementById('import-btn');
  const importInput = document.getElementById('import-input');
  importBtn.addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', async () => {
    const files = Array.from(importInput.files || []);
    if(!files.length) return;
    const imported = [];
    for(const file of files){
      const ext = file.name.split('.').pop().toLowerCase();
      const text = await file.text();
      if(ext === 'html' || ext === 'htm'){ cmHtml.setValue(text); imported.push('HTML'); }
      else if(ext === 'css'){ cmCss.setValue(text); imported.push('CSS'); }
      else if(ext === 'js'){ cmJs.setValue(text); imported.push('JS'); }
    }
    importInput.value = '';
    settingsPanel.classList.add('hidden');
    settingsBtn.classList.remove('active');
    updatePreview();
    if(!imported.length) alert('Підтримуються тільки файли .html, .css, .js');
  });

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape' || viewEditor.classList.contains('hidden')) return;
    if(!settingsPanel.classList.contains('hidden')){
      settingsPanel.classList.add('hidden');
      settingsBtn.classList.remove('active');
    } else if(viewEditor.classList.contains('preview-fullscreen')){
      fullscreenBtn.click();
    } else {
      if(isDirty && !confirm('Є незбережені зміни. Вийти без збереження?')) return;
      closeEditor();
    }
  });

  renderCatalog();
</script>

</body>
</html>
