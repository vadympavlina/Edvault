<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TextCraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6BF4'/%3E%3Cpath d='M8 10h16M8 14h12M8 18h14M8 22h10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f8;
  --surface:#ffffff;
  --text:#1b1e24;
  --muted:#6b7280;
  --subtle:#9aa1ae;
  --border:#e6e8ec;
  --border2:#d8dbe2;
  --accent:#4f6bf4;
  --accent-h:#3d56d6;
  --accent-bg:#eef1fe;
  --accent-lt:#c9d2fc;
  --danger:#e0454f;
  --warn:#d97706;
  --success:#16a34a;
  --r:6px;
  --r-lg:10px;
  --topbar-h:52px;
  --toolbar-h:44px;
  --statusbar-h:28px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}

/* ═══ scrollbars ═══ */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d3d6dd;border-radius:10px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#b7bbc6;background-clip:content-box}

/* ═══════════ TOPBAR ═══════════ */
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  padding:0 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:15px;height:15px;color:#fff}
.doc-name{
  flex:1;min-width:0;
  font-size:15px;font-weight:600;color:var(--text);
  border:none;outline:none;background:transparent;
  padding:6px 8px;border-radius:var(--r);
  max-width:420px;
}
.doc-name:hover,.doc-name:focus{background:var(--bg)}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.save-label{font-size:12px;color:var(--subtle);display:flex;align-items:center;gap:5px;white-space:nowrap}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;transition:background .15s}
.save-dot.saving{background:var(--warn)}
.save-dot.error{background:var(--danger)}
.save-label.error{color:var(--danger);font-weight:600}

.btn{
  display:flex;align-items:center;gap:6px;
  height:32px;padding:0 13px;
  border-radius:var(--r);border:1px solid transparent;
  font-size:13px;font-weight:500;
  background:transparent;color:var(--text);
  white-space:nowrap;
  transition:background .13s,border-color .13s;
}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-outline{background:var(--accent-bg);border-color:var(--accent-lt);color:var(--accent-h)}
.btn-outline:hover{background:#e1e6fd}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fdedee;border-color:#f5b8bd;color:var(--danger)}
.btn-danger:hover{background:#fbdde0;border-color:#efa0a7}
.btn-icon{width:32px;padding:0;justify-content:center}

/* ═══════════ TOOLBAR ═══════════ */
.toolbar-wrap{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.toolbar{
  height:var(--toolbar-h);
  display:flex;align-items:center;gap:3px;
  padding:0 10px;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}
.tb{
  display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;flex-shrink:0;
  border-radius:6px;border:1px solid transparent;
  background:transparent;color:var(--muted);
  position:relative;
  transition:background .12s,color .12s,border-color .12s;
}
.tb svg{width:15px;height:15px}
.tb:hover{background:var(--bg);color:var(--text)}
.tb.on{background:var(--accent-bg);border-color:var(--accent-lt);color:var(--accent)}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 5px;flex-shrink:0}
.tb-select{
  height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;
  flex-shrink:0;outline:none;
}
.tb-select:hover{border-color:var(--border2)}
.size-ctrl{
  display:flex;align-items:center;gap:1px;flex-shrink:0;
  height:30px;padding:0 2px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
}
.size-btn{
  width:22px;height:24px;border:none;border-radius:4px;background:transparent;color:var(--muted);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.size-btn:hover{background:var(--bg);color:var(--text)}
.size-val{width:22px;text-align:center;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0;user-select:none}

/* Dropdown wrap shared by callout/table pickers.
   position:fixed + JS-computed coordinates (in toggleDropdown), same fix as
   the tooltip: the toolbar scrolls horizontally (overflow-x:auto), which
   forces the browser to also clip the vertical axis, so an absolutely
   positioned panel anchored inside it was being cut off/invisible instead
   of dropping down below the button. */
.tb-dd-wrap{flex-shrink:0}
.dd-panel{
  display:none;position:fixed;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 10px 28px rgba(20,22,38,.14);
  z-index:5000;padding:6px;
}
.dd-panel.open{display:block}
.callout-item{
  display:flex;align-items:center;gap:10px;
  width:220px;padding:8px 10px;border-radius:7px;border:none;background:transparent;
  text-align:left;font-size:13.5px;color:var(--text);
}
.callout-item:hover{background:var(--bg)}
.callout-item-icon{
  width:26px;height:26px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}

.grid-picker{padding:8px}
.grid-picker-cells{display:grid;grid-template-columns:repeat(8,16px);grid-gap:3px}
.grid-cell{width:16px;height:16px;border-radius:2px;background:var(--bg);border:1px solid var(--border)}
.grid-cell.on{background:var(--accent-lt);border-color:var(--accent)}
.grid-picker-label{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* ═══════════ APP BODY / TOC SIDEBAR ═══════════ */
.app-body{flex:1;display:flex;min-height:0;overflow:hidden}
.toc-sidebar{
  width:230px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.toc-header{
  padding:14px 16px 10px;font-size:11px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;color:var(--subtle);flex-shrink:0;
}
.toc-list{flex:1;overflow-y:auto;padding:0 8px 16px}
.toc-empty{padding:8px;font-size:12.5px;color:var(--subtle);line-height:1.5}
.toc-item{
  display:block;width:100%;text-align:left;
  padding:6px 10px;margin-bottom:1px;border-radius:6px;border:none;background:transparent;
  font-size:13px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toc-item:hover{background:var(--bg);color:var(--text)}
.toc-item.toc-h1{font-weight:600;color:var(--text)}
.toc-item.toc-h2{padding-left:20px}
.toc-item.toc-h3{padding-left:32px;font-size:12.5px}
@media(max-width:820px){
  .toc-sidebar{position:fixed;top:var(--topbar-h);bottom:0;left:0;z-index:400;transform:translateX(-100%);transition:transform .18s;box-shadow:4px 0 20px rgba(20,22,38,.12)}
  .toc-sidebar.open{transform:translateX(0)}
}
.toc-toggle-btn{display:none}
@media(max-width:820px){.toc-toggle-btn{display:flex}}

/* ═══════════ EDITOR ═══════════ */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.page-wrap{width:88%;max-width:1400px;margin:0 auto;padding:40px 0 200px}
.page{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(20,22,38,.04);
  padding:56px 64px;
}
@media(max-width:680px){.page{padding:32px 22px}.page-wrap{width:100%;padding:16px 10px 160px}}

.editor{
  outline:none;
  font-family:'Source Serif 4',Georgia,serif;
  font-size:17px;line-height:1.7;color:var(--text);
  min-height:60vh;
  caret-color:var(--accent);
}
.editor::selection,.editor *::selection{background:rgba(79,107,244,.22)}
.editor h1{font-family:'Inter',sans-serif;font-size:2em;font-weight:700;line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
.editor h2{font-family:'Inter',sans-serif;font-size:1.5em;font-weight:700;line-height:1.3;margin:1.1em 0 .5em}
.editor h3{font-family:'Inter',sans-serif;font-size:1.2em;font-weight:600;line-height:1.35;margin:1em 0 .4em}
.editor h1:first-child,.editor h2:first-child,.editor h3:first-child{margin-top:0}
.editor p{margin:0 0 .7em}
.editor ul,.editor ol{padding-left:1.5em;margin:0 0 .7em}
.editor li{margin-bottom:.3em}
.editor a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(79,107,244,.4);text-underline-offset:2px}
.editor a:hover{text-decoration-color:var(--accent)}
.editor b,.editor strong{font-weight:700}
.editor hr{height:1px;border:none;background:var(--border);margin:1.8em 0}
.editor code{
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  background:#f0f2f8;border:1px solid var(--border);border-radius:5px;
  padding:2px 6px;font-size:.86em;color:#c0255c;
}

/* ═══════════ CALLOUT ═══════════ */
.editor .callout{
  position:relative;
  display:flex;gap:12px;align-items:flex-start;
  margin:1.1em 0;padding:14px 40px 14px 16px;
  border-radius:var(--r-lg);border:1px solid transparent;
}
.editor .callout-icon{font-size:18px;line-height:1.5;flex-shrink:0;user-select:none}
.editor .callout-body{flex:1;min-width:0;outline:none;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6}
.editor .callout-body p{margin:0 0 .5em}
.editor .callout-body p:last-child{margin-bottom:0}
.editor .callout-body:empty::before{content:'Текст підказки…';color:var(--subtle);pointer-events:none}
.editor .callout-tip{background:#eef1fe;border-color:#c9d2fc}
.editor .callout-success{background:#eafbf1;border-color:#a7e8c3}
.editor .callout-warn{background:#fff8e6;border-color:#fbdd8e}
.editor .callout-error{background:#fdedee;border-color:#f5b8bd}
.editor .callout-note{background:#f5f3ff;border-color:#d9cffb}
.editor .block-remove-btn{
  position:absolute;top:10px;right:10px;
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(0,0,0,.06);color:var(--subtle);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .12s,color .12s;
}
.editor .block-remove-btn svg{width:11px;height:11px}
.editor .block-remove-btn:hover{background:rgba(0,0,0,.14);color:var(--text)}

/* ═══════════ PROMPT / CODE BLOCK (shared "card" look) ═══════════ */
.editor .card-block{
  margin:1.1em 0;border:1px solid var(--border2);border-radius:var(--r-lg);
  background:var(--surface);overflow:hidden;
}
.editor .card-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 8px 7px 12px;background:var(--bg);border-bottom:1px solid var(--border);
}
.editor .card-label{
  display:flex;align-items:center;gap:6px;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;
  color:var(--muted);text-transform:uppercase;user-select:none;
}
.editor .card-label svg{width:13px;height:13px;flex-shrink:0;color:var(--accent)}
.editor .card-head-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.editor .card-copy-btn{
  display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;
  border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--muted);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:500;flex-shrink:0;
  transition:all .13s;
}
.editor .card-copy-btn svg{width:11px;height:11px;flex-shrink:0}
.editor .card-copy-btn:hover{background:var(--bg);color:var(--text);border-color:var(--accent-lt)}
.editor .card-copy-btn.copied{color:var(--success);border-color:#a7e8c3;background:#eafbf1}
.editor .card-copy-btn.copy-failed{color:var(--warn);border-color:#fbdd8e;background:#fff8e6}
.editor .card-head .block-remove-btn{position:static;opacity:1;background:transparent}
.editor .card-head .block-remove-btn:hover{background:rgba(0,0,0,.08)}
.editor .card-body{padding:13px 15px;outline:none}
.editor .prompt-body{font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
.editor .prompt-body:empty::before{content:'Текст промпту…';color:var(--subtle);pointer-events:none}
.editor .code-body{
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  font-size:13.5px;line-height:1.6;white-space:pre;overflow-x:auto;tab-size:2;
}
.editor .code-body:empty::before{content:'// код…';color:var(--subtle);pointer-events:none;font-family:'Inter',sans-serif}

/* ═══════════ TABLE ═══════════ */
.editor table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14.5px}
.editor td,.editor th{border:1px solid var(--border2);padding:8px 10px;min-width:60px;outline:none;vertical-align:top}
.editor th{background:var(--bg);font-weight:600;text-align:left}
.editor tr:first-child td{background:var(--bg);font-weight:600}

/* ═══════════ IMAGE ═══════════ */
.editor .img-wrap{position:relative;display:inline-block;max-width:100%}
.editor p:has(> .img-wrap){text-align:center}
.editor .img-wrap img{max-width:100%;border-radius:var(--r);display:block;margin:0 auto}
.editor .img-wrap.selected img{outline:2px solid var(--accent);outline-offset:2px}
.editor .img-wrap .img-cap{
  text-align:center;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--subtle);
  margin-top:6px;outline:none;
}
.editor .img-wrap .img-cap:empty::before{content:'Підпис до зображення (необов’язково)';color:var(--subtle);pointer-events:none}

.img-toolbar{
  display:none;position:fixed;z-index:600;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 10px 24px rgba(20,22,38,.14);
  padding:4px;gap:2px;align-items:center;
}
.img-toolbar.visible{display:flex}
.img-tb-btn{
  display:flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:6px;border:none;background:transparent;color:var(--muted);
}
.img-tb-btn svg{width:14px;height:14px}
.img-tb-btn:hover{background:var(--bg);color:var(--text)}
.img-tb-btn.on{background:var(--accent-bg);color:var(--accent)}
.img-tb-sep{width:1px;height:18px;background:var(--border);margin:0 3px}

/* ═══════════ TABLE CONTEXT BAR ═══════════ */
.table-bar{
  display:none;position:fixed;z-index:600;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 10px 24px rgba(20,22,38,.14);padding:4px;gap:2px;align-items:center;
}
.table-bar.visible{display:flex}
.tbar-btn{
  display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;
  border-radius:6px;border:none;background:transparent;color:var(--muted);
  font-size:11.5px;font-weight:500;white-space:nowrap;
}
.tbar-btn svg{width:13px;height:13px;flex-shrink:0}
.tbar-btn:hover{background:var(--bg);color:var(--text)}
.tbar-btn.danger:hover{background:#fdedee;color:var(--danger)}

/* ═══════════ FLOATING SELECTION TOOLBAR ═══════════ */
.sel-toolbar{
  display:none;position:fixed;z-index:8000;
  background:#20222c;border-radius:9px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  padding:4px 5px;gap:1px;align-items:center;white-space:nowrap;
  transform:translateX(-50%);
}
.sel-toolbar.visible{display:flex}
.sel-toolbar::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#20222c;
}
.sel-btn{
  width:29px;height:28px;border:none;border-radius:5px;background:transparent;
  color:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;
  transition:background .1s,color .1s;
}
.sel-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.sel-btn.active{background:rgba(255,255,255,.2);color:#fff}
.sel-btn svg{width:14px;height:14px}
.sel-sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 2px;flex-shrink:0}

/* ═══════════ MODALS ═══════════ */
.overlay{
  display:none;position:fixed;inset:0;z-index:9000;
  background:rgba(20,22,38,.4);align-items:center;justify-content:center;padding:20px;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);
  box-shadow:0 24px 56px rgba(20,22,38,.2);
  width:100%;max-width:420px;padding:22px;
}
.modal h3{margin:0 0 14px;font-size:15px;font-weight:600}
.modal-inp{
  width:100%;height:38px;border-radius:var(--r);border:1px solid var(--border2);
  padding:0 12px;font-size:14px;outline:none;background:var(--bg);margin-bottom:10px;
}
.modal-inp:focus{border-color:var(--accent);background:var(--surface)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.modal-btn{height:34px;padding:0 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);font-size:13px;font-weight:500}
.modal-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-btn.primary:hover{background:var(--accent-h)}
.modal-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.modal-btn.danger:hover{background:#c73139}
.modal-btn:hover{background:var(--bg)}

/* ═══════════ STATUS BAR ═══════════ */
.statusbar{
  height:var(--statusbar-h);flex-shrink:0;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:var(--surface);border-top:1px solid var(--border);
  font-size:11.5px;color:var(--subtle);font-weight:500;
}
.sb-save-label{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════ TOOLTIPS ═══════════ */
/* A single fixed-position tooltip driven by JS (see script), not CSS
   ::after on the buttons — the toolbar scrolls horizontally
   (overflow-x:auto), and setting overflow on just one axis makes browsers
   force the other axis to clip too, so a ::after bubble popping out of a
   toolbar button was being cut off instead of shown. */
#jsTooltip{
  display:none;position:fixed;z-index:9000;
  background:#20222c;color:#fff;font-size:11.5px;font-weight:500;
  padding:5px 9px;border-radius:6px;white-space:nowrap;
  pointer-events:none;transform:translateX(-50%);
}
#jsTooltip.visible{display:block}

/* ═══════════ TOUCH TARGETS ═══════════ */
@media(pointer:coarse){
  .tb{width:36px;height:36px}
  .tb svg{width:16px;height:16px}
  .toolbar{gap:4px}
  .sel-btn{width:34px;height:32px}
  .block-remove-btn{width:26px;height:26px}
  .img-tb-btn{width:32px;height:32px}
  .size-btn{width:28px;height:28px;font-size:17px}
  .size-ctrl{height:34px}
}

/* ═══════════ RESPONSIVE TOPBAR ═══════════ */
@media(max-width:560px){
  .doc-name{max-width:150px;font-size:14px}
  .save-label{display:none}
}
</style>
</head>
<body>

<script>
'use strict';
const editor = document.getElementById('editor');
const STORE_KEY = 'textcraft2_doc';
const STORE_TITLE = 'textcraft2_title';

/* ═══════════════════════════ CORE EXEC ═══════════════════════════ */
function exec(cmd, val) {
  editor.focus();
  document.execCommand(cmd, false, val);
  tick();
  syncState();
}

// Ensures there is always a usable selection inside #editor before an
// execCommand call. If a click (e.g. on a toolbar dropdown) briefly stole
// focus/selection, falls back to the end of the document instead of an
// unpredictable browser default.
function ensureSelectionInEditor() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {

/* ═══════════════════════════ BLOCK STYLE ═══════════════════════════ */

/* ═══════════════════════════ FONT SIZE ═══════════════════════════
   Wraps the selection in a <span style="font-size:…">, routed through
   execCommand so it's undo-safe, and re-selects the freshly wrapped span
   afterward (via a temporary marker attribute) so repeated +/- clicks keep
   growing/shrinking the same text instead of losing the selection after
   the first click. */

  const node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;

  const range = sel.getRangeAt(0);
  const frag = range.cloneContents();
  const tmp = document.createElement('div');
  tmp.appendChild(frag);
  const marker = 'fs' + (++sizeWrapSeq);
  const html = '<span style="font-size:' + px + 'px" data-size-marker="' + marker + '">' + tmp.innerHTML + '</span>';
  document.execCommand('insertHTML', false, html);
  const span = editor.querySelector('[data-size-marker="' + marker + '"]');
  if (span) {
    span.removeAttribute('data-size-marker');
    const r = document.createRange();
    r.selectNodeContents(span);
    sel.removeAllRanges(); sel.addRange(r);
  }

}
function selInlineCode() { doInlineCodeToggle(); hideSelToolbar(); }

function doInlineCodeToggle() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  editor.focus();
  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  const existingCode = el ? el.closest('code') : null;

  if (existingCode && editor.contains(existingCode) && !existingCode.closest('pre, .code-body')) {
    const parent = existingCode.parentNode;
    const frag = document.createDocumentFragment();
    let first = existingCode.firstChild, last = existingCode.lastChild;
    while (existingCode.firstChild) frag.appendChild(existingCode.firstChild);
    parent.replaceChild(frag, existingCode);
    if (first && last) {
      const r = document.createRange();
      r.setStartBefore(first); r.setEndAfter(last);
      sel.removeAllRanges(); sel.addRange(r);
    }
    tick(); syncState();
    return;
  }

  if (range.collapsed) {
    document.execCommand('insertHTML', false, '<code>\u200b</code>');
    const sel2 = window.getSelection();
    if (sel2 && sel2.rangeCount) {
      const n = sel2.getRangeAt(0).startContainer;
      const codeEl = (n.nodeType === 3 ? n.parentElement : n)?.closest('code');
      if (codeEl && codeEl.firstChild) {
        const r2 = document.createRange();
        r2.setStart(codeEl.firstChild, 1); r2.collapse(true);
        sel2.removeAllRanges(); sel2.addRange(r2);
      }
    }

    const text = range.toString();
    const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    document.execCommand('insertHTML', false, '<code>' + escaped + '</code>');
  }
  tick(); syncState();

/* ═══════════════════════════ HR ═══════════════════════════ */

// Finds the direct child of #editor that contains the current caret,
// however deeply nested (inside a list, table, callout...) it actually is.
// Used as a guaranteed-correct anchor to insert new top-level blocks next
// to, sidestepping execCommand's browser-dependent "preserve context"
// behavior near lists/tables/callouts.

  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const startNode = sel.getRangeAt(0).startContainer;
  let top = startNode.nodeType === 3 ? startNode.parentElement : startNode;
  while (top && top.parentElement && top.parentElement !== editor) top = top.parentElement;
  return (top && top.parentElement === editor) ? top : null;
}

/* ═══════════════════════════ SHARED BLOCK INSERTION ═══════════════════════════
   Used by callout / prompt-block / code-block. Finds the top-level element
   (a direct child of #editor) that contains the current caret — however
   deeply nested inside a list, table, or another callout/card that caret
   actually is — and inserts the new block as a plain DOM sibling right
   after it.

   This used to go through execCommand('insertHTML') after trying to
   pre-detect and break out of list/table/callout containers. That worked
   for the simple case, but a selection that starts *inside* content that's
   already nested two or three levels deep (e.g. selecting text that begins
   inside an existing callout's own numbered list) could still end up with
   the browser "preserving context" and wrapping the whole new block in
   list numbering — because execCommand decides that on its own, based on
   where the browser thinks editing is happening, not where we've told it
   to break out to. Walking the DOM ourselves and inserting directly sides
   steps that guesswork entirely: it is always correct, for any nesting
   depth. Trade-off: this insertion step itself isn't on the undo stack
   (same trade-off already made for other structural operations here). */

  editor.focus();
  restoreCursor();
  ensureSelectionInEditor();
  const anchor = findTopLevelAnchor();
  const afterP = document.createElement('p');
  afterP.innerHTML = '<br>';
  if (anchor) anchor.after(el, afterP);
  else { editor.appendChild(el); editor.appendChild(afterP); }
  tick();
}

/* ═══════════════════════════ HONEST COPY-TO-CLIPBOARD ═══════════════════════════

   embedded pages sometimes block both the Clipboard API and

   ═══════════════════════════════════════════════════════════════════════ */

  const card = btn.closest('.card-block');
  const body = card ? card.querySelector('.prompt-body, .code-body') : null;
  if (!body) return;
  const text = body.innerText || body.textContent || '';
  const defaultHTML = btn.innerHTML;
  const isPrompt = body.classList.contains('prompt-body');
  const label = isPrompt ? 'Копіювати' : 'Копіювати';
  const copyIcon = isPrompt ? ICO_PROMPT : ICO_CODE;

  copyTextWithFeedback(text, btn, {
    copiedHTML: ICO_CHECK + 'Скопійовано',
    defaultHTML: ICO_COPY + label,
    failedHTML: ICO_WARN + 'Виділено — Ctrl+C',
    selectFallbackEl: body

}

function copyTextWithFeedback(text, btn, opts) {

  const setState = (html, cls, ms) => {
    clearTimeout(resetTimer);
    btn.classList.remove('copied', 'copy-failed');
    if (cls) btn.classList.add(cls);
    btn.innerHTML = html;
    if (ms) resetTimer = setTimeout(() => { btn.classList.remove(cls); btn.innerHTML = opts.defaultHTML; }, ms);
  };
  const onSuccess = () => setState(opts.copiedHTML, 'copied', 1800);
  const onFail = () => {
    setState(opts.failedHTML, 'copy-failed', 2800);
    if (opts.selectFallbackEl) selectElementText(opts.selectFallbackEl);

    navigator.clipboard.writeText(text).then(onSuccess).catch(() => {

    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  } catch(e) {}
}

/* ═══════════════════════════ FLOATING SELECTION TOOLBAR ═══════════════════════════ */

selToolbar.addEventListener('mousedown', e => e.preventDefault());

function updateSelToolbar() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelToolbar(); return; }
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) { hideSelToolbar(); return; }
  const rect = range.getBoundingClientRect();
  if (rect.width === 0 && rect.height === 0) { hideSelToolbar(); return; }

  selToolbar.classList.add('visible');
  const barRect = selToolbar.getBoundingClientRect();
  let top = rect.top - barRect.height - 10;
  let left = rect.left + rect.width / 2;
  if (top < 8) top = rect.bottom + 10;
  left = Math.max(barRect.width / 2 + 8, Math.min(left, window.innerWidth - barRect.width / 2 - 8));
  selToolbar.style.top = top + 'px';
  selToolbar.style.left = left + 'px';

  const node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  document.getElementById('sel-bold').classList.toggle('active', document.queryCommandState('bold'));
  document.getElementById('sel-italic').classList.toggle('active', document.queryCommandState('italic'));
  document.getElementById('sel-underline').classList.toggle('active', document.queryCommandState('underline'));
  document.getElementById('sel-strike').classList.toggle('active', document.queryCommandState('strikeThrough'));
  const inPre = el ? !!el.closest('.code-body, pre') : false;
  document.getElementById('sel-code').classList.toggle('active', !inPre && !!(el && el.closest('code')));
}

// floating bars would otherwise steal focus/selection from #editor first,
// which is why "Видалити зображення" silently did nothing before this.
tableBar.addEventListener('mousedown', e => e.preventDefault());
function updateTableBar() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) { hideTableBar(); return; }
  const node = sel.getRangeAt(0).commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  const table = el ? el.closest('table') : null;
  if (table && editor.contains(table)) {
    currentTable = table;
    tableBar.classList.add('visible');
    positionTableBar();
  } else {
    hideTableBar();
  }
}
function positionTableBar() {
  if (!currentTable) return;
  const rect = currentTable.getBoundingClientRect();
  tableBar.style.top = (rect.top - tableBar.offsetHeight - 8) + 'px';
  tableBar.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - tableBar.offsetWidth - 8)) + 'px';
}
function hideTableBar() { tableBar.classList.remove('visible'); currentTable = null; }
document.getElementById('scrollArea').addEventListener('scroll', () => {
  if (currentTable) positionTableBar();
}, { passive: true });

function tableAction(action) {
  if (!currentTable) return;
  const sel = window.getSelection();
  const node = sel.rangeCount ? sel.getRangeAt(0).commonAncestorContainer : null;
  const el = node ? (node.nodeType === 3 ? node.parentElement : node) : null;
  const cell = el ? el.closest('td, th') : null;
  const row = cell ? cell.closest('tr') : currentTable.querySelector('tr');

  if (action === 'addRow') {
    const cols = row.children.length;
    const newRow = document.createElement('tr');
    for (let i = 0; i < cols; i++) newRow.appendChild(document.createElement('td')).innerHTML = '<br>';
    row.after(newRow);
  } else if (action === 'delRow') {
    if (currentTable.querySelectorAll('tr').length > 1) row.remove(); else { currentTable.closest('table').remove(); hideTableBar(); }
  } else if (action === 'addCol') {
    const idx = cell ? [...row.children].indexOf(cell) : 0;
    currentTable.querySelectorAll('tr').forEach(tr => {
      const newCell = document.createElement(tr.children[0]?.tagName === 'TH' ? 'th' : 'td');
      newCell.innerHTML = '<br>';
      if (tr.children[idx]) tr.children[idx].after(newCell); else tr.appendChild(newCell);
    });
  } else if (action === 'delCol') {
    if (!cell) return;
    const idx = [...row.children].indexOf(cell);
    if (row.children.length <= 1) { currentTable.remove(); hideTableBar(); return; }
    currentTable.querySelectorAll('tr').forEach(tr => { if (tr.children[idx]) tr.children[idx].remove(); });
  } else if (action === 'delTable') {
    currentTable.remove();
    hideTableBar();
  }
  tick();
}

// Tab / Shift+Tab moves between table cells instead of leaving the editor.
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const node = sel.getRangeAt(0).commonAncestorContainer;
    const el = node.nodeType === 3 ? node.parentElement : node;
    const cell = el ? el.closest('td, th') : null;
    if (cell) {
      e.preventDefault();
      // Derive the table from the cell itself rather than the global
      // currentTable (set on mouseup/keyup elsewhere) — with more than one
      // table in the document that variable could be stale, silently
      // breaking Tab navigation in every table but the last one touched.
      const table = cell.closest('table');
      const cells = [...(table ? table.querySelectorAll('td, th') : [])];
      let idx = cells.indexOf(cell);
      let target = e.shiftKey ? cells[idx - 1] : cells[idx + 1];
      if (target) focusAndPlaceCaretEnd(target);
    }
  }
});

/* ═══════════════════════════ IMAGE ═══════════════════════════ */
function triggerImageInsert() {
  saveCursor();
  document.getElementById('imgFileInput').click();
}
function insertImageFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const range = savedRange; savedRange = null;
  downscaleImageFile(file).then(dataUrl => {
    if (!dataUrl) return;
    const wrap = insertImageAtRange(dataUrl, range);
    if (wrap) selectImgWrap(wrap);
    tick();
  });
  input.value = '';
}

// Large photos (phone cameras routinely produce 4000px+ images, several MB
// each as base64) were the main way people hit the localStorage quota error
// — a single embedded photo could eat most of the ~5-10MB budget by itself.
// Downscale anything wider/taller than 1600px before it ever becomes a data
// URL; leave smaller images untouched (re-encoding a small image can only
// make it larger or blurrier for no benefit).
function downscaleImageFile(file) {
  const MAX_DIM = 1600;
  return new Promise(resolve => {
    // Vector images have no fixed pixel size to downscale, and canvas can
    // only export to raster formats — asking it for 'image/svg+xml' back
    // out would just silently produce a PNG instead (per spec, an
    // unsupported toDataURL type falls back to PNG), throwing away the
    // whole point of it being a vector. Keep SVGs untouched.
    if (file.type === 'image/svg+xml') {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const original = e.target.result;
      const img = new Image();
      img.onload = () => {
        if (img.width <= MAX_DIM && img.height <= MAX_DIM) { resolve(original); return; }
        try {
          const scale = MAX_DIM / Math.max(img.width, img.height);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          resolve(canvas.toDataURL(mime, 0.86));
        } catch (err) {
          resolve(original); // canvas failed (e.g. tainted/unsupported) — fall back to the original
        }
      };
      img.onerror = () => resolve(original);
      img.src = original;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// Routed through execCommand so it lands on the undo stack — direct
// range.insertNode() is invisible to most browsers' undo history.
function insertImageAtRange(dataUrl, range) {
  editor.focus();
  const sel = window.getSelection();
  if (range) { sel.removeAllRanges(); sel.addRange(range); }
  else ensureSelectionInEditor();
  const anchor = findTopLevelAnchor();

  const p = document.createElement('p');
  p.style.textAlign = 'center';
  const wrap = document.createElement('div');
  wrap.className = 'img-wrap';
  const img = document.createElement('img');
  img.src = dataUrl;
  const cap = document.createElement('div');
  cap.className = 'img-cap';
  cap.contentEditable = 'true';
  wrap.appendChild(img);
  wrap.appendChild(cap);
  p.appendChild(wrap);
  const afterP = document.createElement('p');
  afterP.innerHTML = '<br>';
  if (anchor) anchor.after(p, afterP);
  else { editor.appendChild(p); editor.appendChild(afterP); }
  return wrap;
}

let selectedImgWrap = null;
const imgToolbar = document.getElementById('imgToolbar');
imgToolbar.addEventListener('mousedown', e => e.preventDefault());
function positionImgToolbar() {
  if (!selectedImgWrap) return;
  const rect = selectedImgWrap.getBoundingClientRect();
  if (rect.bottom < 0 || rect.top > window.innerHeight) { deselectImg(); return; }
  imgToolbar.style.top = (rect.top - imgToolbar.offsetHeight - 8) + 'px';
  imgToolbar.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - imgToolbar.offsetWidth / 2, window.innerWidth - imgToolbar.offsetWidth - 8)) + 'px';
}
function selectImgWrap(wrap) {
  deselectImg();
  selectedImgWrap = wrap;
  wrap.classList.add('selected');
  imgToolbar.classList.add('visible');
  syncImgToolbarState();
  positionImgToolbar();
}
function deselectImg() {
  if (selectedImgWrap) selectedImgWrap.classList.remove('selected');
  selectedImgWrap = null;
  imgToolbar.classList.remove('visible');
}
function syncImgToolbarState() {
  if (!selectedImgWrap) return;
  const w = selectedImgWrap.style.width || '';
  document.querySelectorAll('.img-tb-btn[data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === w));
  const align = (selectedImgWrap.closest('p') || {}).style?.textAlign || 'center';
  document.querySelectorAll('.img-tb-btn[data-align]').forEach(b => b.classList.toggle('on', b.dataset.align === align));
}
function setImgWidth(btn) {
  if (!selectedImgWrap) return;
  selectedImgWrap.style.width = btn.dataset.w;
  syncImgToolbarState();
  positionImgToolbar();
  tick();
}
function setImgAlign(btn) {
  if (!selectedImgWrap) return;
  const p = selectedImgWrap.closest('p');
  if (p) p.style.textAlign = btn.dataset.align;
  syncImgToolbarState();
  positionImgToolbar();
  tick();
}
function deleteSelectedImg() {
  if (!selectedImgWrap) return;
  const wrap = selectedImgWrap;
  editor.focus();
  const p = wrap.closest('p') || wrap;
  const r = document.createRange();
  r.selectNode(p);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  document.execCommand('delete');
  deselectImg();
  tick();
}
editor.addEventListener('click', e => {
  const wrap = e.target.closest('.img-wrap');
  if (wrap && editor.contains(wrap)) { selectImgWrap(wrap); }
  else if (!e.target.closest('.img-toolbar')) { deselectImg(); }
});
document.getElementById('scrollArea').addEventListener('scroll', () => {
  if (selectedImgWrap) positionImgToolbar();
}, { passive: true });

// Drag & drop images
editor.addEventListener('dragover', e => e.preventDefault());
editor.addEventListener('drop', e => {
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  let dropRange = null;
  if (document.caretRangeFromPoint) dropRange = document.caretRangeFromPoint(e.clientX, e.clientY);
  files.forEach(file => {
    downscaleImageFile(file).then(dataUrl => {
      if (!dataUrl) return;
      const wrap = insertImageAtRange(dataUrl, dropRange);
      dropRange = null;
      if (wrap) selectImgWrap(wrap);
      tick();
    });
  });
});

/* ═══════════════════════════ LINK MODAL ═══════════════════════════ */
let linkSavedRange = null;
function openLinkModal() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
    linkSavedRange = sel.getRangeAt(0).cloneRange();
    document.getElementById('linkText').value = sel.toString();
  } else {
    linkSavedRange = null;
    document.getElementById('linkText').value = '';
  }
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkOverlay').classList.add('open');
  setTimeout(() => document.getElementById('linkUrl').focus(), 30);
}
function closeLinkModal() {
  document.getElementById('linkOverlay').classList.remove('open');
  linkSavedRange = null;
}
function confirmLink() {
  let url = document.getElementById('linkUrl').value.trim();
  const text = document.getElementById('linkText').value.trim() || url;
  if (!url) { closeLinkModal(); return; }
  if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = 'https://' + url;
  editor.focus();
  if (linkSavedRange) {
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(linkSavedRange);
  } else {
    ensureSelectionInEditor();
  }
  const safeText = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const safeUrl = url.replace(/"/g,'&quot;');
  document.execCommand('insertHTML', false, '<a href="' + safeUrl + '" target="_blank" rel="noopener">' + safeText + '</a>');
  tick();
  closeLinkModal();
}

/* ═══════════════════════════ KEYDOWN: NESTED BLOCKS ═══════════════════════════
   Callout / prompt / code bodies are contenteditable="true" islands inside a
   contenteditable="false" wrapper (needed so clicking the block doesn't let
   you type over its chrome). That nesting has two classic failure modes if
   you don't handle it explicitly:
     - Enter: closest('[contenteditable="false"]') matches the OUTER wrapper
       even when the caret is inside the "true" island, because closest()
       walks ancestors regardless of what's in between — so Enter could kick
       you OUT of the block instead of adding a line inside it. Fix: check
       the *nearest* [contenteditable] ancestor specifically.
     - Backspace at the very start of an empty body: browsers are
       inconsistent here (stuck caret, or the block corrupted). Handle it
       explicitly and only when the body is genuinely empty (not just
       "nothing before the cursor" — that distinction matters, otherwise
       Home+Backspace on a block you already typed into would delete it).
   ═══════════════════════════════════════════════════════════════════════ */
editor.addEventListener('keydown', e => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range0 = sel.getRangeAt(0);
  const node = range0.startContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;

  // Tab inside a code block — insert a literal tab, don't leave the editor
  if (e.key === 'Tab') {
    const codeBody = el ? el.closest('.code-body') : null;
    if (codeBody) {
      e.preventDefault();
      document.execCommand('insertText', false, '\t');
      return;
    }
  }

  if (e.key === 'Enter' && !e.shiftKey) {
    // Plain newline inside a code block — no <div>/<p> splitting
    const codeBody = el ? el.closest('.code-body') : null;
    if (codeBody) {
      e.preventDefault();
      document.execCommand('insertText', false, '\n');
      return;
    }

    const nearestCE = el ? el.closest('[contenteditable]') : null;
    const nonEditable = (nearestCE && nearestCE.getAttribute('contenteditable') === 'false') ? nearestCE : null;
    if (nonEditable && editor.contains(nonEditable)) {
      let target = nonEditable;
      while (target.parentElement && target.parentElement !== editor) target = target.parentElement;
      if (target.parentElement === editor) {
        e.preventDefault();
        const r = document.createRange();
        r.setStartAfter(target); r.collapse(true);
        sel.removeAllRanges(); sel.addRange(r);
        document.execCommand('insertHTML', false, '<p><br></p>');
        tick();
        return;
      }
    }
  }

  if (e.key === 'Backspace' && sel.isCollapsed) {
    // Empty list item — toggle the list off natively instead of relying on
    // inconsistent default behavior at the list boundary.
    const li = el ? el.closest('li') : null;
    if (li && editor.contains(li)) {
      const pre = document.createRange();
      pre.selectNodeContents(li);
      pre.setEnd(range0.startContainer, range0.startOffset);
      if (pre.toString().length === 0 && (li.textContent || '').trim().length === 0) {
        e.preventDefault();
        const list = li.closest('ol, ul');
        if (list) document.execCommand(list.tagName === 'OL' ? 'insertOrderedList' : 'insertUnorderedList', false, null);
        tick();
        return;
      }
    }

    // Empty callout/prompt/code body — remove the whole block cleanly.
    // Gated on the body being *entirely* empty, not just "nothing before
    // the cursor" (that distinction is what prevents a Home+Backspace from
    // deleting a block you'd already typed content into).
    const body = el ? el.closest('.callout-body, .prompt-body, .code-body') : null;
    if (body && editor.contains(body)) {
      const empty = (body.textContent || '').trim().length === 0;
      const block = body.closest('.callout, .card-block');
      if (empty) {
        e.preventDefault();
        if (block) {
          // Direct removal — same reliability reasoning as unwrapSpecialBlock:
          // execCommand('delete') on a selectNode()'d contenteditable="false"
          // block isn't consistently honored by browsers.
          const prevFocus = block.previousElementSibling;
          block.remove();
          tick();
          if (prevFocus) setTimeout(() => focusAndPlaceCaretEnd(prevFocus), 10);
        }
        return;
      }
      // Not empty, but caret is at the very start — unwrap the block into a
      // plain paragraph, keeping the text (same as the block's × button).
      const pre = document.createRange();
      pre.selectNodeContents(body);
      pre.setEnd(range0.startContainer, range0.startOffset);
      if (pre.toString().length === 0 && block) {
        e.preventDefault();
        unwrapSpecialBlock(block);
        return;
      }
    }
  }
});

/* ═══════════════════════════ TOOLBAR STATE SYNC ═══════════════════════════ */
function syncState() {
  try {
    ['bold','italic','underline','strikeThrough'].forEach(cmd => {
      const map = {bold:'btn-bold',italic:'btn-italic',underline:'btn-underline',strikeThrough:'btn-strike'};
      document.getElementById(map[cmd])?.classList.toggle('on', document.queryCommandState(cmd));
    });
    document.getElementById('btn-ul')?.classList.toggle('on', document.queryCommandState('insertUnorderedList'));
    document.getElementById('btn-ol')?.classList.toggle('on', document.queryCommandState('insertOrderedList'));
    document.getElementById('btn-align-left')?.classList.toggle('on', document.queryCommandState('justifyLeft'));
    document.getElementById('btn-align-center')?.classList.toggle('on', document.queryCommandState('justifyCenter'));
    document.getElementById('btn-align-right')?.classList.toggle('on', document.queryCommandState('justifyRight'));

    const sel = window.getSelection();
    if (sel && sel.rangeCount) {
      const node = sel.getRangeAt(0).startContainer;
      const el = node.nodeType === 3 ? node.parentElement : node;
      if (el && editor.contains(el)) {
        const inPre = !!el.closest('.code-body');
        document.getElementById('btn-code')?.classList.toggle('on', !inPre && !!el.closest('code'));

        const bs = document.getElementById('blockStyle');
        if (el.closest('h1')) bs.value = 'h1';
        else if (el.closest('h2')) bs.value = 'h2';
        else if (el.closest('h3')) bs.value = 'h3';
        else bs.value = 'p';

        document.getElementById('sizeVal').textContent = parseInt(getComputedStyle(el).fontSize) || 16;
      }
    }
  } catch(e) {}
}

function doUndo() { editor.focus(); document.execCommand('undo'); tick(); syncState(); }
function doRedo() { editor.focus(); document.execCommand('redo'); tick(); syncState(); }

/* ═══════════════════════════ CONFIRM MODAL ═══════════════════════════
   Not window.confirm() — that's a native blocking dialog, and sandboxed /
   embedded pages (like this one running as a Claude artifact) commonly
   don't have permission to show it: the call either throws or silently
   returns false without ever displaying anything, which made "Очистити
   все" look like it just did nothing. A custom in-page modal has no such
   restriction.
   ═══════════════════════════════════════════════════════════════════════ */
let confirmResolve = null;
function showConfirm(message, danger) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = message;
    const okBtn = document.getElementById('confirmOkBtn');
    okBtn.classList.toggle('danger', !!danger);
    okBtn.classList.toggle('primary', !danger);
    document.getElementById('confirmOverlay').classList.add('open');
  });
}
function closeConfirmModal(result) {
  document.getElementById('confirmOverlay').classList.remove('open');
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

async function clearAll() {
  if (!editor.textContent.trim() && editor.querySelectorAll('img, table, .callout, .card-block').length === 0) return;
  const ok = await showConfirm('Очистити весь документ? Цю дію не можна скасувати.', true);
  if (!ok) return;
  // Direct assignment rather than select-all + execCommand('insertHTML'):
  // with complex embedded contenteditable="false" blocks (callouts, tables,
  // images) in the mix, browsers can handle "replace the entire selection"
  // inconsistently and leave old content behind. Setting innerHTML directly
  // is unconditional and always actually clears it — the trade-off is that
  // this one action isn't on the undo stack.
  editor.innerHTML = '<h1></h1><p><br></p>';
  document.getElementById('docTitle').value = '';
  hideSelToolbar(); deselectImg(); hideTableBar();
  tick();
  editor.focus();
  setTimeout(() => focusAndPlaceCaretEnd(editor.querySelector('h1')), 20);
}

/* ═══════════════════════════ AUTOSAVE ═══════════════════════════ */
let saveTimer = null, statsTimer = null;
let hasUnsavedChanges = false;

function tick() {
  scheduleSave();
  clearTimeout(statsTimer);
  statsTimer = setTimeout(updateStats, 150);
  scheduleToc();
}

/* ═══════════════════════════ TABLE OF CONTENTS ═══════════════════════════ */
let tocTimer = null;
let tocSeq = 0;
// IDs get saved as part of editor.innerHTML (localStorage) and persist
// across reloads, but tocSeq itself resets to 0 every page load — a plain
// incrementing counter could then hand out "toc-h-1" to a brand-new heading
// while an old one from a previous session already has that exact id,
// leaving two elements with the same id (scrollIntoView / lookups become
// ambiguous). A per-session prefix makes new ids never collide with old
// ones, regardless of how many times the page has been reloaded.
const tocSessionId = Date.now().toString(36);
function scheduleToc() {
  clearTimeout(tocTimer);
  tocTimer = setTimeout(buildToc, 350);
}
function buildToc() {
  const headings = editor.querySelectorAll('h1, h2, h3');
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  if (!headings.length) {
    list.innerHTML = '<div class="toc-empty">Заголовки з\u2019являться тут</div>';
    return;
  }
  headings.forEach(h => {
    const text = (h.textContent || '').trim();
    if (!h.id) h.id = 'toc-h-' + tocSessionId + '-' + (++tocSeq);
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'toc-item toc-' + h.tagName.toLowerCase();
    item.textContent = text || '(без назви розділу)';
    item.onmousedown = e => e.preventDefault();
    item.onclick = () => {
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (window.innerWidth <= 820) document.getElementById('tocSidebar').classList.remove('open');
    };
    list.appendChild(item);
  });
}
function toggleTocSidebar() {
  document.getElementById('tocSidebar').classList.toggle('open');
}
function updateStats() {
  const t = editor.innerText || '';
  const w = t.trim() === '' ? 0 : t.trim().split(/\s+/).length;
  const c = t.replace(/\n/g,'').length;
  document.getElementById('sb-w').textContent = 'Слів: ' + w;
  document.getElementById('sb-c').textContent = 'Символів: ' + c;
}
function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveState('saving');
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, editor.innerHTML);
      localStorage.setItem(STORE_TITLE, document.getElementById('docTitle').value);
      setSaveState('saved');
    } catch(e) {
      // Most likely quota exceeded (embedded images push past ~5-10MB) —
      // say so honestly instead of the status bar silently lying.
      setSaveState('error');
    }
  }, 800);
}
function setSaveState(state) {
  hasUnsavedChanges = (state === 'saving' || state === 'error');
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveText');
  const wrap = document.getElementById('saveLabel');
  dot.classList.remove('saving', 'error');
  wrap.classList.remove('error');
  wrap.removeAttribute('title');
  if (state === 'saving') { dot.classList.add('saving'); label.textContent = 'Збереження…'; }
  else if (state === 'error') {
    dot.classList.add('error'); wrap.classList.add('error');
    label.textContent = 'Не збережено — забагато даних';
    wrap.title = 'Локальне сховище браузера переповнене (ймовірно, через зображення). Спробуйте зменшити їх розмір або експортувати документ.';
  } else { label.textContent = 'Збережено'; }
}
window.addEventListener('beforeunload', e => {
  if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ''; }
});

function loadSaved() {
  try {
    const html = localStorage.getItem(STORE_KEY);
    const title = localStorage.getItem(STORE_TITLE);
    if (html) editor.innerHTML = html;
    if (title) document.getElementById('docTitle').value = title;
  } catch(e) {}
  updateStats();
  buildToc();
}

/* ═══════════════════════════ EVENT WIRING ═══════════════════════════ */
editor.addEventListener('input', () => { tick(); });
editor.addEventListener('mouseup', () => { syncState(); updateSelToolbar(); updateTableBar(); });

/* ═══════════════════════════ PASTE ═══════════════════════════ */
editor.addEventListener('paste', e => {
  const cd = e.clipboardData;
  let imgFile = null;
  if (cd) {
    // Check .items first (most browsers), matching on kind==='file' so we
    // don't accidentally skip past it if a non-image item comes first;
    // fall back to .files for browsers/paths that populate that instead.
    if (cd.items) {
      for (const item of cd.items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          imgFile = item.getAsFile();
          if (imgFile) break;
        }
      }
    }
    if (!imgFile && cd.files) {
      for (const f of cd.files) {
        if (f.type.startsWith('image/')) { imgFile = f; break; }
      }
    }
  }
  if (imgFile) {
    e.preventDefault();
    // Capture the caret position now — downscaleImageFile resolves
    // asynchronously (it decodes the image via canvas), and the selection
    // should be pinned to where it was at paste time, not wherever the
    // live selection happens to be once that finishes.
    const sel0 = window.getSelection();
    const pasteRange = (sel0 && sel0.rangeCount && editor.contains(sel0.getRangeAt(0).commonAncestorContainer))
      ? sel0.getRangeAt(0).cloneRange() : null;
    downscaleImageFile(imgFile).then(dataUrl => {
      if (!dataUrl) return;
      const wrap = insertImageAtRange(dataUrl, pasteRange);
      if (wrap) selectImgWrap(wrap);
      tick();
    });
    return;
  }
  // Plain/HTML text — let the browser handle it natively (keeps basic
  // formatting), then just refresh stats/state.
  setTimeout(() => { tick(); syncState(); }, 0);
});

// Used only for the exported file's name and <title> — the topbar name
// field itself stays purely manual (no auto-fill while typing). Falls back
// to the first non-empty line of content only when the person hasn't typed
// a name in that field themselves.
function getDocumentTitle() {
  const manual = document.getElementById('docTitle').value.trim();
  if (manual) return manual;
  for (const child of editor.children) {
    const t = (child.textContent || '').replace(/\s+/g, ' ').trim();
    if (t) return t.slice(0, 80);
  }
  return 'Документ';
}

  clone.querySelectorAll('.img-wrap.selected').forEach(el => el.classList.remove('selected'));
  clone.querySelectorAll('.block-remove-btn').forEach(el => el.remove());

  // Static table of contents — plain <a href="#..."> anchors, so it works
  // in the exported file with zero JS (headings already carry the same
  // ids the live sidebar uses).
  const headings = [...clone.querySelectorAll('h1, h2, h3')];
  let tocHtml;

      if (!h.id) h.id = 'toc-h-export-' + i;

    }).join('');

  }

window.copyCardBlock = function(btn) {
  var card = btn.closest('.card-block');
  var body = card ? card.querySelector('.prompt-body, .code-body') : null;
  if (!body) return;
  var text = body.innerText || body.textContent || '';
  var isPrompt = body.classList.contains('prompt-body');
  var defaultHTML = btn.innerHTML.replace(/Скопійовано|Виділено.*/, isPrompt ? 'Копіювати' : 'Копіювати');
  var origHTML = btn.getAttribute('data-default') || btn.innerHTML;
  btn.setAttribute('data-default', origHTML);
  var showCopied = function() {
    btn.classList.remove('copy-failed'); btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6l3 3 5-5"/></svg>Скопійовано';
    setTimeout(function(){ btn.classList.remove('copied'); btn.innerHTML = btn.getAttribute('data-default'); }, 1800);
  };
  var showFailed = function() {

    btn.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="5"/><line x1="6" y1="3.5" x2="6" y2="6.5"/><circle cx="6" cy="8.5" r=".6" fill="currentColor" stroke="none"/></svg>Виділено — Ctrl+C';

function escapeHTML(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ═══════════════════════════ TOOLTIPS ═══════════════════════════ */
const jsTooltip = document.getElementById('jsTooltip');
let tipTimer = null;
function bindTooltips() {
  document.querySelectorAll('[data-tip]').forEach(el => {
    if (el.dataset.tipBound) return;
    el.dataset.tipBound = '1';
    el.addEventListener('mouseenter', () => {
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => showTooltip(el), 250);
    });
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('mousedown', hideTooltip);
  });
}
function showTooltip(el) {
  const text = el.getAttribute('data-tip');
  if (!text) return;
  jsTooltip.textContent = text;
  jsTooltip.classList.add('visible');
  const rect = el.getBoundingClientRect();
  const tipRect = jsTooltip.getBoundingClientRect();
  let left = rect.left + rect.width / 2;
  left = Math.max(tipRect.width / 2 + 6, Math.min(left, window.innerWidth - tipRect.width / 2 - 6));
  let top = rect.bottom + 8;
  if (top + tipRect.height > window.innerHeight - 6) top = rect.top - tipRect.height - 8;
  jsTooltip.style.left = left + 'px';
  jsTooltip.style.top = top + 'px';
}
function hideTooltip() { clearTimeout(tipTimer); jsTooltip.classList.remove('visible'); }
bindTooltips();
