<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Емулятор Windows · Edvault</title>
<meta name="description" content="Навчальний емулятор Windows: Провідник, Командний рядок, Блокнот і Кошик. Створюйте, перейменовуйте, переміщайте й видаляйте файли — кнопками або командами.">
<link rel="icon" href="/icons/windows-emulator.ico" sizes="32x32">
<link rel="icon" href="/icons/windows-emulator.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/windows-emulator-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="windowsemu/app.css">
</head>
<body>
<main id="desk">
  <div id="icons" tabindex="0" aria-label="Робочий стіл"></div>
</main>

<footer id="taskbar">
  <div class="tb-mid">
    <button class="tb-btn" id="startBtn" title="Пуск (Ctrl+Esc)"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="10.5" y="1" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="1" y="10.5" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1" fill="#0078d4"/></svg></button>
    <button class="tb-btn" id="searchBtn" title="Пошук"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <span id="tbApps"></span>
  </div>
  <div class="tb-right">
    <button class="tb-shield" id="fwTray" title="Безпека Windows"></button><span class="tray" title="Підключено до мережі · Гучність 60%"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.859a10 10 0 0 1 14 0M8.5 16.429a5 5 0 0 1 7 0"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6M19.364 18.364a9 9 0 0 0 0-12.728"/></svg></span>
    <span class="tb-lang" title="Українська (Україна)">УКР</span>
    <span class="tb-clock" id="clock"></span>
  </div>
</footer>

<section id="start" hidden>
  <div class="st-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="stQ" placeholder="Пошук застосунків, файлів і папок" spellcheck="false" autocomplete="off"></div>
  <div class="st-body" id="stBody"></div>
  <div class="st-foot"><span class="st-user"><span class="av">У</span>Учень</span><button class="tb-btn" id="powerBtn" title="Живлення"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button></div>
</section>

<div id="boot" class="on"><svg width="64" height="64" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="10.5" y="1" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="1" y="10.5" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="10.5" y="10.5" width="8.5" height="8.5" fill="#4cc2ff"/></svg><i class="spin"></i><span>Ласкаво просимо</span></div>
<div id="toast"></div>
<script type="module" src="windowsemu/js/main.js"></script>
</body>
</html>
