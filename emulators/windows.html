<head>

<link rel="icon" href="/icons/windows-emulator.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/windows-emulator-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="windowsemu/app.css">
<!-- og -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Edvault">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Емулятор Windows · Edvault">
<meta property="og:description" content="Провідник, командний рядок, Диспетчер завдань, брандмауер, мережа й роутер — пробуйте сміливо, нічого не зламаєте.">
<meta property="og:url" content="https://www.edvault.online/emulators/windows">
<meta property="og:image" content="https://www.edvault.online/assets/og/windows.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Емулятор Windows — Edvault">
<meta name="twitter:card" content="summary_large_image">
<!-- /og -->
</head>
<body>
<div class="small-screen" id="smallScreen" role="alertdialog" aria-modal="true" aria-labelledby="ssT" aria-describedby="ssD" hidden>
  <div class="ss-card">
    <div class="ss-ico" aria-hidden="true">
      <svg width="64" height="50" viewBox="0 0 64 50" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="48" height="32" rx="3"/><path d="M2 44h60l-4-8H6z"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="28" height="40" rx="4"/><path d="M14 36h6"/></svg>
    </div>
    <h1 id="ssT">Емулятор Windows не працює на телефоні</h1>
    <p id="ssD">Екран телефона замалий для вікон, панелі завдань і Провідника. Відкрийте цю сторінку на <b>комп’ютері</b> або <b>планшеті</b>.</p>
    <div class="ss-hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>Ваші файли й налаштування збережуться в тому браузері, де ви працюєте.</span></div>
    <div class="ss-logo"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0067c0" d="M3 3h8.5v8.5H3zM12.5 3H21v8.5h-8.5zM3 12.5h8.5V21H3zM12.5 12.5H21V21h-8.5z"/></svg>Edvault · Емулятор Windows</div>
  </div>
</div>
<main id="desk">
  <div id="icons" tabindex="0" aria-label="Робочий стіл"></div>
</main>

<footer id="taskbar">
  <div class="tb-mid">
    <button class="tb-btn" id="startBtn" title="Пуск (Ctrl+Esc)"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="10.5" y="1" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="1" y="10.5" width="8.5" height="8.5" rx="1" fill="#0078d4"/><rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1" fill="#0078d4"/></svg></button>
    <button class="tb-btn" id="searchBtn" title="Пошук"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <span id="tbApps"></span>
  </div>
  <div class="tb-right">
    <button class="tb-shield" id="fwTray" title="Безпека Windows"></button><button class="tray tb-net" id="netTray" title="Мережа"></button><span class="tray tb-vol" title="Гучність: 60%"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6M19.364 18.364a9 9 0 0 0 0-12.728"/></svg></span>
    <span class="tb-lang" title="Українська (Україна)">УКР</span>
    <span class="tb-clock" id="clock"></span>
  </div>
</footer>

<section id="start" hidden>
  <div class="st-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="stQ" placeholder="Пошук застосунків, файлів і папок" spellcheck="false" autocomplete="off"></div>
  <div class="st-body" id="stBody"></div>
  <div class="st-foot"><button class="st-user" title="Учень (admin)"><span class="av">У</span>Учень</button><button class="tb-btn" id="powerBtn" title="Живлення"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button></div>
</section>

<div id="boot" class="on"><svg width="64" height="64" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="10.5" y="1" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="1" y="10.5" width="8.5" height="8.5" fill="#4cc2ff"/><rect x="10.5" y="10.5" width="8.5" height="8.5" fill="#4cc2ff"/></svg><i class="spin"></i><span>Ласкаво просимо</span></div>
<div id="toast"></div>
<script type="module">
  // На телефоні емулятор не запускається: екран замалий для вікон і панелі завдань — показуємо повідомлення,
  // яке не можна закрити. Планшет і комп'ютер працюють повноцінно. Якщо на комп'ютері звузити вікно браузера,
  // повідомлення з'являється, а після розширення — зникає, і робота продовжується.
  const small = () => innerWidth < 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 600);
  const block = document.getElementById('smallScreen');
  let started = false;
  const check = () => {
    const s = small();
    document.documentElement.classList.toggle('phone', s);
    block.hidden = !s;
    for (const el of document.body.children) if (el !== block) el.inert = s;
    if (!s && !started) { started = true; import('./windowsemu/js/main.js'); }
  };
  check();
  addEventListener('resize', check);
  addEventListener('orientationchange', check);
</script>
</body>
</html>
