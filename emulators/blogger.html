<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор блогера · Edvault</title>
<meta name="description" content="Навчальний симулятор блогера: телефон із соцмережею «Лайкер». Створюйте фото, відео й дописи, стежте за реакціями вигаданих підписників, аналітикою, безпекою й цифровим етикетом.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bloggeremu/app.css">
</head>
<body>
<main class="stage">
  <div class="phone" aria-label="Телефон">
    <div class="screen" id="screen">
      <div class="sbar" aria-hidden="true"><span class="sb-time">16:00</span><i class="island"></i><span class="sb-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20v-3M9 20v-7M14 20v-11M19 20V5"/></svg><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01"/></svg><span class="sb-bat"></span></span></div>
      <div id="app" class="app"></div>
      <button class="homebar" aria-label="На головний екран"><i></i></button>
    </div>
  </div>
  <aside class="panel" aria-label="Керування часом">
    <header class="pn-h"><b>Симулятор блогера</b><small>Навчальний телефон · Edvault</small></header>
    <section class="pn-card"><div class="pn-time"><b>16:00</b><small>Понеділок</small></div>
      <p class="pn-l">Швидкість часу</p><div class="pn-speed" role="group" aria-label="Швидкість часу"></div>
      <p class="pn-l">Перемотати</p><div class="pn-jump"><button data-jump="hour">+1 година</button><button data-jump="evening">До вечора</button><button data-jump="morning">До ранку</button><button data-jump="day">+1 день</button></div></section>
    <section class="pn-card pn-stats"></section>
    <p class="pn-note">Усі люди, коментарі й повідомлення тут вигадані. Пробуйте сміливо: створюйте дописи, відповідайте на коментарі, налаштовуйте безпеку — і дивіться, як реагують підписники.</p>
    <button class="pn-reset" data-reset>Почати заново</button>
  </aside>
</main>
<div id="boot" class="boot"><svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="13" fill="#e1306c"/><path d="M24 35s-10-6.2-13-12.6A7 7 0 0 1 24 15.5a7 7 0 0 1 13 6.9C34 28.8 24 35 24 35z" fill="#fff"/></svg></div>
<script type="module" src="bloggeremu/js/app.js"></script>
</body>
</html>
