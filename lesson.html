<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Урок — Edvault</title>
  <script>try{var t=localStorage.getItem('edvault-theme')||'auto';document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';var f=localStorage.getItem('edvault_lesson_fs');if(f)document.documentElement.style.setProperty('--fs',f)}catch(e){}</script>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://edvault-d4a7f-default-rtdb.firebaseio.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="modulepreload" href="firebase-config.js" />
  <link rel="modulepreload" href="portal-common.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css" />
  <!-- очищення HTML уроку; вантажиться паралельно з даними -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" onload="window.__purify&&window.__purify()" onerror="window.__purifyFail=1;window.__purify&&window.__purify()"></script>

  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }
    :root { --fs: 1; }

    .crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; font-size: 12.5px; }
    .crumbs a { color: var(--muted); text-decoration: none; white-space: nowrap; padding: 3px 5px; border-radius: 5px; }
    .crumbs a:hover { color: var(--accent); background: var(--bg); }
    .crumbs .sep { color: var(--subtle); flex-shrink: 0; }
    .crumbs .cur { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 0 5px; }
    .crumbs .hide-md { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .1s linear; }

    .layout { flex: 1; display: flex; min-height: 0; position: relative; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; scroll-behavior: smooth; }
    .main.frame { overflow: hidden; }

    /* ── Вкладки сторінок ── */
    .tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; padding: 0 12px; overflow-x: auto; flex-shrink: 0; scrollbar-width: thin; position: sticky; top: 0; z-index: 5; }
    .tab { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
    .tab:hover { color: var(--text); }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .num { font-size: 11px; color: var(--subtle); }

    /* ── Стаття ── */
    .article-wrap { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px 32px 56px; flex: 1; }
    .article { font-family: 'Lora', Georgia, serif; color: var(--text); line-height: 1.78; font-size: calc(16px * var(--fs)); overflow-wrap: break-word; }
    .article > :first-child { margin-top: 0; }
    .article h1 { font-size: 1.75em; font-weight: 700; line-height: 1.28; margin: 0 0 .6em; letter-spacing: -.01em; }
    .article h2 { font-size: 1.32em; font-weight: 600; margin: 1.7em 0 .55em; line-height: 1.35; }
    .article h3 { font-size: 1.08em; font-weight: 600; margin: 1.4em 0 .45em; }
    .article h1, .article h2, .article h3 { scroll-margin-top: 60px; }
    .article p { margin-bottom: .9em; }
    .article ul, .article ol { margin: 0 0 .9em 1.4em; }
    .article li { margin-bottom: .35em; }
    .article code { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; font-size: .86em; background: var(--surface2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; color: #c0392b; }
    :root[data-theme="dark"] .article code { color: #ff9a8b; }
    .article pre { position: relative; background: #1e2433; border-radius: var(--r); padding: 16px 18px; overflow-x: auto; margin-bottom: 1em; line-height: 1.55; }
    .article pre code { background: none; border: 0; color: #e2e8f0; padding: 0; font-size: .84em; }
    .copy { position: absolute; top: 8px; right: 8px; height: 26px; padding: 0 9px; border-radius: 6px; background: rgba(255,255,255,.1); color: #cbd5e1; font: 500 11.5px var(--font); opacity: 0; transition: opacity .15s, background .15s; }
    .article pre:hover .copy, .copy:focus-visible { opacity: 1; }
    .copy:hover { background: rgba(255,255,255,.2); color: #fff; }
    .article blockquote { border-left: 3px solid var(--accent); margin: 0 0 1em; padding: 10px 16px; background: var(--accent-bg); border-radius: 0 var(--r) var(--r) 0; }
    .article img, .article video, .article iframe { max-width: 100%; border-radius: var(--r); margin: .6em 0; }
    .article img { height: auto; }
    .article a { color: var(--accent); }
    .article hr { border: 0; border-top: 1px solid var(--border); margin: 1.8em 0; }
    .article .tbl { overflow-x: auto; margin-bottom: 1em; }
    .article table { width: 100%; border-collapse: collapse; font-size: .92em; }
    .article th { background: var(--surface2); font-weight: 600; }
    .article th, .article td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }

    /* ── Окрема HTML-сторінка ── */
    .frame-box { flex: 1; display: flex; min-height: 0; background: #fff; }
    .frame-box iframe { flex: 1; width: 100%; border: 0; display: block; }

    /* ── Зміст ── */
    .toc { width: 250px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 18px 10px 24px; }
    .toc-title { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--subtle); padding: 0 10px 8px; }
    .toc a { display: block; padding: 5px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
    .toc a:hover { background: var(--bg); color: var(--text); }
    .toc a.on { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); }
    .toc a.l3 { padding-left: 22px; font-size: 12px; }
    body.no-toc .toc { display: none; }

    /* ── Посилання й матеріали ── */
    .panels { border-top: 1px solid var(--border); background: var(--surface); padding: 22px 32px 28px; display: flex; gap: 32px; flex-wrap: wrap; flex-shrink: 0; }
    .panel { flex: 1; min-width: 220px; }
    .panel-title { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--subtle); margin-bottom: 10px; }
    .panel-title svg { width: 14px; height: 14px; }
    .plink { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--r); text-decoration: none; color: var(--muted); font-size: 13px; border: 1px solid transparent; }
    .plink:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-lt); }
    .plink svg { width: 14px; height: 14px; color: var(--subtle); }
    .plink:hover svg { color: var(--accent); }
    .plink span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plink em { font-style: normal; font-size: 10px; font-weight: 700; color: var(--subtle); background: var(--bg); padding: 2px 6px; border-radius: 4px; }

    /* ── Гортання сторінок ── */
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 32px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .pager .btn { height: 36px; max-width: 42%; }
    .pager .btn span { overflow: hidden; text-overflow: ellipsis; }
    .pager-info { font-size: 12px; color: var(--subtle); white-space: nowrap; }

    .state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px; color: var(--subtle); text-align: center; }
    .state svg { width: 48px; height: 48px; color: var(--border2); }
    .state strong { font-size: 16px; color: var(--muted); }
    .state p { font-size: 13px; line-height: 1.6; }
    .state a { color: var(--accent); }
    .skel-line { height: 14px; margin-bottom: 12px; }

    /* ── Режим фокусу / повний екран ── */
    body.focus .topbar, body.focus .tabs, body.focus .pager, body.focus .toc { display: none !important; }
    .exit-focus { display: none; position: fixed; top: 12px; right: 12px; z-index: 99; width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border2); box-shadow: var(--sh); color: var(--muted); align-items: center; justify-content: center; }
    .exit-focus svg { width: 16px; height: 16px; }
    body.focus .exit-focus { display: flex; }
    .tag-pill { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; border-radius: 20px; font-size: 10.5px; font-weight: 600; flex-shrink: 0; }

    @media (max-width: 1100px) { .toc { display: none; } }
    @media (max-width: 700px) {
      .article-wrap { padding: 22px 16px 40px; }
      .panels { padding: 16px; gap: 18px; }
      .pager { padding: 10px 12px; }
      .crumbs .hide-md, .crumbs .sep.hide-md { display: none; }
      .btn-label { display: none; }
    }
    @media print {
      body { overflow: visible; height: auto; }
      .layout, .main { display: block; overflow: visible; }
      .tabs, .pager, .toc, .copy, .exit-focus { display: none !important; }
      .article-wrap { max-width: none; padding: 0; }
      .panels { border: 0; padding: 20px 0 0; }
    }
  </style>
</head>
<body class="no-toc">

<header class="topbar">
  <a href="materials.html" class="brand" aria-label="Edvault — до матеріалів"><span class="brand-mark" id="brandMark"></span></a>
  <div class="topbar-div"></div>
  <nav class="crumbs" id="crumbs" aria-label="Шлях">
    <a href="materials.html">Матеріали</a><span class="sep">›</span><span class="cur">Завантаження…</span>
  </nav>
  <div class="topbar-actions">
    <button class="icon-btn" id="btnFont" title="Розмір тексту" aria-label="Розмір тексту" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 9 6l5 14M5.8 15h6.4M15 20l3.5-9 3.5 9M16.2 17h4.6"/></svg></button>
    <button class="icon-btn" id="btnToc" title="Зміст" aria-label="Зміст" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="icon-btn" id="btnFocus" title="Режим фокусу (F)" aria-label="Режим фокусу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="icon-btn" id="btnTheme"></button>
    <button class="btn btn-ghost" id="btnDownload" title="Завантажити урок файлом" hidden><span id="dlIco"></span><span class="btn-label">Завантажити</span></button>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="layout">
  <main class="main" id="main">
    <div class="article-wrap" id="loading" aria-busy="true">
      <div class="skeleton" style="height:30px;width:60%;margin-bottom:24px"></div>
      <div class="skeleton skel-line" style="width:100%"></div><div class="skeleton skel-line" style="width:94%"></div><div class="skeleton skel-line" style="width:97%"></div><div class="skeleton skel-line" style="width:70%"></div>
    </div>
  </main>
  <aside class="toc" id="toc" aria-label="Зміст сторінки"></aside>
</div>

<button class="exit-focus" id="btnExitFocus" title="Показати панелі (Esc)" aria-label="Показати панелі"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg></button>

<script type="module">
  import { dbGet } from './firebase-config.js';
  import { ICON, esc, safeUrl, store, initThemeToggle, rememberLesson, toast } from './portal-common.js';

  const $ = id => document.getElementById(id);
  const main = $('main');
  $('brandMark').innerHTML = ICON.book; $('dlIco').outerHTML = ICON.download;
  initThemeToggle($('btnTheme'));

  const params = new URLSearchParams(location.search);
  const lessonId = params.get('id');
  let pageIdx = Math.max(0, parseInt(params.get('page') || '0', 10) || 0);
  let lesson = null, pages = [], subjName = '';

  // DOMPurify вантажиться паралельно з уроком
  const purifyReady = new Promise(res => {
    if (window.DOMPurify || window.__purifyFail) return res();
    window.__purify = res;
    setTimeout(res, 6000);
  });

  // ══════════ Кеш уроків ══════════
  // Урок показується миттєво з кешу, а в цей час перевіряємо, чи не змінився він у базі.
  const CK = id => 'edvault_lesson:' + id;
  const CACHE_MAX = 1_500_000, FRESH_MS = 60 * 1000, KEEP = 12;
  function readCache(id) { const c = store.get(CK(id)); return c && c.lesson ? c : null; }
  function writeCache(id, l, info = null) {
    const s = JSON.stringify({ ts: Date.now(), lesson: l, info });
    if (s.length > CACHE_MAX) return;
    const idx = (store.get('edvault_lesson_idx', []) || []).filter(x => x !== id);
    idx.unshift(id);
    idx.slice(KEEP).forEach(old => store.del(CK(old)));
    try { localStorage.setItem(CK(id), s); store.set('edvault_lesson_idx', idx.slice(0, KEEP)); }
    catch { idx.slice(1).forEach(old => store.del(CK(old))); } // місця немає — звільняємо
  }

  // назви предмета, папки й тегу — з кешу порталу, інакше одним маленьким запитом
  const portal = (store.get('edvault_portal_v2') || {}).d || null;
  async function lookup(l, known) {
    if (known && known.sid === l.subjectId && known.tid === (l.tagId || null)) return known;
    const out = { subj: portal?.subjects?.[l.subjectId] || null, tag: l.tagId ? portal?.tags?.[l.tagId] || null : null, path: folderPath(l.folderId) };
    const jobs = [];
    if (l.subjectId && !out.subj) jobs.push(dbGet(`/subjects/${l.subjectId}/name`).then(v => { out.subj = v ? { name: v } : null; }).catch(() => {}));
    if (l.tagId && !out.tag) jobs.push(dbGet(`/tags/${l.tagId}`).then(v => { out.tag = v; }).catch(() => {}));
    await Promise.all(jobs);
    return { ...out, sid: l.subjectId, tid: l.tagId || null };
  }

  // шлях папок — лише з кешу порталу (окремо не читаємо)
  function folderPath(fid) {
    const F = portal?.folders || {}, path = [];
    while (fid && F[fid] && path.length < 20) { path.unshift({ id: fid, name: F[fid].name }); fid = F[fid].parentId; }
    return path;
  }
  function normalizePages(l) {
    if (Array.isArray(l.pages) && l.pages.length) return l.pages.filter(Boolean);
    return [{ id: 'p0', title: 'Урок', htmlContent: l.htmlContent || '<p>Вміст відсутній.</p>', isolated: false }];
  }

  async function load() {
    if (!lessonId) return showError();
    const cached = readCache(lessonId);
    if (cached) { await show(cached.lesson, cached.info); if (Date.now() - cached.ts < FRESH_MS) return; }
    try {
      const fresh = await dbGet(`/lessons/${lessonId}`);
      if (!fresh) { if (!cached) showError(); return; }
      const changed = !cached || JSON.stringify(fresh) !== JSON.stringify(cached.lesson);
      if (changed) { await show(fresh, cached && cached.info); if (cached) toast('Урок оновлено', 'ok', 1800); }
      writeCache(lessonId, fresh, lastInfo);
    } catch (e) {
      console.error(e);
      if (!cached) showError('Не вдалося завантажити урок', 'Перевірте з’єднання з інтернетом і оновіть сторінку.');
    }
  }

  let lastInfo = null;
  async function show(l, known) {
    lesson = l; pages = normalizePages(l);
    pageIdx = Math.min(pageIdx, pages.length - 1);
    document.title = `${l.title || 'Урок'} — Edvault`;
    $('btnDownload').hidden = false;
    await renderPage(false);
    renderCrumbs(l, known || { subj: portal?.subjects?.[l.subjectId], tag: portal?.tags?.[l.tagId], path: folderPath(l.folderId) });
    lastInfo = await lookup(l, known);
    renderCrumbs(l, lastInfo);
  }

  function renderCrumbs(l, info) {
    const s = info.subj, path = info.path || [];
    const subjUrl = `materials.html?subject=${encodeURIComponent(l.subjectId || '')}`;
    $('crumbs').innerHTML = `<a href="materials.html" class="hide-md">Матеріали</a><span class="sep hide-md">›</span>` +
      (s ? `<a href="${subjUrl}" class="hide-md">${esc(s.name)}</a><span class="sep hide-md">›</span>` : '') +
      path.map(p => `<a href="${subjUrl}&folder=${encodeURIComponent(p.id)}" class="hide-md">${esc(p.name)}</a><span class="sep hide-md">›</span>`).join('') +
      `<span class="cur" title="${esc(l.title || '')}">${esc(l.title || 'Урок')}</span>` +
      (info.tag ? `<span class="tag-pill" style="background:${esc(info.tag.bg)};color:${esc(info.tag.text)}">${esc(info.tag.name)}</span>` : '');
    if (s) subjName = s.name;
    rememberLesson({ id: lessonId, title: l.title || 'Урок', subj: subjName, page: pageIdx || 0 });
  }

  // ══════════ Сторінка уроку ══════════
  let tocObserver = null;
  async function renderPage(scrollTop = true) {
    const page = pages[pageIdx] || pages[0];
    const multi = pages.length > 1;
    if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
    main.classList.toggle('frame', !!page.isolated);
    const frag = document.createDocumentFragment();

    if (multi) {
      const tabs = document.createElement('div');
      tabs.className = 'tabs'; tabs.setAttribute('role', 'tablist');
      tabs.innerHTML = pages.map((p, i) => `<button class="tab${i === pageIdx ? ' on' : ''}" role="tab" aria-selected="${i === pageIdx}" data-page="${i}"><span class="num">${i + 1}</span>${esc(p.title || `Сторінка ${i + 1}`)}</button>`).join('');
      frag.appendChild(tabs);
    }

    let article = null;
    if (page.isolated) {
      // окремий HTML-документ — у пісочниці, зовнішні посилання відкриваються в новій вкладці
      const box = document.createElement('div');
      box.className = 'frame-box';
      const iframe = document.createElement('iframe');
      iframe.title = page.title || 'Урок';
      iframe.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-same-origin allow-modals');
      iframe.setAttribute('allow', 'fullscreen; clipboard-write');
      const hook = `<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href')||'';if(h.charAt(0)==='#')return;e.preventDefault();if(h)window.open(a.href||h,'_blank','noopener');},true);<\/script>`;
      let html = page.htmlContent || '';
      html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, hook + '</head>') : hook + html;
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      iframe.src = url;
      iframe.addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
      box.appendChild(iframe);
      frag.appendChild(box);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'article-wrap';
      article = document.createElement('article');
      article.className = 'article';
      await purifyReady;
      const raw = page.htmlContent || '<p style="color:var(--subtle)">Вміст відсутній.</p>';
      article.innerHTML = window.DOMPurify ? DOMPurify.sanitize(raw, { ADD_ATTR: ['target', 'allowfullscreen'], ADD_TAGS: ['iframe'] }) : raw;
      enhance(article);
      wrap.appendChild(article);
      frag.appendChild(wrap);
    }

    // посилання й матеріали — під кожною сторінкою
    const links = (lesson.links || []).filter(x => safeUrl(x && x.url));
    const mats = (lesson.materials || []).filter(x => safeUrl(x && x.fileUrl));
    if (links.length || mats.length) {
      const p = document.createElement('div');
      p.className = 'panels';
      p.innerHTML = (links.length ? `<div class="panel"><div class="panel-title">${ICON.link}Корисні посилання</div>${links.map(x => `<a class="plink" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${ICON.ext}<span>${esc(x.title || x.url)}</span></a>`).join('')}</div>` : '') +
        (mats.length ? `<div class="panel"><div class="panel-title">${ICON.download}Матеріали</div>${mats.map(x => {
          const ext = (String(x.fileUrl).split(/[?#]/)[0].split('.').pop() || '').toUpperCase();
          return `<a class="plink" href="${esc(safeUrl(x.fileUrl))}" target="_blank" rel="noopener" download>${ICON.doc}<span>${esc(x.title || x.fileUrl)}</span>${ext && ext.length <= 4 ? `<em>${esc(ext)}</em>` : ''}</a>`;
        }).join('')}</div>` : '');
      frag.appendChild(p);
    }

    if (multi) {
      const prev = pages[pageIdx - 1], next = pages[pageIdx + 1];
      const nav = document.createElement('div');
      nav.className = 'pager';
      nav.innerHTML = `<button class="btn btn-line" data-page="${pageIdx - 1}" ${prev ? '' : 'disabled'}>${ICON.chevL}<span>${prev ? esc(prev.title || 'Попередня') : 'Попередня'}</span></button>
        <span class="pager-info">${pageIdx + 1} / ${pages.length}</span>
        <button class="btn ${next ? 'btn-solid' : 'btn-line'}" data-page="${pageIdx + 1}" ${next ? '' : 'disabled'}><span>${next ? esc(next.title || 'Наступна') : 'Наступна'}</span>${ICON.chevR}</button>`;
      frag.appendChild(nav);
    }

    main.replaceChildren(frag);
    if (scrollTop) main.scrollTop = 0;
    $('btnFont').hidden = !article;
    buildToc(article);
    updateProgress();
  }

  // гарні дрібниці в статті: якорі для заголовків, копіювання коду, ліниві картинки, таблиці з прокруткою
  function enhance(root) {
    root.querySelectorAll('img').forEach(img => { img.loading = 'lazy'; img.decoding = 'async'; });
    root.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href') || '';
      if (!safeUrl(h)) { a.removeAttribute('href'); return; }
      if (!h.startsWith('#')) { a.target = '_blank'; a.rel = 'noopener'; }
    });
    root.querySelectorAll('table').forEach(t => { if (!t.parentElement.classList.contains('tbl')) { const w = document.createElement('div'); w.className = 'tbl'; t.before(w); w.appendChild(t); } });
    root.querySelectorAll('pre').forEach(pre => {
      const b = document.createElement('button');
      b.className = 'copy'; b.type = 'button'; b.textContent = 'Копіювати';
      pre.appendChild(b);
    });
    let n = 0;
    root.querySelectorAll('h1, h2, h3').forEach(h => { if (!h.id) h.id = 'h-' + (++n); });
  }
  main.addEventListener('click', async e => {
    const c = e.target.closest('.copy');
    if (c) {
      const code = c.parentElement.cloneNode(true); code.querySelector('.copy')?.remove();
      try { await navigator.clipboard.writeText(code.textContent); c.textContent = 'Скопійовано'; }
      catch { c.textContent = 'Не вдалося'; }
      setTimeout(() => { c.textContent = 'Копіювати'; }, 1500);
      return;
    }
    const p = e.target.closest('[data-page]');
    if (p && !p.disabled) goPage(+p.dataset.page);
  });

  function goPage(i) {
    if (i < 0 || i >= pages.length || i === pageIdx) return;
    pageIdx = i;
    const url = new URL(location.href);
    if (i) url.searchParams.set('page', i); else url.searchParams.delete('page');
    history.replaceState(null, '', url);
    renderPage();
    rememberLesson({ id: lessonId, title: lesson.title || 'Урок', subj: subjName, page: i });
  }

  // ── Зміст ──
  let tocOpen = store.get('edvault_lesson_toc', true);
  function buildToc(article) {
    const toc = $('toc');
    const hs = article ? [...article.querySelectorAll('h1, h2, h3')].filter(h => h.textContent.trim()) : [];
    const has = hs.length >= 3;
    $('btnToc').hidden = !has;
    document.body.classList.toggle('no-toc', !has || !tocOpen);
    $('btnToc').classList.toggle('on', has && tocOpen);
    if (!has) { toc.innerHTML = ''; return; }
    const top = Math.min(...hs.map(h => +h.tagName[1]));
    toc.innerHTML = `<div class="toc-title">На цій сторінці</div>` + hs.map(h => `<a href="#${h.id}" class="l${Math.min(3, +h.tagName[1] - top + 2)}">${esc(h.textContent.trim())}</a>`).join('');
    const links = new Map([...toc.querySelectorAll('a')].map(a => [a.getAttribute('href').slice(1), a]));
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { links.forEach(a => a.classList.remove('on')); links.get(en.target.id)?.classList.add('on'); } });
    }, { root: main, rootMargin: '0px 0px -75% 0px' });
    hs.forEach(h => tocObserver.observe(h));
  }
  $('toc').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    document.getElementById(a.getAttribute('href').slice(1))?.scrollIntoView({ block: 'start' });
  });
  $('btnToc').addEventListener('click', () => {
    tocOpen = !tocOpen; store.set('edvault_lesson_toc', tocOpen);
    document.body.classList.toggle('no-toc', !tocOpen);
    $('btnToc').classList.toggle('on', tocOpen);
  });

  // ── Прогрес читання ──
  let progQueued = false;
  function updateProgress() {
    const max = main.scrollHeight - main.clientHeight;
    $('progress').style.width = (max > 4 ? Math.min(100, main.scrollTop / max * 100) : 0) + '%';
  }
  main.addEventListener('scroll', () => { if (progQueued) return; progQueued = true; requestAnimationFrame(() => { progQueued = false; updateProgress(); }); }, { passive: true });

  // ── Розмір тексту ──
  const SIZES = [0.9, 1, 1.12, 1.25, 1.4];
  $('btnFont').addEventListener('click', () => {
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 1;
    const next = SIZES[(SIZES.findIndex(v => Math.abs(v - cur) < 0.01) + 1) % SIZES.length];
    document.documentElement.style.setProperty('--fs', next);
    store.set('edvault_lesson_fs', String(next), true);
    toast(`Розмір тексту: ${Math.round(next * 100)}%`, '', 1200);
  });

  // ── Фокус і повний екран ──
  function setFocus(on) {
    document.body.classList.toggle('focus', on);
    if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen?.();
  }
  $('btnFocus').addEventListener('click', () => setFocus(true));
  $('btnExitFocus').addEventListener('click', () => setFocus(false));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('focus'); });
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' && pages.length > 1) { goPage(pageIdx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' && pages.length > 1) { goPage(pageIdx - 1); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') setFocus(!document.body.classList.contains('focus'));
    else if (e.key === 'Escape' && document.body.classList.contains('focus')) setFocus(false);
  });

  // ── Завантаження файлом ──
  $('btnDownload').addEventListener('click', () => {
    const page = pages[pageIdx];
    let html;
    const name = (lesson.title || 'урок').replace(/[\\/:*?"<>|]+/g, '').trim() || 'урок';
    if (page.isolated) html = page.htmlContent || '';
    else {
      // усі звичайні сторінки уроку — в одному файлі
      const body = pages.filter(p => !p.isolated).map((p, i, arr) => (arr.length > 1 ? `<h2 class="pg">${esc(p.title || `Сторінка ${i + 1}`)}</h2>` : '') + (window.DOMPurify ? DOMPurify.sanitize(p.htmlContent || '') : (p.htmlContent || ''))).join('\n');
      const li = (arr, key) => arr.filter(x => safeUrl(x[key])).map(x => `<li><a href="${esc(safeUrl(x[key]))}">${esc(x.title || x[key])}</a></li>`).join('');
      const links = li(lesson.links || [], 'url'), mats = li(lesson.materials || [], 'fileUrl');
      html = `<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(lesson.title || 'Урок')}</title>
<style>body{font-family:Georgia,'Times New Roman',serif;color:#1a1d23;max-width:800px;margin:40px auto;padding:0 24px 60px;line-height:1.75;font-size:17px}h1{font-size:30px;line-height:1.25}h2{font-size:22px;margin-top:1.6em}h2.pg{border-top:1px solid #e2e5ea;padding-top:1em;color:#4F6BF4}code{font-family:Consolas,monospace;font-size:.86em;background:#f3f4f6;padding:1px 6px;border-radius:4px;color:#c0392b}pre{background:#1e2433;color:#e2e8f0;padding:16px;border-radius:6px;overflow-x:auto}pre code{background:none;color:inherit}blockquote{border-left:3px solid #4F6BF4;margin:0 0 16px;padding:10px 16px;background:#eef0fe}img{max-width:100%}a{color:#4F6BF4}table{border-collapse:collapse;width:100%}th,td{border:1px solid #e2e5ea;padding:8px 12px;text-align:left}.extra{margin-top:40px;padding-top:16px;border-top:1px solid #e2e5ea}</style></head>
<body><h1>${esc(lesson.title || 'Урок')}</h1>${body}${links ? `<div class="extra"><h3>Корисні посилання</h3><ul>${links}</ul></div>` : ''}${mats ? `<div class="extra"><h3>Матеріали</h3><ul>${mats}</ul></div>` : ''}</body></html>`;
    }
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${name}${page.isolated && pages.length > 1 ? `_${pageIdx + 1}` : ''}.html` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  function showError(title = 'Урок не знайдено', text = 'Можливо, посилання застаріло або урок видалено.') {
    main.classList.remove('frame');
    main.innerHTML = `<div class="state">${ICON.alert}<strong>${esc(title)}</strong><p>${esc(text)}<br><a href="materials.html">До матеріалів</a></p></div>`;
    $('crumbs').innerHTML = `<a href="materials.html">Матеріали</a>`;
  }

  load();
</script>
</body>
</html>
