<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тренажери · Edvault</title>
<meta name="description" content="Тренажери для учнів з рівнями й зірками: мишка, файли й папки, сліпий друк, алгоритми з роботом, перо й колір.">
<meta name="theme-color" content="#4F6BF4">
<link rel="icon" href="/icons/trainers.ico" sizes="32x32">
<link rel="icon" href="/icons/trainers.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/trainers-180.png">
<script>
  (function () {
    try {
      var t = localStorage.getItem('edvault-theme') || 'auto';
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/catalog.css">
<!-- og -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Edvault">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Тренажери для учнів · Edvault">
<meta property="og:description" content="Мишка, файли й папки, безпека в інтернеті, сліпий друк, алгоритми, мережі — з рівнями й зірками.">
<meta property="og:url" content="https://www.edvault.online/trainers/">
<meta property="og:image" content="https://www.edvault.online/assets/og/trainers.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Тренажери для учнів — Edvault">
<meta name="twitter:card" content="summary_large_image">
<!-- /og -->
</head>
<body>
<div id="app"></div>
<script type="module">
import { mountCatalog } from '/assets/catalog.js';
mountCatalog('trainers');
</script>
</body>
</html>
